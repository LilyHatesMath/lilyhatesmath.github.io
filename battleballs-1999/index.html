// 强梁有独立血条，不再跟着梁月同步；梁月倒下时强梁跟着散
function syncStrongHp(ly){
  if(ly.hp>0) return;
  for(const s of balls){
    if(s.skillType!=='qiangliang' || s.team!==ly.team || s.hp<=0) continue;
    s.hp=0; s.dead=true; hudDirty=true;
  }
}

function liangOnHit(b){
  const ly=balls.find(x=>x.skillType==='liangyue' && x.team===b.team && x.hp>0);
  if(b.skillType==='qiangliang'){
    if(!ly) return;
    ly.hitStrong++; ly.passion++;
  }else{
    b.hitSelf++;
  }
  if(!ly || !hasStrong(b.team)) return;
  ly.claw++;
  const need=ly.shenxing>0?Math.max(1,ly.clawNeed-1):ly.clawNeed;
  addText(ly.x,ly.y-ly.r-62,'爪痕 '+ly.claw+'/'+need,'#9ef0c8');
  if(ly.claw>=need) triggerClaw(ly);
}

function triggerClaw(ly){
  const strong=balls.find(x=>x.skillType==='qiangliang' && x.team===ly.team && x.hp>0);
  ly.claw=0;
  if(!strong) return;
  const incSelf=ly.hitSelf-ly.snapSelf, incStrong=ly.hitStrong-ly.snapStrong;
  ly.snapSelf=ly.hitSelf; ly.snapStrong=ly.hitStrong;
  // 【神行】：本次触发若靠它省掉了爪痕，就消耗一层
  const usedShenxing=ly.shenxing>0;
  if(usedShenxing){ ly.shenxing--; addText(ly.x,ly.y-106,'神行 -1','#7fe6c0'); }
  let dmg=strong.atk, opts=null, tag='八灵震慴', clawColor=CLAW_COLOR_TIE;
  if(incStrong>incSelf){ dmg+=4; opts={poison:4,burn:20}; tag='八灵震慴·强梁'; clawColor=CLAW_COLOR_STRONG; }
  else if(incSelf>incStrong){ dmg+=10; tag='八灵震慴·梁月+10'; clawColor=CLAW_COLOR_SELF; }
  else {
    dmg+=SHENXING_DMG;
    ly.shenxing=Math.min(SHENXING_MAX,ly.shenxing+1);
    tag='八灵震慴·神行+'+SHENXING_DMG;
    clawColor=CLAW_COLOR_TIE;
    addText(ly.x,ly.y-84,'获得【神行】','#7fe6c0');
  }
  // 鲈鱼：下一次全体命中伤害翻倍
  if(strong.liyu){ dmg*=2; strong.liyu=0; tag+='·鲈鱼'; }
  seStrongEight();
  addText(strong.x,strong.y-strong.r-40,tag,'#5fe0b0');
  burst(strong.x,strong.y,'#5fe0b0',26);
  opts=Object.assign({},opts,{chase:1,claw:clawColor});
  aoeHit(strong,dmg,'#5fe0b0',opts,LIANG_AOE_TARGETS);
}

/* ---- 星锑 ---- */
function spawnRing(b){
  rings.push({x:b.x,y:b.y,r:b.r,speed:SONIC_RING_SPEED,hit:[],owner:b,life:1,color:b.color});
}

function step(dt){
  if(state!=='fight'||over) return;
  shieldPoolTick(dt);
  paperTick(dt);
  if(argusSights.length){
    for(const sg of argusSights) sg.t-=dt;
    argusSights=argusSights.filter(sg=>sg.t>0);
  }

  for(const b of balls.slice()){
    if(b.hp<=0) continue;
    b.hurtCd=Math.max(0,b.hurtCd-dt);
    // 状态徽标计时：女巫帽 / 扫把 / 爪痕 / 鹰爪
    b.hatT=Math.max(0,(b.hatT||0)-dt);
    b.merRingT=Math.max(0,(b.merRingT||0)-dt);
    b.marcusBookT=Math.max(0,(b.marcusBookT||0)-dt);
    b.broomT=Math.max(0,(b.broomT||0)-dt);
    b.clawT=Math.max(0,(b.clawT||0)-dt);
    b.eagleClawT=Math.max(0,(b.eagleClawT||0)-dt);
    b.shadowT=Math.max(0,(b.shadowT||0)-dt);
    b.tauntT=Math.max(0,(b.tauntT||0)-dt);
    b.reedWitherT=Math.max(0,(b.reedWitherT||0)-dt);
    b.reedSproutT=Math.max(0,(b.reedSproutT||0)-dt);
    b.reedBareT=Math.max(0,(b.reedBareT||0)-dt);
    if(b.berryCd>0) b.berryCd=Math.max(0,b.berryCd-dt);
    b.hitCd=Math.max(0,b.hitCd-dt);
    b.counterCd=Math.max(0,(b.counterCd||0)-dt);   // 【反击】内置 CD
    b.flash=Math.max(0,b.flash-dt*4);
    b.skillCd=Math.max(0,b.skillCd-dt);
    b.poisonCd=Math.max(0,b.poisonCd-dt);
    b.storyHitCd=Math.max(0,b.storyHitCd-dt);
    b.marcusCd=Math.max(0,(b.marcusCd||0)-dt);
    // 【眩晕】：被小马撞到后停止攻击，期间技能计时暂停推进
    if((b.stunT||0)>0){
      b.stunT=Math.max(0,b.stunT-dt);
      // 眩晕只冻结技能冷却，不能连隐身/虚化/变身/驾驶/愈合这些状态计时一起拖长
      for(const k of STUN_FREEZE_KEYS){
        if(typeof b[k]==='number') b[k]+=dt;
      }
    }
    b.passionCd=Math.max(0,(b.passionCd||0)-dt);
    b.semePaid=Math.max(0,(b.semePaid||0)-dt);
    if(b.skillType==='s37'){
      b.spiritCd=Math.max(0,(b.spiritCd||0)-dt);
      // 【数字世界】：敌方进入领域的那一下 +1 灵光
      const R=b.r*2*SPIRIT_RANGE;
      let inside=false;
      for(const e of balls){
        if(e.hp<=0 || e.team===b.team) continue;
        if(Math.hypot(e.x-b.x,e.y-b.y) < R+e.r){ inside=true; break; }
      }
      if(inside && !b.spiritIn && (b.spiritCd||0)<=0){ spiritAdd(b,1); b.spiritCd=SPIRIT_NEAR_CD; }
      b.spiritIn=inside;
      // 集齐5点：延迟0.5秒放三角
      if((b.spiritT||0)>0){
        b.spiritT-=dt;
        if(b.spiritT<=0){
          b.spiritT=0;
          if((b.spirit||0)>=SPIRIT_NEED){
            b.spirit-=SPIRIT_NEED;
            fireTri(b,nearestFoe(b),Math.hypot(b.vx,b.vy)||200);
          }
        }
      }else if((b.spirit||0)>=SPIRIT_NEED){
        b.spiritT=SPIRIT_DELAY;
      }
    }
    const foe=nearestFoe(b);

    // 【燃烧】：每2秒结算1点伤害，每5秒层数减半；J 自身的燃烧不掉层也不掉血
    if(b.burn>0){
      b.burnTick-=dt;
      if(b.burnTick<=0){
        b.burnTick=BURN_TICK;
        if(b.skillType!=='joe'){
          addText(b.x,b.y-b.r-30,'燃烧 -1','#ff8a4c');
          applyDamage(b,1,'#ff8a4c');
        }
      }
      if(b.skillType!=='joe'){
        b.burnHalf=(b.burnHalf||BURN_HALF)-dt;
        if(b.burnHalf<=0){
          b.burnHalf=BURN_HALF;
          b.burn=Math.floor(b.burn/2);
          if(b.burn<=0) addText(b.x,b.y+b.r+22,'火灭了','#8a6a5a');
        }
      }
    }
    // 【光晕】：每2秒结算1点伤害，每5秒层数减半
    if(b.halo>0){
      b.haloTick=(b.haloTick||BURN_TICK)-dt;
      if(b.haloTick<=0){
        b.haloTick=BURN_TICK;
        addText(b.x,b.y-b.r-30,'光晕 -1','#ffe9a8');
        applyDamage(b,1,'#ffe9a8');
      }
      b.haloHalf=(b.haloHalf||BURN_HALF)-dt;
      if(b.haloHalf<=0){
        b.haloHalf=BURN_HALF;
        const hb0=b.halo;
        b.halo=Math.floor(b.halo/2);
        // 【偏折】：光晕层数减半也算“失去”
        haloLose(b,hb0-b.halo);
      }
    }

    if(b.skillType==='twins'){
      // 【术具】：同调值靠术具咒语累积，合体改由同调值之和达到 100 时触发
      b.twinTick-=dt;
      if(b.twinTick<=0){ b.twinTick=TWIN_ATK_TICK; }
    }

    if(b.skillType==='twinsM'){
      b.mergeT-=dt;
      if(b.mergeT<=0){ splitTwins(b); continue; }
    }

    if(b.skillType==='cornerstone'){
      b.aoeCd=Math.max(0,b.aoeCd-dt);
    }

    if(b.skillType==='apple'){
      b.appleT=Math.max(0,(b.appleT||0)-dt);
      if(b.appleT<=0){ b.appleT=APPLE_CD; fireBeam(b); }
    }

    if(b.slowT>0) b.slowT=Math.max(0,b.slowT-dt);

    if(b.skillType==='ulrich'){
      // 先吟诵2秒（自身减速70%），念完才放闪电链，之后进入4秒冷却
      if(b.castT>0){
        b.castT=Math.max(0,b.castT-dt);
        b.slowAmt=ELEC_CAST_SLOW;
        b.slowT=Math.max(b.slowT,b.castT);
        if(b.castT<=0){ b.ulrichT=ULRICH_CD; b.slowAmt=ELEC_SLOW; fireChain(b); }
      }else{
        b.ulrichT=Math.max(0,(b.ulrichT||0)-dt);
        if(b.ulrichT<=0){ b.castT=ULRICH_CAST; seUlrich(); b.slowAmt=ELEC_CAST_SLOW; b.slowT=Math.max(b.slowT,ULRICH_CAST); }
      }
    }

    if(b.skillType==='lucy'){
      const lv3=fieldOf(b.team).lv===3;
      if(lv3!==b.luciLv3){
        b.luciLv3=lv3;
        if(lv3){
          b.luciMag=LUCI_MAG; b.luciReload=0; b.luciT=LUCI_CD;
          addText(b.x,b.y-b.r-64,'装填完成',LUCI_COLOR);
        }
      }
      if(b.luciReload>0){
        b.luciReload=Math.max(0,b.luciReload-dt);
        if(b.luciReload<=0) b.luciMag=LUCI_MAG;
      }else{
        b.luciT=Math.max(0,(b.luciT||0)-dt);
        if(b.luciT<=0){
          b.luciT=LUCI_CD;
          if(b.luciMag>0){
            b.luciMag--; fireShellVolley(b);
            if(b.luciMag<=0) b.luciReload=LUCI_RELOAD;
          }
        }
      }
    }

    if(b.skillType==='charon'){
      // 虞美人飞行/绽放期间不计冷却，消失后才进7秒冷却
      if(b.charonT<=0){
        if(!poppies.some(f=>f.owner===b) && !projs.some(p=>p.type==='poppy'&&p.owner===b)){
          throwPoppy(b);
          b.charonT=CHARON_FLY+CHARON_STAY;  // 先占位，虞美人谢了再重置成7秒
        }
      }else{
        b.charonT=Math.max(0,b.charonT-dt);
      }
    }

    if(b.skillType==='brume'){
      // 【阿黛拉】上车驾驶3秒，结束后进入10秒冷却
      if(b.grayDriveT>0){
        b.grayDriveT=Math.max(0,b.grayDriveT-dt);
        if(b.grayDriveT<=0) b.grayDriveCd=GRAY_DRIVE_CD;
      }else{
        b.grayDriveCd=Math.max(0,(b.grayDriveCd||0)-dt);
        if(b.grayDriveCd<=0){
          b.grayDriveT=GRAY_DRIVE_DUR;
          seGrayDrive();
          const cur=Math.hypot(b.vx,b.vy)||1;
          const nsp=Math.min(maxSp(b),cur+GRAY_DRIVE_SPEED);
          b.vx*=nsp/cur; b.vy*=nsp/cur;
          spiritTeamSkill(b);
          spiritTeamSkill(b);
          addText(b.x,b.y-b.r-46,'阿黛拉·驾驶',GRAY_COLOR);
          burst(b.x,b.y,GRAY_COLOR,10);
        }
      }
      // 【费西利安】每3秒开出一次【风景的代价】，独立冷却
      b.grayFareCd=Math.max(0,(b.grayFareCd||0)-dt);
      if(b.grayFareCd<=0){ b.grayFareCd=GRAY_FARE_CD; fireFare(b); }
    }

    if(b.skillType==='marcus') marcusTick(b,dt);
    if((b.merTraceT||0)>0) b.merTraceT=Math.max(0,b.merTraceT-dt);
    if(b.skillType==='mercuria') merTick(b,dt);
    if(b.skillType==='argus') argusTick(b,dt);

    if(b.skillType==='semmelweis'){
      if(b.semePhase){
        b.semeT-=dt;
        if(b.semePhase==='wind'){
          b.vx=0; b.vy=0;
          if(b.semeT<=0){
            const foe=nearestFoe(b);
            b.semeHit=false;
            if(foe){
              const ang=Math.atan2(foe.y-b.y,foe.x-b.x);
              b.vx=Math.cos(ang)*SEME_DASH; b.vy=Math.sin(ang)*SEME_DASH;
            }else{
              const cur=Math.hypot(b.vx,b.vy)||1;
              b.vx*=SEME_DASH/cur; b.vy*=SEME_DASH/cur;
            }
            b.semePhase='dash'; b.semeT=SEME_DASH_DUR;
            seSemeDash();
            addText(b.x,b.y-b.r-46,'真实显露',SEME_COLOR);
          }
        }else if(b.semePhase==='dash'){
          const sp=Math.hypot(b.vx,b.vy)||1;
          b.vx*=SEME_DASH/sp; b.vy*=SEME_DASH/sp;
          if(b.semeT<=0){ b.semeDir=Math.atan2(b.vy,b.vx); b.semePhase='stop'; b.semeT=SEME_STOP; b.vx=0; b.vy=0; }
        }else{
          b.vx=0; b.vy=0;
          if(b.semeT<=0){
            if(b.semeHit && !b.semeBoomed) semeBoom(b);
            b.semeHit=false; b.semeBoomed=false;
            b.semePhase=null; b.semeT=0; b.semeCd=SEME_CD;
            // 冲刺收尾后把速度还给小球，否则它会一直僵在原地
            const dir=(b.semeDir!=null)?b.semeDir:Math.random()*Math.PI*2;
            const sp0=Math.max(430,b.speedMax*0.62);
            b.vx=Math.cos(dir)*sp0; b.vy=Math.sin(dir)*sp0;
            b.semeDir=null;
          }
        }
      }else{
        b.semeCd=Math.max(0,(b.semeCd||0)-dt);
        if(b.semeCd<=0){
          b.semePhase='wind'; b.semeT=SEME_WIND; b.semeHit=false; b.semeBoomed=false;
          addText(b.x,b.y-b.r-46,'停车',SEME_COLOR);
        }
      }
    }

    if(b.skillType==='coppelia'){
      // 【术具】版本：不再每 19 秒点名，改成每 9 秒同调值 +15
      b.enamelT=Math.max(0,(b.enamelT||0)-dt);
      if(b.enamelT<=0){
        b.enamelT=9;
        addTune(b,15);
        addText(b.x,b.y-b.r-30,'同调 +15',ENAMEL_COLOR);
        burst(b.x,b.y,ENAMEL_COLOR,8);
      }
    }

    if(b.skillType==='babel'){
      // 窗口与次数改由全队共享池 shieldPool 统一推进
    }

    if(b.skillType==='matilda'){
      b.matildaCd=Math.max(0,(b.matildaCd||0)-dt);
      matildaPrideTickW(b,dt);
      if(b.matildaCd<=0 && !(b.stunT>0)){ b.matildaCd=MATILDA_ORB_CD; matildaDivine(b,false); }
    }

    if(b.skillType==='rhiannon'){
      b.eagleT=Math.max(0,(b.eagleT||0)-dt);
      const eagle=balls.find(x=>x.skillType==='birdie' && x.team===b.team && x.hp>0);
      if(eagle && b.eagleT<=0){
        eagleRemove(b.team,false);
        eagleBuffOff(b);
      }
      if(b.passion>=RYAN_NEED){
        if(eagle && b.eagleT>0){
          b.passion=0; b.eagleT+=EAGLE_DUR; seRhianEagle();
          addText(b.x,b.y-b.r-30,'鹰 +9s',RYAN_COLOR);
        }else if(!eagle){
          b.passion=0; summonEagle(b);
        }
      }
    }

    if(b.skillType==='birdie'){
      // 共享血量：血条始终跟着主人
      const m=b.shareHost;
      if(!m || m.hp<=0){ if(m) eagleBuffOff(m); eagleRemove(b.team,true); continue; }
      b.hp=m.hp; b.maxhp=m.maxhp;
    }

    if(b.skillType==='liangyue'){
      b.strongT=Math.max(0,b.strongT-dt);
      syncStrongHp(b);
      const strong=balls.find(x=>x.skillType==='qiangliang' && x.team===b.team && x.hp>0);
      if(strong && b.strongT<=0){
        strong.hp=0; strong.dead=true; hudDirty=true;
        addText(strong.x,strong.y-strong.r-30,'强梁散了','#4d8f76');
      }
      if(b.passion>=PASSION_LIANG){
        if(strong && b.strongT>0){
          b.passion=0; b.strongT=Math.min(24,b.strongT+LIANG_DUR);
          addText(b.x,b.y-b.r-30,'强梁 +9s','#5fe0b0');
        }else if(!strong){
          b.passion=0; summonStrong(b);
        }
      }
    }

    if(b.skillType==='qiangliang'){
      // 梁月倒下后强梁跟着散
      if(!balls.some(x=>x.skillType==='liangyue' && x.team===b.team && x.hp>0)){
        b.hp=0; b.dead=true; hudDirty=true;
        addText(b.x,b.y-b.r-30,'强梁散了','#4d8f76');
        continue;
      }
    }

    if(b.skillType==='regulars'){
      // 【术具】版本：不再自动隐身放音波，改成每 9 秒同调值 +15
      b.sonicT=(b.sonicT||0)+dt;
      if(b.sonicT>=9){
        b.sonicT-=9;
        addTune(b,15);
        addText(b.x,b.y-b.r-30,'同调 +15','#a8b8ff');
        burst(b.x,b.y,'#a8b8ff',8);
      }
    }

    if(b.expert && b.expert.length){
      for(const e of b.expert) e.t-=dt;
      b.expert=b.expert.filter(e=>e.t>0);
    }

    if(b.soul && b.soul.length>0){
      // 灵魂溶剂挂在挨打的人身上，自己涨自己那份伤
      b.soulT-=dt;
      if(b.soulT<=0){ b.soulT+=SOUL_GROW; growSoul(b); }
    }

    // 【愈合】：8秒后自己触发
    if(b.healT>0){
      b.healT-=dt;
      if(b.healT<=0){ b.healT=0.01; healTrigger(b); }   // 先补一点，不然 healTrigger 里的 healT>0 判断会直接返回
    }

    if(b.skillType==='ramona'){
      b.refineT-=dt;
      if(b.refineT<=0){ b.refineT+=SOUL_REFINE; refineSoul(b); }
    }

    if(b.skillType==='cheng'){
      b.fishT-=dt;
      if(b.fishT<=0) doFish(b);
    }

    if(b.skillType==='deepfish'){
      b.riceCd-=dt;
      if(b.riceCd<=0){
        b.riceCd=RICE_CD;
        if(foe){ applyDamage(foe,RICE_DMG,RICE_COLOR,b); addText(foe.x,foe.y-foe.r-50,'饭碗砸头 -'+RICE_DMG,RICE_COLOR); }
        for(let i=0;i<RICE_COUNT;i++) spawnRice(b);
        addText(b.x,b.y-b.r-30,'五碗白饭!',RICE_COLOR);
      }
    }

    if(b.skillType==='sotheby'){
      b.potionCd-=dt;
      if(b.potionCd<=0){
        b.potionCd=POTION_CD;
        seSothebyPotion();
        // 【双向药剂】：随机两位敌方各吃一发
        const f1=skillFoe(b), f2=skillFoe(b);
        if(f1) fireBottle(b,f1);
        if(f2) fireBottle(b,f2);
        // 己方全体获得【愈合】
        for(const x of balls){ if(x.team===b.team && x.hp>0) healApply(x); }
      }
    }

    if(b.skillType==='joe'){
      // 窗口与次数改由全队共享池 shieldPool 统一推进
    }

    if(b.skillType==='tuesday' && b.passion>=PASSION_LAN){
      if(!stories.some(s=>s.kind==='story' && s.owner.team===b.team)){ b.passion=0; placeStory(b); }
    }

    if(b.skillType==='reed'){
      if(b.reedMode==='hui'){
        b.reedT-=dt;
        while(b.reedT<=0 && b.reedMode==='hui'){
          b.reedT+=REED_HUI_TICK;
          b.hp-=REED_HUI_DRAIN;
          seReedDrain();
          addText(b.x,b.y-b.r-30,'枯荣 -'+REED_HUI_DRAIN,REED_COLOR);
          if(b.hp<=0) reedToSeed(b);
        }
      }else if(b.reedMode==='seed'){
        b.reedT-=dt;
        if(b.reedT<=0) reedRebirth(b);
      }
    }

    if(b.skillType==='nautika' && b.nodeVolley){
      const nv=b.nodeVolley;
      nv.timer-=dt;
      if(nv.timer<=0){
        fireNeedle(b);
        nv.left--;
        nv.timer=NODICA_GAP;
        if(nv.left<=0){
          const h=Math.min(Math.ceil(nv.spend*1.5),b.maxhp-b.hp);
          if(h>0){
            b.hp+=h;
            addText(b.x,b.y-b.r-38,'+'+h,HEAL_GREEN,30);
            burst(b.x,b.y,HEAL_GREEN,10);
          }
          // 为队友回复本次消耗【薪血】0.5 倍（向上取整）
          const ah=Math.ceil(nv.spend*0.5);
          if(ah>0){
            for(const ally of balls){
              if(ally.team!==b.team || ally===b || ally.hp<=0) continue;
              const add=Math.min(ah,ally.maxhp-ally.hp);
              if(add>0){
                ally.hp+=add;
                addText(ally.x,ally.y-ally.r-38,'+'+add,HEAL_GREEN,30);
                burst(ally.x,ally.y,HEAL_GREEN,8);
              }
            }
          }
          addText(b.x,b.y-b.r-64,'伤痕收束',NODICA_COLOR);
          b.nodeVolley=null;
        }
      }
    }

    if(b.skillType==='sentinel'){
      b.snipeCd-=dt;
      if(b.snipeCd<=0){
        if(b.snipeLeft>0){
          fireSnipe(b,foe);
          b.snipeLeft--;
          b.snipeCd=b.snipeLeft>0?SNIPE_CD:SNIPE_RELOAD;
          if(b.snipeLeft===0){ b.reloadXue=0; addText(b.x,b.y-b.r-30,'装弹…',SNIPE_COLOR); }
        }else{
          b.snipeLeft=SNIPE_MAG;
          b.snipeCd=SNIPE_CD;
          addText(b.x,b.y-b.r-30,'装弹完毕',SNIPE_COLOR);
        }
      }
    }

    if(b.skillType==='lilya'){
      // 冲刺命中后排队：等 0.8 秒再放导弹
      if(b.mslDelay>0){
        b.mslDelay-=dt;
        if(b.mslDelay<=0){
          b.mslDelay=0;
          fireHongnuMissile(b,b.mslTarget);
          b.mslTarget=null;
        }
      }
      if(b.dashPhase==='back'){
        b.dashT-=dt;
        if(b.dashT<=0){
          if(foe){
            const ang=Math.atan2(foe.y-b.y,foe.x-b.x);
            b.vx=Math.cos(ang)*DASH_SPEED; b.vy=Math.sin(ang)*DASH_SPEED;
            b.dashPhase='dash'; b.dashT=0.5; b.dashMissile=false;
            sePlay('lilya1');
            addText(b.x,b.y-b.r-26,'冲刺!','#ffb066');
            spiritTeamSkill(b);   // 冲刺算释放技能：同队37灵光+1
          }else{ b.dashPhase=null; }
        }
      }else if(b.dashPhase==='dash'){
        b.dashT-=dt;
        if(b.dashT<=0){ b.dashPhase=null; b.skillCd=0.5; }
      }
    }

    // 【野树莓一世的恩典】：无敌停顿期间原地不动（不位移、不弹墙）
    const gracePause=(b.berryGraceT||0)>0;
    if(gracePause){
      b.berryGraceT=Math.max(0,b.berryGraceT-dt);
    }else{
      b.x+=b.vx*dt; b.y+=b.vy*dt;
    }

    let hit=false;
    if(!gracePause){
      if(b.x-L<b.r){b.x=L+b.r;b.vx=Math.abs(b.vx);hit=true;}
      if(R-b.x<b.r){b.x=R-b.r;b.vx=-Math.abs(b.vx);hit=true;}
      if(b.y-T<b.r){b.y=T+b.r;b.vy=Math.abs(b.vy);hit=true;}
      if(B-b.y<b.r){b.y=B-b.r;b.vy=-Math.abs(b.vy);hit=true;}
    }
    if(hit){
      if(b.dashPhase!=='dash'){
        const sp=Math.hypot(b.vx,b.vy)||1;
        const nsp=Math.min(b.speedMax,sp*1.035);
        b.vx*=nsp/sp; b.vy*=nsp/sp;
      }
      burst(b.x,b.y,b.color,6);
      // 【中毒】只有每 2 秒一次的定时结算，触壁不结算
      passionOnTouch(b,'触壁');
      marcusTouch(b);
      merTouch(b,2);
      if(b.skillType==='argus') argusTouch(b);
      if(b.skillType==='corvus') heronWallHit(b);
      semeCollide(b);
    }
    clampSp(b);
  }

  // 球与球
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      const A=balls[i], Bb=balls[j];
      if(A.hp<=0||Bb.hp<=0) continue;
      // 隐身状态不吃碰撞
      if(A.invisT>0||Bb.invisT>0) continue;
      // 【野树莓一世的恩典】：无敌停顿期间不参与碰撞
      if((A.berryGraceT||0)>0||(Bb.berryGraceT||0)>0) continue;
      // 【漫游迪斯科】完全虚化：直接穿透，不发生碰撞
      if((A.merDiscoT||0)>0||(Bb.merDiscoT||0)>0||(A.merTraceT||0)>0||(Bb.merTraceT||0)>0) continue;
      const dx=Bb.x-A.x, dy=Bb.y-A.y, d=Math.hypot(dx,dy)||1;
      const minD=A.r+Bb.r;
      if(d>=minD) continue;

      const nx=dx/d, ny=dy/d;
      const overlap=minD-d;
      // 【阿黛拉】驾驶期间不受碰撞影响：不被推开，也不改变行动轨迹
      const aDrv=A.grayDriveT>0 || (A.skillType==='argus'&&(A.giantT||0)>0);
      const bDrv=Bb.grayDriveT>0 || (Bb.skillType==='argus'&&(Bb.giantT||0)>0);
      if(!aDrv){ A.x-=nx*overlap/2; A.y-=ny*overlap/2; }
      if(!bDrv){ Bb.x+=nx*overlap/2; Bb.y+=ny*overlap/2; }

      const relx=Bb.vx-A.vx, rely=Bb.vy-A.vy;
      const rel=Math.hypot(relx,rely);
      const p=(relx*nx+rely*ny);
      if(!aDrv){ A.vx+=p*nx; A.vy+=p*ny; A.vx-=nx*70; A.vy-=ny*70; }
      if(!bDrv){ Bb.vx-=p*nx; Bb.vy-=p*ny; Bb.vx+=nx*70; Bb.vy+=ny*70; }

      for(const b of [A,Bb]){
        if(b.dashPhase!=='dash'){
          const sp=Math.hypot(b.vx,b.vy)||1;
          const nsp=Math.min(b.speedMax,sp*1.06);
          b.vx*=nsp/sp; b.vy*=nsp/sp;
        }
        clampSp(b);
      }

      const cx=(A.x+Bb.x)/2, cy=(A.y+Bb.y)/2;
      const friendly=A.team===Bb.team;
      burst(cx,cy,friendly?'#8fa3ba':'#ffffff',friendly?7:12);
      shake=Math.min(10, rel/80);

      // 红弩箭冲刺撞人的那一下，自己不吃碰撞伤害
      const aDash=A.dashPhase==='dash', bDash=Bb.dashPhase==='dash';
      if(!friendly && rel>120){
        // 红弩箭冲刺命中那一下，追加一发追踪导弹
        for(const mm of [[A,Bb,aDash],[Bb,A,bDash]]){
          const me=mm[0], tgt=mm[1], isD=mm[2];
          if(isD && me.skillType==='lilya' && !me.dashMissile){
            me.dashMissile=true;
            me.mslDelay=HONGNU_MSL_DELAY;
            me.mslTarget=tgt;
            addText(me.x,me.y-me.r-26,'导弹待发','#ffb066');
          }
        }
        if(A.hurtCd<=0 && !aDrv && !aDash){
          // 冲刺那一下撞人，本次碰撞伤害翻倍
          const dashMul=(bDash && Bb.skillType==='lilya')?DASH_DMG_MUL:1;
          const dmg=(Math.max(1,Math.round(Bb.atk*dmgMul(Bb,A)))+ctrBonusOf(Bb,A)+elecDmgAdd(Bb.team)+(bDrv?GRAY_DRIVE_DMG:0))*dashMul;
          A.hurtCd=0.28;
          applyDamage(A,dmg,Bb.color,Bb,true);
          // 【贝丽尔】在场：己方碰撞命中敌人附加 2 层【光晕】
          { const _by=berylOf(Bb.team); if(_by && A.team!==Bb.team) addHalo(A,BERYL_HALO_COLLIDE,_by); }
          if(Bb.grayDriveT>0){ hitFx(A.x,A.y,GRAY_COLOR,'drive'); shake=Math.max(shake,6); }
          if(!bDrv) addElectric(Bb.team,(Bb.trait==='电能')?ELEC_STACK_ELEC:ELEC_STACK_COLLIDE);
        }
        if(Bb.hurtCd<=0 && !bDrv && !bDash){
          // 冲刺那一下撞人，本次碰撞伤害翻倍
          const dashMul2=(aDash && A.skillType==='lilya')?DASH_DMG_MUL:1;
          const dmg=(Math.max(1,Math.round(A.atk*dmgMul(A,Bb)))+ctrBonusOf(A,Bb)+elecDmgAdd(A.team)+(aDrv?GRAY_DRIVE_DMG:0))*dashMul2;
          Bb.hurtCd=0.28;
          applyDamage(Bb,dmg,A.color,A,true);
          { const _by=berylOf(A.team); if(_by && Bb.team!==A.team) addHalo(Bb,BERYL_HALO_COLLIDE,_by); }
          if(A.grayDriveT>0){ hitFx(Bb.x,Bb.y,GRAY_COLOR,'drive'); shake=Math.max(shake,6); }
          if(!aDrv) addElectric(A.team,(A.trait==='电能')?ELEC_STACK_ELEC:ELEC_STACK_COLLIDE);
        }
      }

      // 卡戎：碰撞血量低于10%的敌人直接击败（驾驶中的目标撞不动）
      if(!friendly){
        if(Bb.skillType==='charon' && !aDrv && A.hp>0 && A.hp < A.maxhp*CHARON_EXEC){
          addText(A.x,A.y-A.r-40,'卡戎·收割',CHARON_COLOR);
          applyDamage(A,A.hp,CHARON_COLOR,Bb);
        }
        if(A.skillType==='charon' && !bDrv && Bb.hp>0 && Bb.hp < Bb.maxhp*CHARON_EXEC){
          addText(Bb.x,Bb.y-Bb.r-40,'卡戎·收割',CHARON_COLOR);
          applyDamage(Bb,Bb.hp,CHARON_COLOR,A);
        }
      }

      for(const b of [A,Bb]) semeCollide(b);
      for(const b of [A,Bb]){ if(b.hp>0 && b.hp<HEAL_LOW_HP && b.healT>0) healTrigger(b); }
      for(const b of [A,Bb]) passionOnTouch(b,'碰撞');
      for(const b of [A,Bb]) marcusTouch(b);
      for(const b of [A,Bb]) merTouch(b,1);
      // 【当海风翻页时·小马】：碰撞额外伤害 + 停止攻击1秒 + 队友护盾
      if(!friendly){
        for(const mm of [[A,Bb],[Bb,A]]){
          const me=mm[0], tgt=mm[1];
          if(me.skillType==='marcus' && me.beastKind==='horse' && (me.beastT||0)>0 && me.hitCd<=0 && tgt.hp>0 && tgt.team!==me.team){
            me.hitCd=0.28;
            marcusHorseHit(me,tgt);
          }
        }
      }

      for(const b of [A,Bb]){
        if(!b.skillType) continue;
        if((b.stunT||0)>0) continue;   // 眩晕期间停止攻击：碰撞类技能也不发动
        const foe=nearestFoe(b);
        const other = b===A ? Bb : A;
        if(b.skillType==='tuesday'){
          if(other.team!==b.team && other.hp>0 && b.storyHitCd<=0){
            b.storyHitCd=0.4;
            if(other.poison.length<POISON_CAP){ other.poison.push({dmg:STORY_POISON_DMG,team:b.team}); other.poisonCd=0; }
            addText(other.x,other.y-other.r-30,'中毒 ×1',POISON_COLOR);
            burst(cx,cy,POISON_COLOR,8);
          }
        }else if(b.skillType==='lilya'){
          if(b.dashPhase==='dash'){
            b.dashPhase=null; b.skillCd=0.5; b.dashT=0;
            addText(cx,cy-b.r,'补刀!','#ffb066');
            burst(cx,cy,'#ffb066',16);
          }else if(!b.dashPhase && b.skillCd<=0 && foe){
            const ang=Math.atan2(b.y-foe.y,b.x-foe.x);
            b.vx=Math.cos(ang)*560; b.vy=Math.sin(ang)*560;
            b.dashPhase='back'; b.dashT=0.16;
            addText(b.x,b.y-b.r-26,'后撤','#ffc08a');
          }
        }else if(b.skillType==='twins'){
          if(!friendly && rel>120 && b.hitCd<=0){ b.hitCd=0.28; twinOnHit(b); }
        }else if(b.skillType==='cornerstone'){
          if(!friendly && rel>120 && b.hitCd<=0 && (b.counterCd||0)<=0){ b.hitCd=0.28; b.counterCd=COUNTER_CD; cornerOnHit(b,other); }
        }else if(b.skillType==='babel'){
          if(!friendly && rel>120 && b.hitCd<=0 && (b.counterCd||0)<=0){ b.hitCd=0.28; b.counterCd=COUNTER_CD; babelBite(b,other); }
        }else if(b.skillType==='joe'){
          if(!friendly && rel>120 && b.hitCd<=0){ b.hitCd=0.28; jOnCollide(b); }
        }else if(b.skillType==='liangyue'||b.skillType==='qiangliang'){
          if(!friendly && rel>120 && b.hitCd<=0){ b.hitCd=0.28; liangOnHit(b); }
        }else if(b.skillType==='ramona'){
          if(!friendly && other.hp>0 && b.hitCd<=0){ b.hitCd=0.28; soulOnHit(b,other); }
        }else if(b.skillType==='willow'){
          if(!friendly && other.hp>0 && b.hitCd<=0){ b.hitCd=0.28; duduOnHit(b,other); }
        }
      }
    }
  }
  // 【电能】3级电场持续8秒后清空电能，需要重新叠加
  // 卡戎不再直接顶到Lv.3，只把升级需求压到90层
  for(let ti=0;ti<elecField.length;ti++){
    const f=elecField[ti];
    if(!f || f.lv!==3) continue;
    f.timer-=dt;
    if(f.timer<=0){
      f.lv=1; f.charge=0; f.timer=0;
      const src=balls.find(b=>b.team===ti && b.hp>0);
      if(src) addText(src.x,src.y-src.r-64,'电场清空',ELEC_COLOR);
    }
  }

  // 【薪血】每20秒清空全部薪血，给己方全体各回复等量生命
  for(let ti=0;ti<xueField.length;ti++){
    const f=xueField[ti];
    if(!f) continue;
    if(!teamHasXue(ti)) continue;
    f.timer-=dt;
    if(f.timer<=0){
      f.timer=XUE_CYCLE;
      const heal=f.stock;
      f.stock=0; f.rem=0;
      // 诺谛卡在场：把【饮尽生者之色】换成【千万道伤痕】
      if(teamHasNodica(ti)){ if(heal>0) startNeedleVolley(ti,heal); continue; }
      if(heal>0){
        const src=balls.find(b=>b.team===ti && b.hp>0);
        if(src) addText(src.x,src.y-src.r-64,'饮尽生者之色 +'+heal,XUE_COLOR);
        xueFlashT=XUE_ART_DUR;   // 卡面在地图中央闪一次（饮尽生者之色）
        xueFlashArt=XUE_ART;
        xueFlashColor=XUE_COLOR;
        for(const b of balls){
          if(b.team!==ti || b.hp<=0) continue;
          const h=Math.min(heal+healBonus(b),b.maxhp-b.hp);
          if(h>0){
            b.hp+=h;
            addText(b.x,b.y-b.r-38,'+'+h,HEAL_GREEN,30);
            burst(b.x,b.y,HEAL_GREEN,8);
          }
        }
      }
    }
  }

  if(xueFlashT>0) xueFlashT=Math.max(0,xueFlashT-dt);
  if(fishFlashT>0) fishFlashT=Math.max(0,fishFlashT-dt);

  // 【雾中祭祀】计时
  updateMist(dt);

  // 【中毒】：每 2 秒结算一次（唯一结算入口）
  tickPoison(dt);

  // 【惊惧故事会】：每3秒让中毒层数翻倍（保留翻倍），结算统一交给 tickPoison
  for(const s of stories){
    s.time-=dt;
    if(s.kind!=='story') continue;
    s.tick=(s.tick===undefined?STORY_TICK:s.tick)-dt;
    if(s.tick<=0){
      s.tick+=STORY_TICK;
      for(const t of balls){
        if(t.team!==s.foeTeam || t.hp<=0) continue;
        const cur=t.poison.length;
        const grow=Math.max(0,Math.min(cur,POISON_CAP-cur));
        for(let i=0;i<grow;i++) t.poison.push({dmg:t.poison[i].dmg,team:t.poison[i].team});
        if(grow>0){ sePlay('lan2'); addText(t.x,t.y-t.r-34,'中毒翻倍',POISON_COLOR); }
      }
    }
  }
  if(stories.length){
    stories=stories.filter(s=>{
      // 蓝手帕退场，故事会跟着消失
      if(s.owner && s.owner.hp<=0){
        addText(s.owner.x,s.owner.y-s.owner.r-30,(s.kind==='story'?'故事会消散':'血红之域消散'),'#7a6a9a');
        return false;
      }
      if(s.time<=0){
        if(s.kind==='story'){
          addText(s.owner.x,s.owner.y-s.owner.r-30,'故事会散场','#7a6a9a');
          // 散场那一次强制结算并消耗层数（不受 3 秒定时限制）
          for(const t of balls){
            if(t.hp<=0 || t.team!==s.foeTeam) continue;
            t.poisonCd=0;
            resolvePoison(t,true,false);
          }
        }else{
          addText(s.owner.x,s.owner.y-s.owner.r-30,'血红之域消散',SEME_COLOR);
        }
        return false;
      }
      return true;
    });
  }

  // 三角/药瓶/剑气飞行
  for(const pr of projs){
    if(pr.type==='beam'){ updateBeam(pr,dt); continue; }
    // 弹射后在命中点顿一下再飞，链速度太快一帧就跨过去了，玩家看不到跳跃
    if(pr.type==='chain' && pr.hold>0){ pr.hold-=dt; continue; }
    // 三种反击弹射物：起手原地蓄力 0.5 秒再飞出去
    if(pr.delay>0){ pr.delay-=dt; continue; }
    if(pr.type==='tri'){ updateTri(pr,dt); continue; }
    if(pr.type==='star'){ updateStar(pr,dt); continue; }
    if(pr.type==='shell'){ updateShell(pr,dt); continue; }
    if(pr.type==='poppy'){ updatePoppy(pr,dt); continue; }
    if(pr.type==='chain' && (!pr.target || pr.target.hp<=0)){
      const nxt=balls.filter(x=>x.team!==pr.owner.team && x.hp>0 && pr.hit.indexOf(x)<0);
      if(nxt.length) pr.target=nxt[0]; else pr.life=0;
    }
    // 剑气 / 方块 / 獠牙兽：目标先倒下就追下一个
    if((pr.type==='sword'||pr.type==='block'||pr.type==='beast'||pr.type==='fare'||pr.type==='note'||pr.type==='garrow'||pr.type==='argusBullet'||pr.type==='nut') && (!pr.target || pr.target.hp<=0)){
      const nxt=balls.filter(x=>x.team!==pr.owner.team && x.hp>0);
      if(nxt.length) pr.target=nxt[0]; else pr.life=0;
    }
    // 导弹越飞越快
    if(pr.type==='missile') pr.speed=Math.min(HONGNU_MSL_MAX,pr.speed+HONGNU_MSL_ACC*dt);
    if(pr.homing && pr.target && pr.target.hp>0){
      const a2=Math.atan2(pr.target.y-pr.y,pr.target.x-pr.x);
      pr.ang=a2;
      pr.vx=Math.cos(a2)*pr.speed; pr.vy=Math.sin(a2)*pr.speed;
    }
    pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt;
    if(pr.x<-40||pr.x>W+40||pr.y<-40||pr.y>H+40) pr.life=0;
    const t=pr.target;
    if(pr.life>0 && t && t.hp>0){
      const hitR = t.r + (pr.type==='tri'?pr.size*0.30:0);
      let hitNow=Math.hypot(t.x-pr.x,t.y-pr.y)<hitR;
      // 闪电链速度高，加速档一帧能跨过整个战场，这里按这一帧的移动线段判定是否穿过目标
      if(!hitNow && (pr.type==='chain'||pr.type==='missile'||pr.type==='sword'||pr.type==='block'||pr.type==='beast'||pr.type==='fare'||pr.type==='note'||pr.type==='garrow'||pr.type==='argusBullet'||pr.type==='nut')){
        const px=pr.x-pr.vx*dt, py=pr.y-pr.vy*dt;
        const mx=pr.x-px, my=pr.y-py, len2=mx*mx+my*my;
        let u=len2>0?((t.x-px)*mx+(t.y-py)*my)/len2:0;
        u=Math.max(0,Math.min(1,u));
        hitNow=Math.hypot(t.x-(px+mx*u),t.y-(py+my*u))<hitR;
      }
      if(hitNow){
        if(pr.type==='chain'){
          applyDamage(t,pr.dmg,pr.color,pr.owner);
          addElectric(pr.owner.team,ELEC_STACK_SKILL);
          addText(t.x,t.y-t.r-34,'闪电链 '+LRv(pr.dmg),pr.color);
          burst(pr.x,pr.y,pr.color,16);
          shake=Math.max(shake,6);
          // 弹射改成即时结算：电弧甩出去的同时就把伤害算掉，
          // 不再让链子本体飞过去二次判定，避免高速跨帧看不见伤害
          let from=t;
          while(pr.bounces>0){
            const others=balls.filter(x=>x.team!==pr.owner.team && x.hp>0 && pr.hit.indexOf(x)<0);
            if(!others.length) break;
            others.sort((p,q)=>Math.hypot(p.x-from.x,p.y-from.y)-Math.hypot(q.x-from.x,q.y-from.y));
            const nx=others[0];
            pr.bounces--;
            pr.hit.push(nx);
            bolts.push({x1:from.x,y1:from.y,x2:nx.x,y2:nx.y,life:0.34,life0:0.34,color:ULRICH_COLOR});
            applyDamage(nx,pr.dmg,pr.color,pr.owner);
            addElectric(pr.owner.team,ELEC_STACK_SKILL);
            addText(nx.x,nx.y-nx.r-34,'闪电链 '+LRv(pr.dmg),pr.color);
            burst(nx.x,nx.y,pr.color,16);
            shake=Math.max(shake,6);
            from=nx;
          }
          pr.life=0;
        }else if(pr.type==='bottle'){
          if(t.poison.length<POISON_CAP) t.poison.push({dmg:POISON_DMG,team:pr.owner.team});
          t.poisonCd=0;
          addText(t.x,t.y-t.r-30,'中毒 ×1',POISON_COLOR);
          burst(pr.x,pr.y,POISON_COLOR,18);
          hitFx(t.x,t.y,POISON_COLOR,'bottle');
          shake=Math.max(shake,4);
        }else if(pr.type==='fare'){
          const lv=fieldOf(pr.owner.team).lv;
          const dmg=GRAY_FARE_DMG+(lv===3?GRAY_FARE_UP3:(lv===2?GRAY_FARE_UP2:0));
          applyDamage(t,dmg,pr.color,pr.owner);
          addElectric(pr.owner.team,ELEC_STACK_SKILL);
          addText(t.x,t.y-t.r-34,'风景的代价 '+LRv(dmg),pr.color);
          hitFx(t.x,t.y,pr.color,'fare');
          // 【终点结价】：只有3级电场命中后才会炸开追击，1/2级电场只结算直伤
          if(lv===3){
            rings.push({x:t.x,y:t.y,r:t.r*0.4,speed:GRAY_END_SPEED,max:GRAY_END_RADIUS,hit:[t],
              owner:pr.owner,life:1,color:pr.color,dmg:GRAY_END_DMG,label:'终点结价'});
            addText(t.x,t.y-t.r-56,'终点结价',pr.color);
            seGrayEnd();
            spiritAction(pr.owner);
          }
          burst(pr.x,pr.y,pr.color,18);
          shake=Math.max(shake,6);
        }else if(pr.type==='orb'){
          // 玛蒂尔达的水晶球：必定命中，20 点伤害并赋予【偏折】
          applyDamage(t,pr.dmg,MATILDA_COLOR,pr.owner);
          addText(t.x,t.y-t.r-34,'水晶球 '+LRv(pr.dmg),MATILDA_COLOR);
          hitFx(t.x,t.y,'#ffe9a8','paper86');
          burst(pr.x,pr.y,MATILDA_COLOR,18);
          shake=Math.max(shake,4);
          // 贝丽尔联动那一发算【追击】
          if(pr.chase) spiritAction(pr.owner);
        }else if(pr.type==='berylcry'){
          // 贝丽尔【劫数难逃】的水晶：必定命中
          // 【蓝色流溢】补射那一枚：命中时额外算一次【追击】
          if(pr.chase && pr.owner) spiritAction(pr.owner);
          // 【余辉】增伤：每次造成伤害提升本队【聚光盏】的 1%（向下取整）
          // 【上层折射】：每 10 层余辉 1% 增伤
          const guangBonus=pr.owner?Math.floor((guangStock[pr.owner.team]||0)/10):0;
          const cryDmg=pr.dmg+guangBonus;
          applyDamage(t,cryDmg,pr.color,pr.owner);
          addText(t.x,t.y-t.r-34,pr.label+' '+LRv(cryDmg)+(guangBonus>0?(' · 余辉+'+guangBonus):''),pr.color);
          hitFx(t.x,t.y,pr.color,'orb');
          burst(pr.x,pr.y,pr.color,16);
          // 【紫色流溢】：命中后额外 2 层【光晕】
          if(pr.kind==='purple') addHalo(t,2,pr.owner);
          // 【绿色流溢】：己方【升阶】角色计数器进度 +2
          if(pr.kind==='green') berylGreenUpgrade(pr.owner);
          // 【蓝色流溢】：命中后 33% 概率再放一枚
          if(pr.kind==='blue' && pr.owner && pr.owner.hp>0 && Math.random()<BERYL_BLUE_REPEAT){
            // 补射额外算一次【追击】
            berylQueue.push({team:pr.owner.team,t:0,kind:'blue',chase:true});
          }
        }else if(pr.type==='missile'){
          // 红弩箭的导弹：命中后按【追击】结算
          applyDamage(t,pr.dmg,HONGNU_MSL_COLOR,pr.owner);
          addText(t.x,t.y-t.r-34,'追击 '+LRv(pr.dmg),'#8fe7ff');
          spiritAction(pr.owner);
          burst(pr.x,pr.y,HONGNU_MSL_COLOR,16);
          hitFx(t.x,t.y,HONGNU_MSL_COLOR,'missile');
          shake=Math.max(shake,6);
        }else if(pr.type==='fishshot'){
          // 程和光的小鱼：命中结算【追击】伤害
          applyDamage(t,pr.dmg,FISH_COLOR,pr.owner);
          addText(t.x,t.y-t.r-34,'追击 -'+LRv(pr.dmg),'#8fe7ff');
          hitFx(t.x,t.y,FISH_COLOR,'fish');
          spiritAction(pr.owner);
          burst(pr.x,pr.y,FISH_COLOR,14);
          shake=Math.max(shake,4);
        }else if(pr.type==='shadow'){
          // 野树莓的影子：抵达队友后治疗
          const bonus=Math.floor((t.lostHp||0)/BERRY_PER);
          const before=t.hp;
          t.hp=Math.min(t.maxhp,t.hp+BERRY_HEAL+bonus+healBonus(t));
          const hv=Math.round(t.hp-before);
          addText(t.x,t.y-t.r-8,hv>0?('+'+hv):'满血',BERRY_COLOR);
          burst(pr.x,pr.y,BERRY_COLOR,10);
          hitFx(t.x,t.y,BERRY_COLOR,'shadow');
          if(hv>0) healFx(t.x,t.y,hv,'shadow');
        }else{
          // 獠牙兽要在防递归的包裹里结算，其余类型照旧
          if(pr.type!=='beast' && pr.type!=='argusBullet') applyDamage(t,pr.dmg+(pr.type==='needle'?(pr.bloodAdd||0):0),pr.color||'#8ec5ff',pr.owner,false,pr.type==='needle'&&!!pr.bloodAdd);
          if(pr.type==='snipe'){
            spiritAction(pr.owner);   // 狙击按【追击】算
            addText(t.x,t.y-t.r-34,'偿罪命中',SNIPE_COLOR);
            hitFx(t.x,t.y,SNIPE_COLOR,'snipe');
            shake=Math.max(shake,7);
          }else if(pr.type==='needle'){
            // 诺谛卡【千万道伤痕】的银针命中
            // 血红之域的加伤是在 applyDamage 里加的，飘字要显示加完之后的真实伤害
            const ndAdd=pr.bloodAdd||0;
            addText(t.x,t.y-t.r-34,'伤痕 -'+LRv(pr.dmg+ndAdd),ndAdd>0?'#ffb9c8':NODICA_COLOR);
            if(ndAdd>0) addText(pr.owner.x,pr.owner.y-pr.owner.r-80,'血红 增伤+'+ndAdd,SEME_COLOR);
            hitFx(t.x,t.y,NODICA_COLOR,'needle');
            burst(pr.x,pr.y,NODICA_COLOR,14);
            shake=Math.max(shake,5);
          }else if(pr.type==='sword'){
            // J【高温回火】的红色剑气命中
            addText(t.x,t.y-t.r-34,(pr.label||'剑气')+' -'+LRv(pr.dmg),pr.color||SWORD_COLOR);
            hitFx(t.x,t.y,pr.color||SWORD_COLOR,'sword');
            if(pr.burnAdd) addBurn(t,pr.burnAdd,pr.owner);
            burst(pr.x,pr.y,pr.color||SWORD_COLOR,18);
            shake=Math.max(shake,7);
          }else if(pr.type==='block'){
            // 奠基石【复盘反馈】/【交付反馈】的棕褐方块砸中
            addText(t.x,t.y-t.r-34,pr.label+' -'+LRv(pr.dmg),TRIAL_COLOR);
            hitFx(t.x,t.y,pr.big?'#e0ab63':TRIAL_COLOR,pr.big?'blockBig':'block');
            burst(pr.x,pr.y,TRIAL_COLOR,pr.big?22:14);
            shake=Math.max(shake,pr.big?7:5);
          }else if(pr.type==='note'){
            // 【术具】黄色音符 / 【白鸟的问候】白色纸飞机命中：必定命中，不看弹道
            if(pr.plane){
              addText(t.x,t.y-t.r-34,(pr.label||'白鸟的问候')+' -'+LRv(pr.dmg),'#f6faff');
              hitFx(t.x,t.y,'#ffffff','paper',pr.big);
              burst(pr.x,pr.y,'#ffffff',pr.big?22:14);
            }else{
              const ncol=pr.color||NOTE_COLOR;
              addText(t.x,t.y-t.r-34,(pr.label||'音符')+' -'+LRv(pr.dmg),ncol);
              hitFx(t.x,t.y,ncol,'note',pr.big);
              // 通用结算已处理伤害，这里不再重复 applyDamage
              burst(pr.x,pr.y,ncol,pr.big?22:13);
            }
          }else if(pr.type==='garrow'){
            // 【尤里卡时刻】的灰色箭头：从地图上方飞来，必定命中
            addText(t.x,t.y-t.r-34,'灰箭 -'+LRv(pr.dmg),TWIN_ARROW_COLOR);
            // 通用结算已处理伤害，这里不再重复 applyDamage
            burst(pr.x,pr.y,TWIN_ARROW_COLOR,14);
            shake=Math.max(shake,2);
            shake=Math.max(shake,pr.big?6:3);
          }else if(pr.type==='nut'){
            // 马库斯松鼠形态：必定命中的松果
            addText(t.x,t.y-t.r-34,'松果 '+LRv(pr.dmg),MARCUS_NUT_COLOR);
            hitFx(t.x,t.y,MARCUS_NUT_COLOR,'nut');
            burst(pr.x,pr.y,MARCUS_NUT_COLOR,16);
            shake=Math.max(shake,4);
          }else if(pr.type==='argusBullet'){
            // 阿尔古斯绿色子弹命中：绿色标靶 + 追击结算
            argusDepth++;
            applyDamage(t,pr.dmg,ARGUS_BULLET_COLOR,pr.owner);
            argusDepth--;
            addText(t.x,t.y-t.r-34,(pr.label||'追击')+' '+LRv(pr.dmg),ARGUS_BULLET_COLOR);
            argusSights.push({x:t.x,y:t.y,t:0.48,dur:0.48,strong:!!pr.strong});
            hitFx(t.x,t.y,ARGUS_BULLET_COLOR,'snipe',!!pr.strong);
            burst(pr.x,pr.y,ARGUS_BULLET_COLOR,pr.strong?24:14);
            shake=Math.max(shake,pr.strong?7:4);
            if(pr.knock){
              const ka=Math.atan2(t.y-pr.owner.y,t.x-pr.owner.x);
              t.vx+=Math.cos(ka)*pr.knock; t.vy+=Math.sin(ka)*pr.knock;
              addText(t.x,t.y-t.r-56,'击退',ARGUS_BULLET_COLOR);
            }
            if(!pr.noCount){
              spiritAction(pr.owner);
            }
          }else if(pr.type==='beast'){
            // 新巴别塔【獠牙的忠诚】的小怪物咬上去
            babelReflectDepth++;
            applyDamage(t,pr.dmg,BABEL_COLOR,pr.owner);
            babelReflectDepth--;
            addText(t.x,t.y-t.r-34,'獠牙的忠诚 -'+LRv(pr.dmg),BABEL_COLOR);
            hitFx(t.x,t.y,BEAST_COLOR,'beast');
            burst(pr.x,pr.y,'#8b1f33',18);
            shake=Math.max(shake,6);
          }else{
            burst(pr.x,pr.y,'#9fd0ff',14);
            shake=Math.max(shake,5);
          }
        }
        pr.life=0;
      }
    }
  }
  projs=projs.filter(p=>p.life>0);
  for(const b of bolts) b.life-=dt;
  bolts=bolts.filter(b=>b.life>0);

  // 白饭乱飞，谁吃到谁回血
  for(const r of rices){
    r.x+=r.vx*dt; r.y+=r.vy*dt; r.life-=dt; r.spin+=dt*2;
    if(r.x<L+r.r){r.x=L+r.r; r.vx=Math.abs(r.vx);}
    if(r.x>R-r.r){r.x=R-r.r; r.vx=-Math.abs(r.vx);}
    if(r.y<T+r.r){r.y=T+r.r; r.vy=Math.abs(r.vy);}
    if(r.y>B-r.r){r.y=B-r.r; r.vy=-Math.abs(r.vy);}
    if(r.life<=0) continue;
    for(const b of balls){
      if(b.hp<=0) continue;
      if(Math.hypot(b.x-r.x,b.y-r.y)<b.r+r.r-6){
        const before=b.hp;
        b.hp=Math.min(b.maxhp,b.hp+RICE_HEAL+healBonus(b));
        const h=Math.round(b.hp-before);
        addText(b.x,b.y-b.r-8,h>0?('+'+h):'满血',RICE_COLOR);
        burst(r.x,r.y,RICE_COLOR,10);
        r.life=0;
        break;
      }
    }
  }
  rices=rices.filter(r=>r.life>0);

  // 虞美人花丛
  updatePoppies(dt);

  // 告死鸟：铁轨与列车
  updateHeron(dt);

  // 爆炸冲击波（纯视觉）
  updateShocks(dt);

  // 音波环
  for(const rg of rings){
    rg.r+=rg.speed*dt;
    const rmax=rg.max||SONIC_RING_MAX;
    if(rg.r>rmax) rg.life=0;
    const hitDmg=(rg.dmg!=null)?rg.dmg:Math.max(1,Math.round(rg.owner.atk));
    const label=rg.label||'音波';
    for(const t of balls){
      if(t.team===rg.owner.team||t.hp<=0) continue;
      if(rg.hit.indexOf(t)>=0) continue;
      if(Math.hypot(t.x-rg.x,t.y-rg.y)<rg.r+t.r){
        rg.hit.push(t);
        applyDamage(t,hitDmg,rg.color,rg.owner);
        addText(t.x,t.y-t.r-30,label+' -'+hitDmg,rg.color);
        if(rg.label==='爆炸') hitFx(t.x,t.y,rg.color,'shell');
        else if(rg.label==='终点结价') hitFx(t.x,t.y,rg.color,'fare');
        else hitFx(t.x,t.y,rg.color,'sonic');   // 星锑音波
      }
    }
  }
  rings=rings.filter(r=>r.life>0);

  guangTick(dt);
  shujuTick(dt);
  updateTwinSpins(dt);
  for(const mb of merBalls) mb.t-=dt;
  merBalls=merBalls.filter(mb=>mb.t>0);
  if(hudDirty){ buildHud(); hudDirty=false; }

  for(const b of balls){
    if(b.hp<=0 && !b.dead){
      if(b.skillType==='reed' && b.reedMode==='hui'){ reedToSeed(b); continue; }
      b.dead=true; b.hp=0;
      addText(b.x,b.y-b.r-40,b.name+' 躺了','#ff8080');
      transferToxin(b);
    }
  }
  const aliveTeams=[];
  for(const b of balls){ if(b.hp>0 && aliveTeams.indexOf(b.team)<0) aliveTeams.push(b.team); }
  if(aliveTeams.length<=1){ over={winner:aliveTeams.length?aliveTeams[0]:-1}; keepAwake(false); }
}

/* ---- 【强制结束】：点了跳过但 10 秒还没分出胜负，就按剩余总血量判胜 ---- */
function forceEndFight(){
  if(over) return;
  const hpSum={};
  for(const b of balls){
    if(b.hp<=0) continue;
    hpSum[b.team]=(hpSum[b.team]||0)+b.hp;
  }
  const list=Object.keys(hpSum).map(t=>({t:Number(t),hp:hpSum[t]}));
  if(!list.length){ over={winner:-1,forced:true}; keepAwake(false); return; }
  let best=Math.max(...list.map(o=>o.hp));
  const top=list.filter(o=>Math.abs(o.hp-best)<=1e-6);
  const pick=top[Math.floor(Math.random()*top.length)];
  over={winner:pick.t,forced:true};
  keepAwake(false);
}

}

function drawWalls(){
  const ix=L, iy=T, iw=R-L, ih=B-T;
  g.fillStyle='#1b2430';
  g.fillRect(ix-WALL,iy-WALL,iw+WALL*2,WALL);
  g.fillRect(ix-WALL,iy+ih,iw+WALL*2,WALL);
  g.fillRect(ix-WALL,iy,WALL,ih);
  g.fillRect(ix+iw,iy,WALL,ih);

  g.save();
  g.shadowColor='rgba(120,200,255,.55)'; g.shadowBlur=16;
  g.strokeStyle='#4a6b8a'; g.lineWidth=3;
  g.strokeRect(ix-1.5,iy-1.5,iw+3,ih+3);
  g.restore();

  g.strokeStyle='rgba(255,255,255,.06)'; g.lineWidth=2;
  for(let x=ix-WALL;x<ix+iw+WALL;x+=44){
    g.beginPath();g.moveTo(x+22,iy-WALL);g.lineTo(x+22,iy);g.stroke();
    g.beginPath();g.moveTo(x+22,iy+ih);g.lineTo(x+22,iy+ih+WALL);g.stroke();
  }
  for(let y=iy-WALL;y<iy+ih+WALL;y+=44){
    g.beginPath();g.moveTo(ix-WALL,y+22);g.lineTo(ix,y+22);g.stroke();
    g.beginPath();g.moveTo(ix+iw,y+22);g.lineTo(ix+iw+WALL,y+22);g.stroke();
  }

  g.fillStyle='#2c3b4d';
  const c=30, hs=WALL+6;
  const cs=[[ix-hs,iy-hs],[ix+iw+hs-c,iy-hs],[ix-hs,iy+ih+hs-c],[ix+iw+hs-c,iy+ih+hs-c]];
  for(const p of cs){
    g.fillRect(p[0],p[1],c,c);
    g.strokeStyle='#5b82a8'; g.lineWidth=2;
    g.strokeRect(p[0]+1,p[1]+1,c-2,c-2);
  }
}

/* ---- 闪电链弹射时甩出的电弧 ---- */
function drawBolts(){
  for(const b of bolts){

    g.strokeStyle=b.color; g.lineWidth=2.6;
    g.shadowColor=b.color; g.shadowBlur=16;

    const nx=-(b.y2-b.y1), ny=(b.x2-b.x1), nl=Math.hypot(nx,ny)||1;

    g.stroke();
    g.restore();
  }
}

    g.globalAlpha=1;

    g.shadowColor='#e0ab63'; g.shadowBlur=16;
    g.globalAlpha=0.32;
    g.fillStyle=TRIAL_COLOR;
    g.fillRect(-pr.size*1.75,-pr.size*0.7,pr.size*1.5,pr.size*1.4);

  }else if(pr.type==='shadow'){

    g.beginPath(); g.moveTo(17,0); g.lineTo(-11,11); g.stroke();
  }else if(pr.type==='note' && pr.fx==='echo'){
    // 回声谣技能：透明底小人插图朝目标飞，淡青光轨 + 摇摆
    const now=performance.now();
    const h=pr.big?88:70, w=h*((ECHO_FX_IMG.complete&&ECHO_FX_IMG.naturalWidth>0)?(ECHO_FX_IMG.naturalWidth/ECHO_FX_IMG.naturalHeight):(389/600));
    // 飞行光轨（沿运动方向的反方向）
    g.globalAlpha=0.34;
    const tg=g.createLinearGradient(-h*1.25,0,0,0);
    tg.addColorStop(0,'rgba(95,208,192,0)');
    tg.addColorStop(1,'rgba(95,208,192,.62)');
    g.fillStyle=tg;
    g.beginPath(); g.ellipse(-h*0.72,0,h*0.82,h*0.26,0,0,7); g.fill();
    // 图保持正立，轻微摇摆
    g.rotate(-pr.ang);
    g.rotate(Math.sin(now/260)*0.10);
    g.globalAlpha=1;
    g.globalAlpha=0.30;
    g.fillStyle=ECHO_COLOR;
    g.beginPath(); g.arc(0,0,h*0.44,0,7); g.fill();
    g.globalAlpha=1;
    g.shadowColor=ECHO_COLOR; g.shadowBlur=pr.big?26:18;
    if(ECHO_FX_IMG.complete && ECHO_FX_IMG.naturalWidth>0){
      g.drawImage(ECHO_FX_IMG,-w/2,-h/2,w,h);
    }else{
      // 图片还没载入时的兜底
      g.fillStyle=ECHO_COLOR;
      g.beginPath(); g.arc(0,0,h*0.34,0,7); g.fill();
    }
    g.shadowBlur=0;
  }else if(pr.type==='note'){
    // 珐琅眼的黄色音符：符头 + 符干 + 符尾，强化版更大更亮
    const sz=pr.size/13;
    g.scale(sz,sz);
    g.shadowColor=(pr.color||NOTE_COLOR); g.shadowBlur=pr.big?26:18;
    g.globalAlpha=0.30;
    g.fillStyle=(pr.color||NOTE_COLOR);
    g.beginPath(); g.arc(-6,0,13,0,7); g.fill();
    g.globalAlpha=1;
    // 符头
    g.fillStyle=pr.tint?'#e6f2ff':'#fff6bf';
    g.save();
    g.translate(3,4); g.rotate(-0.30);
    g.beginPath(); g.ellipse(0,0,7.4,5.4,0,0,7); g.fill();
    g.restore();
    // 符干
    g.strokeStyle=(pr.color||NOTE_COLOR); g.lineWidth=2.6;
    g.beginPath(); g.moveTo(9.4,1.6); g.lineTo(9.4,-17); g.stroke();
    // 符尾
    g.lineWidth=2.4;
    g.beginPath(); g.moveTo(9.4,-17); g.quadraticCurveTo(16,-13,12,-6.5); g.stroke();
    g.fillStyle='#fffbe0';
    g.beginPath(); g.arc(3,4,2.1,0,7); g.fill();
  }else if(pr.type==='star'){
    // 【迈向群星】的星星：五角星，带自转和尾迹
    g.save();
    g.rotate(pr.spin||0);
    g.shadowColor=TWIN_STAR_COLOR; g.shadowBlur=20;
    g.globalAlpha=0.35;
    g.fillStyle=TWIN_STAR_COLOR;
    g.beginPath(); g.arc(0,0,pr.size*1.5,0,7); g.fill();
    g.globalAlpha=1;
    g.fillStyle='#e8f5ff';
    g.beginPath();
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5-Math.PI/2, rr=(i%2)?pr.size*0.46:pr.size;
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath(); g.fill();
    g.strokeStyle='#ffffff'; g.lineWidth=1.4;
    g.beginPath(); g.arc(0,0,pr.size*0.28,0,7); g.stroke();
    g.restore();
  }else if(pr.type==='garrow'){
    // 【尤里卡时刻】的灰色箭头
    g.shadowColor=TWIN_ARROW_COLOR; g.shadowBlur=16;
    g.fillStyle='#c3ccd8';
    g.beginPath(); g.moveTo(pr.size*0.9,0); g.lineTo(-pr.size*0.5,pr.size*0.52); g.lineTo(-pr.size*0.1,0); g.lineTo(-pr.size*0.5,-pr.size*0.52); g.closePath(); g.fill();
    g.strokeStyle='#eef3f8'; g.lineWidth=1.6; g.stroke();
  }else if(pr.type==='snipe'){
    g.shadowColor=SNIPE_COLOR; g.shadowBlur=20;
    g.fillStyle='rgba(176,184,255,.25)';
    g.beginPath();g.ellipse(-16,0,26,4,0,0,7);g.fill();
    g.beginPath();g.ellipse(2,0,pr.size*0.55,pr.size*0.30,0,0,7);
    g.fillStyle='#f2f5ff'; g.fill();
    g.strokeStyle=SNIPE_COLOR; g.lineWidth=2; g.stroke();
  }else if(pr.type==='nut'){
    // 松果：褐色鳞片塔身 + 顶端小尖
    const k=pr.size/15;
    g.scale(k,k);
    g.shadowColor=MARCUS_NUT_COLOR; g.shadowBlur=16;
    g.fillStyle='#8a5a2e';
    g.beginPath(); g.ellipse(0,1,10,13,0,0,7); g.fill();
    g.fillStyle='#c98a4b';
    for(let i=-1;i<=1;i++){
      g.beginPath(); g.ellipse(i*5.4,2,4.4,5.2,0.3,0,7); g.fill();
    }
    g.fillStyle='#e8b877';
    for(let i=0;i<2;i++){
      g.beginPath(); g.ellipse(0,-5+i*7,6.6,3.2,0,0,7); g.fill();
    }
    g.fillStyle='#6d4522';
    g.beginPath(); g.moveTo(0,-14); g.lineTo(3.2,-9); g.lineTo(-3.2,-9); g.closePath(); g.fill();
  }else if(pr.type==='orb'){
    // 玛蒂尔达的水晶球：圆形球体 + 高光
    g.shadowColor=pr.color; g.shadowBlur=20;
    g.globalAlpha=0.30;
    g.fillStyle=pr.color;
    g.beginPath(); g.arc(0,0,pr.size*1.75,0,7); g.fill();
    g.globalAlpha=1;
    const og=g.createRadialGradient(-pr.size*0.35,-pr.size*0.38,pr.size*0.12,0,0,pr.size*1.15);
    og.addColorStop(0,'#ffffff');
    og.addColorStop(0.5,pr.color);
    og.addColorStop(1,'rgba(168,130,58,.95)');
    g.fillStyle=og;
    g.beginPath(); g.arc(0,0,pr.size*1.1,0,7); g.fill();
    g.strokeStyle='rgba(255,255,255,.92)'; g.lineWidth=1.8;
    g.beginPath(); g.arc(0,0,pr.size*1.1,0,7); g.stroke();
    g.fillStyle='#ffffff';
    g.beginPath(); g.arc(-pr.size*0.34,-pr.size*0.38,pr.size*0.27,0,7); g.fill();
  }else if(pr.type==='berylcry'){
    // 贝丽尔的水晶：菱形，沿飞行方向拉长
    g.shadowColor=pr.color; g.shadowBlur=20;
    g.globalAlpha=0.30;
    g.fillStyle=pr.color;
    g.beginPath(); g.arc(0,0,pr.size*1.6,0,7); g.fill();
    g.globalAlpha=1;
    const cw=pr.size*1.0, ch=pr.size*1.6;
    const cg=g.createLinearGradient(-cw,-ch,cw,ch);
    cg.addColorStop(0,'#ffffff');
    cg.addColorStop(0.45,pr.color);
    cg.addColorStop(1,'rgba(24,24,48,.92)');
    g.fillStyle=cg;
    g.beginPath(); g.moveTo(0,-ch); g.lineTo(cw,0); g.lineTo(0,ch); g.lineTo(-cw,0); g.closePath(); g.fill();
    g.strokeStyle='rgba(255,255,255,.92)'; g.lineWidth=1.8; g.stroke();
    g.strokeStyle='rgba(255,255,255,.34)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,-ch); g.lineTo(0,ch); g.stroke();
  }else if(pr.type!=='argusBullet'){
    const s=pr.size/17;
    g.scale(s,s);
    g.shadowColor=pr.color; g.shadowBlur=18;
    g.beginPath();
    g.moveTo(17,0); g.lineTo(-11,10.5); g.lineTo(-11,-10.5); g.closePath();
    g.fillStyle=pr.color; g.fill();
    g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=2.2/s; g.stroke();
  }else if(pr.type==='argusBullet'){
    // 阿尔古斯的绿色子弹：直线飞行，带尾迹
    const big=!!pr.strong;
    g.shadowColor=ARGUS_BULLET_COLOR; g.shadowBlur=big?26:16;
    g.globalAlpha=0.32;
    g.fillStyle=ARGUS_BULLET_COLOR;
    const tl=big?pr.size*3.4:pr.size*2.6;
    g.beginPath();
    g.moveTo(-tl,-pr.size*0.34); g.lineTo(0,-pr.size*0.18);
    g.lineTo(0,pr.size*0.18); g.lineTo(-tl,pr.size*0.34);
    g.closePath(); g.fill();
    g.globalAlpha=1;
    g.beginPath();
    g.ellipse(0,0,pr.size*0.9,pr.size*0.42,0,0,7);
    g.fillStyle=ARGUS_BULLET_COLOR; g.fill();
    g.beginPath();
    g.ellipse(0,0,pr.size*0.44,pr.size*0.20,0,0,7);
    g.fillStyle='#f2fff5'; g.fill();
    if(big){
      g.globalAlpha=0.5;
      g.strokeStyle=ARGUS_BULLET_COLOR; g.lineWidth=2;
      g.beginPath(); g.moveTo(-tl*1.3,0); g.lineTo(tl*0.6,0); g.stroke();
      g.globalAlpha=1;
    }
  }
  g.restore();
}

/* ---- 阿尔古斯：标靶 / 锁定眼 / 孔雀羽毛 ---- */
function drawArgusSights(){
  const now=performance.now();
  // 命中后的绿色标靶
  for(const sg of argusSights){
    const k=Math.max(0,Math.min(1,1-sg.t/sg.dur));
    const fade=Math.max(0,sg.t/sg.dur);
    const R0=(sg.strong?30:22)*(0.6+k*0.9);
    g.save();
    g.translate(sg.x,sg.y);
    g.globalAlpha=fade*0.95;
    g.strokeStyle=ARGUS_BULLET_COLOR; g.shadowColor=ARGUS_BULLET_COLOR;
    g.shadowBlur=sg.strong?22:14; g.lineWidth=sg.strong?3:2;
    g.beginPath(); g.arc(0,0,R0,0,7); g.stroke();
    g.globalAlpha=fade*0.7;
    g.beginPath(); g.arc(0,0,R0*0.55,0,7); g.stroke();
    // 十字准星
    g.globalAlpha=fade;
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+k*0.6;
      g.beginPath();
      g.moveTo(Math.cos(a)*R0*0.72,Math.sin(a)*R0*0.72);
      g.lineTo(Math.cos(a)*(R0+9),Math.sin(a)*(R0+9));
      g.stroke();
    }
    g.globalAlpha=fade*0.85;
    g.fillStyle='#ffffff';
    g.beginPath(); g.arc(0,0,2.6*(1-k*0.5),0,7); g.fill();
    g.restore();
  }
  // 追猎锁定：一只眼睛盯着敌人慢慢收紧
  for(const b of balls){
    if(!b.argusLocks || !b.argusLocks.length) continue;
    for(const lk of b.argusLocks){
      const tg=lk.target;
      if(!tg || tg.hp<=0) continue;
      const k=Math.max(0,Math.min(1,1-lk.t/lk.dur));
      const w=26*(1.25-k*0.42), h=15*(1.25-k*0.42);
      g.save();
      g.translate(tg.x,tg.y);
      g.globalAlpha=0.55+0.45*k;
      g.strokeStyle=ARGUS_BULLET_COLOR; g.shadowColor=ARGUS_BULLET_COLOR; g.shadowBlur=18;
      g.lineWidth=2.2;
      g.beginPath(); g.ellipse(0,0,w,h,0,0,7); g.stroke();
      g.fillStyle=ARGUS_BULLET_COLOR; g.globalAlpha=0.9;
      g.beginPath(); g.arc(0,0,7.5-3.5*k,0,7); g.fill();
      g.fillStyle='#0b1f12'; g.globalAlpha=1;
      g.beginPath(); g.arc(0,0,3.4-1.6*k,0,7); g.fill();
      // 上下睫毛
      g.globalAlpha=0.7; g.strokeStyle=ARGUS_BULLET_COLOR; g.lineWidth=1.6;
      for(let i=-2;i<=2;i++){
        const px=i*w/2.6;
        g.beginPath(); g.moveTo(px,-h); g.lineTo(px*1.12,-h-6); g.stroke();
        g.beginPath(); g.moveTo(px,h); g.lineTo(px*1.12,h+6); g.stroke();
      }
      g.restore();
    }
  }
  // 阿尔古斯头顶的孔雀羽毛（百眼巨人期间闪烁）
  for(const b of balls){
    if(b.skillType!=='argus' || b.hp<=0) continue;
    if((b.giantT||0)<=0) continue;
    const pulse=0.45+0.55*Math.abs(Math.sin(now/130));
    g.save();
    g.translate(b.x,b.y-b.r-14);
    g.globalAlpha=pulse;
    g.strokeStyle=ARGUS_BULLET_COLOR; g.shadowColor=ARGUS_BULLET_COLOR; g.shadowBlur=20;
    g.lineWidth=2;
    for(let i=-4;i<=4;i++){
      const a=-Math.PI/2+i*0.20;
      const len=30-Math.abs(i)*2.6;
      g.beginPath();
      g.moveTo(0,4);
      g.quadraticCurveTo(Math.cos(a)*len*0.55,Math.sin(a)*len*1.05,Math.cos(a)*len,Math.sin(a)*len*1.5);
      g.stroke();
      // 羽眼
      const ex=Math.cos(a)*len, ey=Math.sin(a)*len*1.5;
      g.globalAlpha=pulse*0.95;
      g.fillStyle=ARGUS_BULLET_COLOR;
      g.beginPath(); g.arc(ex,ey,4.2,0,7); g.fill();
      g.fillStyle='#fff6d0';
      g.beginPath(); g.arc(ex,ey,1.7,0,7); g.fill();
      g.globalAlpha=pulse;
    }
    g.restore();
  }
}

function drawElecBar(){
  const x=L+14, w=170, h=9;
  for(let t=0;t<teamCount;t++){
    const f=elecField[t];
    if(!f) continue;
    if(!teamHasElec(t) && f.charge<=0) continue;
    const y=B-30-t*26;
    const col=TEAMS[t]?TEAMS[t].color:'#8fa3ba';
    const charonOn=teamHasCharon(t);
    const need=charonOn?CHARON_TOTAL_NEED:((f.lv===1)?elecNeed2(t):(elecNeed2(t)+elecNeed3(t)));
    const base=charonOn?0:((f.lv===1)?0:elecNeed2(t));
    const pct=Math.max(0,Math.min(1,(f.charge-base)/Math.max(1,need-base)));
    g.save();
    g.textAlign='left';
    g.font='11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle='rgba(255,255,255,.62)';
    // Lv.2 的累计是接着 50 层往上叠，不清零，这里直接显示这一段已叠了多少
    // 每条电场都带自己的队伍编号，多队同场时不会看错谁的电场
    const teamLab=(TEAMS[t]&&TEAMS[t].name)||('队伍'+(t+1));
    const segTxt=(f.lv===2 && !charonOn)
      ? (teamLab+' · 涌动电场Lv.2  再叠 '+Math.round(f.charge-elecNeed2(t))+'/'+elecNeed3(t)+'层')
      : (teamLab+' · 涌动电场Lv.'+f.lv+'  '+Math.round(f.charge)+'/'+need+'层');
    g.fillText(segTxt,x,y-5);
    g.fillStyle='rgba(255,255,255,.12)';
    g.fillRect(x,y,w,h);
    g.fillStyle=f.lv>1?ELEC_COLOR:col;
    g.fillRect(x,y,w*pct,h);
    if(f.lv===3){
      g.fillStyle=ELEC_COLOR;
      g.fillText('剩余 '+f.timer.toFixed(1)+'s',x+w+10,y+8);
    }
    g.restore();
  }
}

function drawRice(r){
  g.save();
  g.translate(r.x,r.y);
  g.rotate(Math.sin(r.spin)*0.16);
  g.shadowColor=RICE_COLOR; g.shadowBlur=16;
  g.globalAlpha=Math.min(1,r.life/1.2);
  g.beginPath();
  g.moveTo(-15,-5); g.lineTo(15,-5);
  g.quadraticCurveTo(11,14,0,14); g.quadraticCurveTo(-11,14,-15,-5);
  g.closePath();
  g.fillStyle='#eaf3ff'; g.fill();
  g.strokeStyle='#9db8d6'; g.lineWidth=2; g.stroke();
  g.beginPath(); g.arc(0,-6,11,Math.PI,0); g.fillStyle='#ffffff'; g.fill();
  g.beginPath(); g.arc(-4,-10,3.6,0,7); g.fillStyle='#f2f7ff'; g.fill();
  g.beginPath(); g.arc(3.5,-12,3,0,7); g.fillStyle='#f2f7ff'; g.fill();
  g.restore();
}

/* ---- 术阵地面水印：血红之域→蝙蝠，惊惧故事会→襁褓 ---- */
function drawBat(x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.beginPath();
  g.moveTo(0,-2);
  g.quadraticCurveTo(-13,-17,-31,-7);
  g.quadraticCurveTo(-21,3,-16,11);
  g.quadraticCurveTo(-10,4,-6,9);
  g.quadraticCurveTo(-3,15,0,17);
  g.quadraticCurveTo(3,15,6,9);
  g.quadraticCurveTo(10,4,16,11);
  g.quadraticCurveTo(21,3,31,-7);
  g.quadraticCurveTo(13,-17,0,-2);
  g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-6,-5); g.lineTo(-8,-17); g.lineTo(-1,-7); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(6,-5); g.lineTo(8,-17); g.lineTo(1,-7); g.closePath(); g.fill();
  g.restore();
}
function drawSwaddle(x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  // 布卷
  g.beginPath();
  g.moveTo(-18,0);
  g.quadraticCurveTo(-20,24,0,26);
  g.quadraticCurveTo(20,24,18,0);
  g.quadraticCurveTo(0,-8,-18,0);
  g.closePath(); g.fill();
  // 露出的小脑袋
  g.beginPath(); g.arc(0,-9,7.5,0,7); g.fill();
  // 绑带：用底色的反相缺口画出来
  g.save();
  g.globalCompositeOperation='destination-out';
  g.lineWidth=3;
  g.beginPath(); g.moveTo(-18,6); g.lineTo(18,6); g.stroke();
  g.beginPath(); g.moveTo(-9,10); g.lineTo(9,10); g.stroke();
  g.restore();
  g.restore();
}
function drawFieldSigil(){
  if(!stories.length) return;
  const now=performance.now();
  for(const z of stories){
    if(z.kind==='seme'){
      const a=0.09+0.045*Math.sin(now/280);
      g.save(); g.globalAlpha=a; g.fillStyle=SEME_COLOR;
      const spots=[[0.22,0.72,1.0],[0.5,0.87,1.3],[0.78,0.68,0.82],[0.4,0.6,0.6]];
      for(const s of spots){
        drawBat(L+(R-L)*s[0],T+(B-T)*s[1],s[2]*(0.92+0.08*Math.sin(now/320+s[0]*11)));
      }
      g.restore();
    }else if(z.kind==='story'){
      const a=0.085+0.04*Math.sin(now/340+1.2);
      g.save(); g.globalAlpha=a; g.fillStyle=STORY_COLOR;
      drawSwaddle(L+(R-L)*0.5,T+(B-T)*0.78,1.55*(0.97+0.03*Math.sin(now/420)));
      drawSwaddle(L+(R-L)*0.26,T+(B-T)*0.6,0.9);
      drawSwaddle(L+(R-L)*0.74,T+(B-T)*0.62,0.75);
      g.restore();
    }
  }
}

function draw(){
  g.save();
  if(shake>0.4){
    g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    shake*=0.9;
  }
  g.clearRect(-20,-20,W+40,H+40);
  g.fillStyle='#0a0e13'; g.fillRect(0,0,W,H);

  g.strokeStyle='rgba(255,255,255,.035)'; g.lineWidth=1;
  for(let x=L;x<=R;x+=48){g.beginPath();g.moveTo(x,T);g.lineTo(x,B);g.stroke();}
  for(let y=T;y<=B;y+=48){g.beginPath();g.moveTo(L,y);g.lineTo(R,y);g.stroke();}

  // 术阵地面水印（蝙蝠 / 襁褓）垫在最底下
  drawFieldSigil();

  for(const p of particles){
    g.globalAlpha=Math.max(0,p.life);
    g.fillStyle=p.c;
    g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();
  }
  g.globalAlpha=1;

  for(const r of rices) drawRice(r);
  drawBolts();
  for(const pr of projs) drawProj(pr);

  // 虞美人花丛
  for(const f of poppies){
    g.save();
    const now=performance.now();
    g.globalAlpha=0.14*(0.9+0.1*Math.sin(now/220));
    g.fillStyle=f.color;
    g.beginPath(); g.arc(f.x,f.y,f.radius,0,7); g.fill();
    g.globalAlpha=0.55;
    g.strokeStyle=f.color; g.lineWidth=2;
    g.beginPath(); g.arc(f.x,f.y,f.radius*(0.72+0.22*Math.sin(now/400)),0,7); g.stroke();
    // 三级电场里丢出来的强化版：整片花丛多一圈金边，花瓣也更亮
    if(f.lv3){
      g.globalAlpha=0.3+0.12*Math.sin(now/260);
      g.strokeStyle='#ffe9a8'; g.lineWidth=2.4;
      g.beginPath(); g.arc(f.x,f.y,f.radius*(0.52+0.08*Math.sin(now/330)),0,7); g.stroke();
      g.globalAlpha=0.16;
      g.fillStyle='#ffe9a8';
      g.beginPath(); g.arc(f.x,f.y,f.radius*0.86,0,7); g.fill();
    }
    g.globalAlpha=1;
    for(let i=0;i<5;i++){
      const s=f.ang+i*Math.PI*2/5;
      const ps=f.lv3?1.24:1;
      g.fillStyle=f.lv3?(i%2?'#ffd9f4':f.color):f.color;
      g.beginPath();
      g.ellipse(f.x+Math.cos(s)*10*ps,f.y+Math.sin(s)*10*ps,8*ps,4.6*ps,s,0,7); g.fill();
      if(f.lv3){
        g.globalAlpha=0.75; g.strokeStyle='#ffe9a8'; g.lineWidth=1.4; g.stroke();
        g.globalAlpha=1;
      }
    }
    g.fillStyle='#f2e4ff';
    g.beginPath(); g.arc(f.x,f.y,4.2,0,7); g.fill();
    g.font='bold 13px -apple-system,"PingFang SC",sans-serif';
    g.textAlign='center';
    g.fillStyle=f.color;
    g.fillText(Math.ceil(f.life)+'s',f.x,f.y-f.radius-6);
    g.restore();
  }

  for(const rg of rings){
    g.save();
    g.globalAlpha=Math.max(0,1-rg.r/(rg.max||SONIC_RING_MAX))*0.85;
    g.strokeStyle=rg.color; g.lineWidth=4;
    g.beginPath(); g.arc(rg.x,rg.y,rg.r,0,7); g.stroke();
    g.restore();
  }

  // 治疗效果（愈合 / 光束 / 影子）
  drawHeals();
  // 命中反馈（狙击 / 炮弹 / 钓鱼 / 车票 / 导弹）
  drawHits();
  drawTriBursts();
  // 双生舞伶【聚合射线】的激光
  drawLasers();
  // 双生舞伶尤里卡合体：银色闪片 + 星星环绕
  drawTwinSpins();
  // 阿尔古斯：绿色标靶 / 追猎锁定眼 / 孔雀羽毛
  drawArgusSights();

  // 塞梅爆炸冲击波
  drawShocks();
  // 环状水星【赠予夜的晨星】：中央迪斯科灯球
  drawMerBalls();

  for(const b of balls){
    if(b.hp<=0) continue;
    g.save();
    if(b.invisT>0 || (b.hideHit||0)>0) g.globalAlpha=0.34;
    // 【漫游迪斯科】：半透明，并且不像星锑那样稳定，会一直闪
    if((b.merDiscoT||0)>0 || (b.merTraceT||0)>0) g.globalAlpha=0.30+0.34*Math.abs(Math.sin(performance.now()/145));
    g.beginPath();
    g.arc(b.x,b.y,b.r+10,0,7);
    g.fillStyle=b.color+'22';
    g.fill();

    const driving=(b.skillType==='brume' && b.grayDriveT>0);
    if(driving){
      // 【阿黛拉】驾驶中：本体替换成一节列车车厢
      const cang=Math.atan2(b.vy,b.vx);
      const cs=b.r/17;
      g.save();
      g.translate(b.x,b.y); g.rotate(cang); g.scale(cs,cs);
      g.shadowColor=GRAY_COLOR; g.shadowBlur=14;
      g.fillStyle=GRAY_COLOR;
      g.beginPath(); g.rect(-26,-14,52,28); g.fill();
      g.shadowBlur=0;
      g.fillStyle='#1d242e';
      g.fillRect(-18,-7,11,14);
      g.fillRect(1,-7,11,14);
      g.fillStyle='#ffe9c2';
      g.beginPath(); g.arc(-13,-11,2.6,0,7); g.fill();
      g.beginPath(); g.arc(-13,11,2.6,0,7); g.fill();
      g.beginPath(); g.arc(14,-11,2.6,0,7); g.fill();
      g.beginPath(); g.arc(14,11,2.6,0,7); g.fill();
      g.restore();
    }else{
      const faceImg=faceOf(b);
      if(faceImg){
        // 有立绘的角色：圆形裁切贴在球面上
        g.save();
        g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.clip();
        g.drawImage(faceImg,b.x-b.r,b.y-b.r,b.r*2,b.r*2);
        g.restore();
        // 边缘压暗，看起来还是个球
        const rim=g.createRadialGradient(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.15,b.x,b.y,b.r);
        rim.addColorStop(0,'rgba(255,255,255,.16)');
        rim.addColorStop(0.6,'rgba(255,255,255,0)');
        rim.addColorStop(1,'rgba(0,0,0,.55)');
        g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fillStyle=rim;g.fill();
        g.strokeStyle=b.color; g.lineWidth=3;
        g.beginPath();g.arc(b.x,b.y,b.r-1.5,0,7);g.stroke();
      }else{
        const grd=g.createRadialGradient(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.1,b.x,b.y,b.r);
        grd.addColorStop(0,'#ffffff');
        grd.addColorStop(0.35,b.color);
        grd.addColorStop(1,'rgba(0,0,0,.55)');
        g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fillStyle=grd;g.fill();
      }
    }

    g.restore();
    // 【漫游迪斯科】虚化：淡紫虚线外圈，看着是透的
    if((b.merDiscoT||0)>0 || (b.merTraceT||0)>0){
      g.save();
      g.globalAlpha=0.45+0.25*Math.sin(performance.now()/110);
      g.strokeStyle='#c9a8ff'; g.lineWidth=3; g.setLineDash([8,6]);
      g.beginPath(); g.arc(b.x,b.y,b.r+7,0,7); g.stroke();
      g.restore();
    }

    if(b.flash>0 && !driving){
      g.globalAlpha=b.flash*0.7;
      g.fillStyle='#fff';
      g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();
      g.globalAlpha=1;
    }
    if(!driving && !faceOf(b)){
      // 只有纯色小球才画那两只默认眼睛；贴了立绘的角色不再画
      const ang=Math.atan2(b.vy,b.vx);
      g.fillStyle='#0d1117';
      for(const s of [-1,1]){
        const ex=b.x+Math.cos(ang)*b.r*0.34+Math.cos(ang+Math.PI/2)*b.r*0.38*s;
        const ey=b.y+Math.sin(ang)*b.r*0.34+Math.sin(ang+Math.PI/2)*b.r*0.38*s;
        g.beginPath();g.arc(ex,ey,b.r*0.15,0,7);g.fill();
      }
    }
    const w=b.r*2, hh=6, bx=b.x-w/2, by=b.y-b.r-16;
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(bx,by,w,hh);
    g.fillStyle=b.color;g.fillRect(bx,by,w*Math.max(0,b.hp/b.maxhp),hh);

    if(b.skillType){
      const lbl=skillLabel(b);
      const mkFont=fs=>'bold '+fs+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      const maxW=Math.max(190,b.r*7.5);
      g.textAlign='center';
      g.fillStyle='rgba(255,255,255,.85)';
      // 固定字号，不缩字号；一行塞不下就按 · 拆行，最多三行，往血条上方堆
      g.font=mkFont(13);
      if(g.measureText(lbl).width<=maxW){
        g.fillText(lbl,b.x,by-7);
      }else{
        const lines=[]; let cur='';
        for(const part of lbl.split(' · ')){
          const tryLine=cur?cur+' · '+part:part;
          if(cur && g.measureText(tryLine).width>maxW){ lines.push(cur); cur=part; }
          else cur=tryLine;
        }
        if(cur) lines.push(cur);
        const show=lines.slice(0,3);
        if(lines.length>3) show[2]=show[2]+'…';
        for(let i=0;i<show.length;i++) g.fillText(show[i],b.x,by-7-(show.length-1-i)*15);
      }
    }
    if(b.skillType==='ulrich' && b.castT>0){
      // 吟诵进度条
      const cw=b.r*2.2, cx=b.x-cw/2, cy=b.y+b.r+6;
      const p=Math.max(0,Math.min(1,1-b.castT/ULRICH_CAST));
      g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(cx,cy,cw,5);
      g.fillStyle=ULRICH_COLOR; g.fillRect(cx,cy,cw*p,5);
      g.strokeStyle='rgba(127,211,255,.65)'; g.lineWidth=1; g.strokeRect(cx,cy,cw,5);
    }
    if(b.skillType==='lucy' && fieldOf(b.team).lv===3){
      g.font='bold 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign='center';
      g.fillStyle=LUCI_COLOR;
      g.shadowColor=LUCI_COLOR; g.shadowBlur=12;
      g.fillText('全克制',b.x,by-22);
      g.shadowBlur=0;
    }
    if(b.skillType==='brume' && b.grayDriveT>0){
      // 【阿黛拉】驾驶中：车身已有车厢特效，这里只加一层淡光晕
      g.save();
      g.globalAlpha=0.28+0.12*Math.sin(performance.now()/180);
      g.strokeStyle=GRAY_COLOR; g.lineWidth=4;
      g.shadowColor=GRAY_COLOR; g.shadowBlur=20;
      g.beginPath();g.arc(b.x,b.y,b.r+8,0,7);g.stroke();
      g.restore();
    }
    // 【术具调谐】：边框上的半透明五线谱
    drawTuneStaff(b);
    // 状态徽标：女巫帽 / 扫把 / 爪痕 / 鹰爪
    drawMerRing(b);
    drawStatusMarks(b);
    // 芦草结：枯萎 / 种子闪叶 / 萌发 / 失去一苇之所如
    drawReedMarks(b);
    // 马库斯：书页翻动 / 小马 305 数字 / 松鼠护目镜
    drawMarcusMarks(b);
    // 纸信圈儿：告别大地期间头顶大号纸飞机
    drawPaperMarks(b);
    if((b.beastT||0)>0){
      g.save();
      g.globalAlpha=0.55+0.35*Math.sin(performance.now()/120);
      g.strokeStyle=MARCUS_COLOR; g.lineWidth=4; g.setLineDash([10,6]);
      g.beginPath(); g.arc(b.x,b.y,b.r+15,0,7); g.stroke();
      g.restore();
    }
    if(b.shield>0){
      g.save();
      g.globalAlpha=0.35+0.35*Math.sin(performance.now()/220);
      g.strokeStyle='#cfe3f2'; g.lineWidth=3; g.setLineDash([9,7]);
      g.beginPath();g.arc(b.x,b.y,b.r+11,0,7);g.stroke();
      g.restore();
    }
    if(b.skillType==='reed'){
      g.save();
      const seed=(b.reedMode==='seed');
      g.globalAlpha=(seed?0.18:0.30)+0.20*Math.sin(performance.now()/300);
      g.strokeStyle=(b.reedGrace?REED_GRACE_COLOR:REED_COLOR); g.lineWidth=seed?2:3;
      if(seed) g.setLineDash([6,7]);
      g.beginPath();g.arc(b.x,b.y,b.r+(seed?2:9),0,7);g.stroke();
      g.restore();
    }
    // 【涌动电场Lv.3】：电能角色高亮，并用电流环绕
    if(b.trait==='电能' && fieldOf(b.team).lv===3){
      const now=performance.now();
      g.save();
      g.shadowColor=ELEC_COLOR; g.shadowBlur=26;
      g.globalAlpha=0.55+0.30*Math.sin(now/140);
      g.strokeStyle=ELEC_COLOR; g.lineWidth=4;
      g.beginPath();g.arc(b.x,b.y,b.r+9,0,7);g.stroke();
      g.globalAlpha=0.95; g.lineWidth=2;
      for(let k=0;k<3;k++){
        const base=now/260+k*2.09;
        g.beginPath();
        for(let i=0;i<=20;i++){
          const a=base+i*0.26;
          const rr=b.r+12+Math.sin(a*3+k)*5;
          const px=b.x+Math.cos(a)*rr, py=b.y+Math.sin(a)*rr;
          if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
        }
        g.stroke();
      }
      g.restore();
    }
    if(b.poison.length>0){
      g.strokeStyle=POISON_COLOR; g.lineWidth=3;
      g.globalAlpha=0.55+0.35*Math.sin(performance.now()/140);
      g.beginPath();g.arc(b.x,b.y,b.r+7,0,7);g.stroke();
      g.globalAlpha=1;
      g.font='bold 14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign='center';
      g.fillStyle=POISON_COLOR;
      g.fillText('毒 '+b.poison.length+' · '+poisonTotal(b)+(b.essence?' · 除灵'+b.essence:''),b.x,b.y+b.r+20);
    }else if(b.essence>0){
      g.font='bold 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign='center';
      g.fillStyle=ESSENCE_COLOR;
      g.fillText('除灵 '+b.essence,b.x,b.y+b.r+20);
    }
    if(b.soul && b.soul.length>0){
      g.save();
      g.strokeStyle=SOUL_COLOR; g.lineWidth=3;
      g.globalAlpha=0.55+0.35*Math.sin(performance.now()/180);
      g.beginPath();g.arc(b.x,b.y,b.r+13,0,7);g.stroke();
      g.restore();
      g.font='bold 14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign='center';
      g.fillStyle=SOUL_COLOR;
      g.fillText('灵魂 '+b.soul.length+' · '+Math.round(soulTotal(b)),b.x,b.y+b.r+40);
    }
    if(b.burn>0){
      g.font='bold 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign='center';
      g.fillStyle='#ff8a4c';
      const off=(b.poison.length>0||b.essence>0?20:0)+((b.soul&&b.soul.length>0)?20:0);
      g.fillText('燃 '+b.burn,b.x,b.y+b.r+20+off);
    }
    g.globalAlpha=1;
  }

  drawSpiritFields();
  drawWalls();
  drawXueArt();
  drawFishFlash();
  drawRailTrain();

  // 术阵横幅：血红之域 / 惊惧故事会 都走同一套（顶部大字 + 剩余时间 + 一句效果）
  stories.forEach((s,i)=>{
    const isStory=s.kind==='story';
    const sCol=isStory?'201,169,255':'255,95,126';
    const nm=isStory?'惊惧故事会':'血红之域';
    const sub=isStory?'每3秒中毒翻倍 · 结算不消耗':'8血换1薪血 · 3血换+3伤';
    const tName=(TEAMS[s.team]&&TEAMS[s.team].name)||('队伍'+((s.team||0)+1));
    g.save();
    g.globalAlpha=0.06+0.04*Math.sin(performance.now()/320);
    g.fillStyle=s.owner.color; g.fillRect(L,T,R-L,B-T);
    g.restore();
    g.save();
    g.textAlign='center';
    g.font='bold 19px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle='rgba('+sCol+',.95)';
    g.fillText(nm+'  '+s.time.toFixed(1)+'s',W/2,T+36+i*46);
    g.font='12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle='rgba('+sCol+',.62)';
    g.fillText(tName+' · '+sub,W/2,T+58+i*46);
    g.restore();
  });

  /* 【降噪C】分级显示：带数值的是伤害/治疗数字（大、亮、描边清晰）；
     纯文字的状态提示（小、淡、无黑描边）。末段才淡出，不再整条线性变虚 */
  for(const t of texts){
    const isNum=/[-+]\s*\d/.test(t.s);
    const fs=isNum ? Math.max(20,(t.size||22)) : Math.max(14,Math.round((t.size||22)*0.68));
    const baseA=isNum?1:0.82;
    g.globalAlpha=Math.min(1,t.life/0.5)*baseA;
    g.font=(isNum?'bold ':'600 ')+fs+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    g.textAlign='center';
    if(isNum){
      g.lineJoin='round';
      g.lineWidth=3.2;
      g.strokeStyle='rgba(0,0,0,.78)';
      g.strokeText(t.s,t.x,t.y);
      g.shadowColor='rgba(0,0,0,0)';
      g.shadowBlur=0;
    } else {
      g.shadowColor='rgba(0,0,0,.55)';
      g.shadowBlur=3;
    }
    g.fillStyle=t.c;g.fillText(t.s,t.x,t.y);
    g.shadowBlur=0;
  }
  g.globalAlpha=1;

  if(over){
    g.fillStyle='rgba(6,9,13,.66)';g.fillRect(0,0,W,H);
    const w=over.winner;
    g.textAlign='center';
    g.fillStyle='#e6edf3';
    g.font='bold 46px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(w<0?'同归于尽':((TEAMS[w]?TEAMS[w].name:'队伍')+' 赢了'),W/2,H/2-10);
    g.font='17px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle='#7d8899';
    const dead=balls.filter(b=>b.hp<=0).map(b=>b.name).join('、');
    g.fillText(dead+' 先躺了 · 点一下回选人界面',W/2,H/2+36);
  }
  g.restore();
}

/* ---- 悬浮技能卡 ---- */
const cardTip=document.getElementById('cardTip');
function tipShow(e,html){
  cardTip.innerHTML=html;
  cardTip.style.display='block';
  const pad=14, m=8;
  const rot=document.documentElement.getAttribute('data-device')==='mobile' &&
            window.innerHeight>window.innerWidth;
  // 整页转过90°时，画面的可用宽高要互换
  const vw=rot?window.innerHeight:window.innerWidth;
  const vh=rot?window.innerWidth:window.innerHeight;
  // 先按屏幕大小限制卡片自身尺寸，再用真实宽高定位，四边都不越界
  // 宽度固定，高度跟着页面可用空间走：内容少就矮，撑满视口再滚动
  const isMobile=document.documentElement.getAttribute('data-device')==='mobile';
  const cardW=Math.min(isMobile?vw*0.72:320,Math.max(140,vw-m*2));
  cardTip.style.width=Math.max(140,cardW)+'px';
  cardTip.style.maxHeight=Math.max(90,vh-m*2)+'px';
  cardTip.style.overflowY='auto';
  const w=cardTip.offsetWidth||240, h=cardTip.offsetHeight||120;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(v,hi));
  let x,y;
  if(rot){
    // 顺着旋转把手指坐标映射到内容坐标系
    x=clamp(e.clientY+pad,m,vw-w-m);
    y=clamp(vh-e.clientX+pad,m,vh-h-m);
  }else{
    x=clamp(e.clientX+pad,m,vw-w-m);
    y=clamp(e.clientY+pad,m,vh-h-m);
  }
  cardTip.style.left=x+'px'; cardTip.style.top=y+'px';
}
function tipHide(){ cardTip.style.display='none'; }
// 页面尺寸变化时：高度重新跟着视口走，卡片顺手拉回可视区内
function tipRefit(){
  if(cardTip.style.display!=='block') return;
  const m=8;
  const rot=document.documentElement.getAttribute('data-device')==='mobile' &&
            window.innerHeight>window.innerWidth;
  const vw=rot?window.innerHeight:window.innerWidth;
  const vh=rot?window.innerWidth:window.innerHeight;
  cardTip.style.maxHeight=Math.max(90,vh-m*2)+'px';
  const w=cardTip.offsetWidth||240, h=cardTip.offsetHeight||120;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(v,hi));
  cardTip.style.left=clamp(parseFloat(cardTip.style.left)||m,m,vw-w-m)+'px';
  cardTip.style.top=clamp(parseFloat(cardTip.style.top)||m,m,vh-h-m)+'px';
}
window.addEventListener('resize', tipRefit);
function elemText(e){
  if(!e) return '';
  if(e==='all') return '全属性（打任意属性都算克制）';
  return e;
}
function charTipHTML(ch,miss){
  const meta=[]; 
  if(ch.element) meta.push(elemText(ch.element)+(ch.element2?'/'+elemName(ch.element2):''));
  if(ch.tag) meta.push(ch.tag==='all'?'全定位':ch.tag);
  meta.push('皮肤价格 '+(typeof ch.price==='number'?ch.price:'未填'));
  return '<div class="tname">'+ch.name+'</div>'+
    (ch.en?'<div class="ten">'+ch.en+'</div>':'')+
    '<div class="tmeta">'+meta.join(' · ')+'</div>'+
    (ch.desc?'<div class="tdesc">'+ch.desc+'</div>':'')+
    '<div class="tskill">技能：'+(ch.skill||'无技能')+'</div>'+
    ((miss&&miss.length)?'<div class="twarn">【提醒】新角色必须先补全'+miss.join('、')+'，补全后才能上场</div>':'');
}
function ballTipHTML(b){
  const ch=CHARS[b.key]||{};
  const meta=[];
  if(b.element) meta.push(elemText(b.element));
  if(b.tag) meta.push(b.tag==='all'?'全定位':b.tag);
  const live=b.hp>0&&b.skillType?skillLabel(b):'';
  return '<div class="tname">'+b.name+'</div>'+
    ((b.en||ch.en)?'<div class="ten">'+(b.en||ch.en)+'</div>':'')+
    (meta.length?'<div class="tmeta">'+meta.join(' · ')+'</div>':'')+
    '<div class="tskill">技能：'+(ch.skill||'无技能')+'</div>'+
