/* ---- 手机端队伍详情：字号自适应，保证所有队伍和成员都塞进窄栏 ---- */
function fitHudText(){
  const hud=document.getElementById('hud');
  if(!hud) return;
  if(document.documentElement.getAttribute('data-device')!=='mobile'){
    hud.style.removeProperty('--hudFs');
    return;
  }
  let fs=11;
  hud.style.setProperty('--hudFs',fs+'px');
  for(let i=0;i<16 && fs>5;i++){
    let over=false;
    for(const el of hud.querySelectorAll('.hcol,.unit,.un,.sk')){
      if(el.scrollHeight>el.clientHeight+1 || el.scrollWidth>el.clientWidth+1){ over=true; break; }
    }
    if(!over) break;
    fs-=0.5;
    hud.style.setProperty('--hudFs',fs+'px');
  }
}

function buildHud(){
  const hudEl=document.getElementById('hud');
  hudEl.innerHTML='';
  for(let t=0;t<teamCount;t++){
    const col=document.createElement('div');
    col.className='hcol';
    const th=document.createElement('div');
    th.className='teamhead';
    th.textContent=teamName(t);
    if(TEAMS[t]) th.style.color=TEAMS[t].color;
    const xs=document.createElement('span');
    xs.className='xue';
    const xe=document.createElement('span');
    xe.className='elec';
    const ctr=document.createElement('span');
    ctr.className='ctrs';
    ctr.appendChild(xs);
    ctr.appendChild(xe);
    th.appendChild(ctr);
    col._xueEl=xs;
    col._elecEl=xe;
    col.appendChild(th);
    hudEl.appendChild(col);
  }
  for(const ball of balls){
    ball._el=null;
    if(ball.skillType==='qiangliang') continue;
    // 死掉的鹰不再占 HUD 一条（它是共享血量的召唤物，本身不该单独留栏）
    if(ball.skillType==='birdie' && ball.hp<=0) continue;
    const el=document.createElement('div');
    el.className='unit';
    el.innerHTML='<div class="un"><span>'+ball.name.replace(/（[^）]*）/g,'')+'</span><span class="uhp">100</span></div>'+
      '<div class="bar"><div class="fill" style="background:'+ball.color+'"></div></div>'+
      '<div class="sk"></div>';
    el._b=ball;
    ball._el=el;
    el.addEventListener('mouseenter',e=>tipShow(e,ballTipHTML(ball)));
    el.addEventListener('mousemove',e=>tipShow(e,ballTipHTML(ball)));
    el.addEventListener('mouseleave',tipHide);
    const col=hudEl.children[ball.team]||hudEl.children[0];
    if(col) col.appendChild(el);
  }
  fitHudText();
}
function hud(){
  const hudEl=document.getElementById('hud');
  for(let t=0;t<hudEl.children.length;t++){
    const col=hudEl.children[t], xs=col._xueEl;
    if(!xs) continue;
    const kind=teamCtrKind(t);
    if(kind==='薪血'){
      const f=xueOf(t), cap=xueCap(t);
      const pct=Math.max(0,Math.min(1,f.stock/Math.max(1,cap)));
      xs.className='xue on'+(f.stock>=cap?' full':'');
      xs.innerHTML='<span class="hi">♥</span><b>'+f.stock+'</b><span class="cap">/'+cap+'</span>'
        +'<span class="hb"><i style="width:'+(pct*100).toFixed(0)+'%"></i></span>';
    }else if(kind==='余辉'){
      const stock=Math.max(0,Math.min(GUANG_MAX,guangStock[t]||0));
      const pct=stock/GUANG_MAX;
      xs.className='xue on yh'+(stock>=GUANG_MAX?' full':'');
      xs.innerHTML='<span class="hi cr"></span><span class="nm">聚光盏</span><b>'+stock+'</b>'
        +'<span class="cap">/'+GUANG_MAX+'</span>'
        +'<span class="hb"><i style="width:'+(pct*100).toFixed(0)+'%"></i></span>';
    }else{
      xs.className='xue'; xs.textContent='';
    }
    // 【术具】：交感能量做成一颗颗大圆珠，涨的时候跳一下（全队共用）
    if(!col._shj || !col._shj.isConnected){
      const d=document.createElement('div');
      d.className='shjrow';
      col.appendChild(d);
      col._shj=d; col._shjPrev={}; col._shjKey='';
    }
    if(shujuChars(t).length){
      const en=shujuEnergy[t]||{};
      const vals=[];
      for(const el of SHUJU_ELES){ const v=en[el]||0; if(v>0) vals.push([el,v]); }
      // 【万能交感能量】：回声谣产出的那份也要在能量珠里露出来
      { const uv=en['万能']||0; if(uv>0) vals.push(['万能',uv]); }
      const lv=shujuLv[t]||{call:0,cost:0};
      const key=vals.map(p=>p[0]+p[1]).join(',')+'#'+lv.call+'-'+lv.cost;
      if(col._shjKey!==key){
        col._shjKey=key;
        const prev=col._shjPrev||{};
        const mx=Math.max(1,...vals.map(p=>p[1]));
        let html='';
        for(const pr of vals){
          const el=pr[0], v=pr[1];
          const r=13+Math.round(17*Math.pow(v/mx,0.55));   // 占比越大圆珠越大
          const c=(typeof ELEM_COLOR!=='undefined' && ELEM_COLOR[el]) || '#ffd76b';
          const pop=(prev[el]!==undefined && v>prev[el])?' pop':'';
          const uni=(el==='万能');
          const bgStyle=uni ? ('width:'+r+'px;height:'+r+'px;')
                            : ('width:'+r+'px;height:'+r+'px;background:radial-gradient(circle at 32% 26%, #fffdf0 0%, '+c+' 58%, rgba(20,14,4,.55) 100%);');
          const lab=(el==='万能')?'万':el;   // 彩球标签简写成“万”
          html+='<span class="shjball'+(uni?' uni':'')+pop+'" style="'+bgStyle+'">'
              +'<i>'+lab+'</i><b>'+v+'</b></span>';
        }
        if(vals.length) html+='<span class="shjlv">唤'+lv.call+' 耗'+lv.cost+'</span>';
        col._shj.innerHTML=html;
        const nx={};
        for(const pr of vals) nx[pr[0]]=pr[1];
        col._shjPrev=nx;
      }
    }else if(col._shj.innerHTML){
      col._shj.innerHTML=''; col._shjPrev={}; col._shjKey='';
    }
    // 【涌动电场】：跟【薪之杯】【聚光盏】一样挂在队伍血条右侧，不再画在场中
    const xe=col._elecEl;
    if(xe){
      const f=elecField[t];
      const on=!!(f && (teamHasElec(t) || f.charge>0));
      if(on){
        const charonOn=teamHasCharon(t);
        let html;
        if(f.lv===3){
          html='<span class="nm">涌动电场</span><span>Lv.3</span><span class="cap">'+f.timer.toFixed(1)+'s</span>';
        }else{
          const need=charonOn?CHARON_TOTAL_NEED:((f.lv===1)?elecNeed2(t):(elecNeed2(t)+elecNeed3(t)));
          const base=charonOn?0:((f.lv===1)?0:elecNeed2(t));
          html='<span class="nm">涌动电场</span><span>Lv.'+f.lv+'</span><b>'+Math.round(f.charge-base)
              +'</b><span class="cap">/'+Math.round(need-base)+'</span>';
        }
        const cn='elec on'+(f.lv===3?' lv3':'');
        if(xe.className!==cn) xe.className=cn;
        if(xe._h!==html){ xe.innerHTML=html; xe._h=html; }
      }else if(xe.className!=='elec'){
        xe.className='elec'; xe.innerHTML=''; xe._h='';
      }
    }
  }
  for(const b of balls){
    if(!b._el) continue;
    b._el.querySelector('.uhp').textContent=Math.ceil(Math.max(0,b.hp));
    b._el.querySelector('.fill').style.width=Math.max(0,b.hp/b.maxhp*100)+'%';
    b._el.querySelector('.sk').textContent=b.hp>0&&b.skillType?skillLabel(b):'';
  }
}

// 角色按属性分组，方便查找（属性只有岩/兽/木/星/灵/智，没有【全系】）
function groupKeys(){
  const all=Object.keys(CHARS).filter(k=>!CHARS[k].hidden && !CHARS[k].empty);
  const out=[];
  // 测试角色：鱼鱼号、红球这类全属性角色单开一组，不再混进各系分组
  const testKeys=['none'].concat(all.filter(k=>CHARS[k].element==='all'));
  if(testKeys.length) out.push({label:'测试角色',color:'#9dc0d8',keys:testKeys});
  for(const el of ELEMENTS){
    // 双属性角色（如双生舞伶 岩/星）在两个系的分组里都出现一次
    out.push({label:el+'系',el:el,color:ELEM_COLOR[el]||'#9dc0d8',keys:all.filter(k=>CHARS[k].element===el||CHARS[k].element2===el)});
  }
  const rest=all.filter(k=>CHARS[k].element!=='all' && !ELEMENTS.includes(CHARS[k].element));
  if(rest.length) out.push({label:'未标属性',color:'#ff9a6b',keys:rest});
  return out.filter(g=>g.keys.length);
}

function buildSelect(){
  // 选角面板一重建就收起技能卡：选中折叠后不再有介绍卡挂在屏幕上
  tipHide();

  ensurePicks();
  // 每次重建面板都把当前双方已选角色的语音预热一遍（幂等，随机模式也能兜住）
  window.__voiceWarmAll&&window.__voiceWarmAll([].concat.apply([],picks));
  const wrap=document.getElementById('teams');
  wrap.innerHTML='';
  for(let t=0;t<teamCount;t++){
    const col=document.createElement('div');
    col.className='teamcol';

    th.className='teamhead';
    th.textContent=teamName(t);
    if(TEAMS[t]) th.style.color=TEAMS[t].color;
    col.appendChild(th);
    for(let s=0;s<perTeam;s++){
      const slot=document.createElement('div');
      const isOpen=!!(selOpen && selOpen.t===t && selOpen.s===s);
      slot.className='slot'+(isOpen?' open':'');
      const sh=document.createElement('div');
      sh.className='slothead';
      sh.innerHTML='<b>角色'+(s+1)+'</b>';
      slot.appendChild(sh);
      // 折叠态：把这一格当前的角色标签放在角色位旁边，点一下再展开选角
      const curKey=picks[t][s]||'none';
      const curCh=CHARS[curKey]||{name:'无角色',color:'#3b4654'};
      const tagEl=document.createElement('div');
      tagEl.className='picktag'+(curKey==='none'?' empty':' on');
      if(curKey!=='none'){
        // 已选中的角色位：统一按属性描边加粗高亮，点一下就能重新选
        const sc=elemColorOf(curKey);
        tagEl.style.borderColor=sc;
        tagEl.style.borderWidth='2px';
        tagEl.style.color='#eaf7ff';
        tagEl.style.boxShadow='0 0 12px '+sc+'55';
      }
      tagEl.innerHTML='<span class="cd" style="background:'+(curKey==='none'?'#3b4654':elemColorOf(curKey))+'"></span>'+curCh.name+(curKey!=='none'&&curCh.trait&&curCh.trait!=='无'?'<i class="tr">'+curCh.trait+'</i>':'');
      tagEl.addEventListener('click',()=>{
        selOpen=(isOpen?null:{t,s});
        buildSelect();
      });
      slot.appendChild(tagEl);
      if(isOpen){
        const chips=document.createElement('div');
        chips.className='chips';
        for(const grp of groupKeys()){
          const gh=document.createElement('div');
          gh.className='grp';
          gh.textContent=grp.label;
          if(grp.color) gh.style.color=grp.color;
          chips.appendChild(gh);
          for(const key of grp.keys){
            const ch=CHARS[key];
            if(ch.hidden) continue;
            // 统一按属性取色：双属性角色跟着所在分组走（岩系黄、星系蓝）
            const chipColor=grp.el?(ELEM_COLOR[grp.el]||ELEM_FALLBACK):elemColorOf(key);
            const chip=document.createElement('div');
            const on=picks[t][s]===key;
            chip.className='chip'+(on?' sel':'');
            if(on){ chip.style.borderColor=chipColor; chip.style.color='#eaf7ff'; }
            const miss=charMissing(key);
            chip.innerHTML='<span class="cd" style="background:'+chipColor+'"></span>'+ch.name+(ch.element?'<i class="el">'+elemName(ch.element)+(ch.element2?'/'+elemName(ch.element2):'')+'</i>':'')+(ch.trait?'<i class="tr">'+ch.trait+'</i>':'')+(miss.length?'<i class="miss">缺'+miss.join('/')+'</i>':'');
            chip.addEventListener('mouseenter',e=>tipShow(e,charTipHTML(ch,miss)));
            chip.addEventListener('mousemove',e=>tipShow(e,charTipHTML(ch,miss)));
            chip.addEventListener('mouseleave',tipHide);
            // 手机没有 hover：按住角色就先看技能卡
            chip.addEventListener('touchstart',e=>{
              if(document.documentElement.getAttribute('data-device')!=='mobile') return;
              const t0=e.touches[0];
              if(t0) tipShow({clientX:t0.clientX,clientY:t0.clientY},charTipHTML(ch,miss));
              clearTimeout(chip._tipT);
              chip._tipT=setTimeout(tipHide,2600);
            },{passive:true});
            if(miss.length){
              chip.classList.add('lack');
              chip.addEventListener('click',()=>{ alert('先补全这个角色的'+miss.join('和')+'，补全后再添加'); });
            }else{
              chip.addEventListener('click',()=>{
                // 已经是高亮选中的那个：再点一下就收起面板，标签留在角色位旁边
                if(on){ selOpen=null; buildSelect(); return; }
                // 同队不允许重复上场同一名角色（鱼鱼号、红球、无角色除外）
                const dup=(key!=='deepfish' && key!=='red' && key!=='none') && picks[t].some((k,i)=>i!==s && k===key);
                if(dup){ alert('同一队伍里不能重复选择'+ch.name); return; }
                picks[t][s]=key;
                window.__voiceWarmChar&&window.__voiceWarmChar(key);   // 选到谁就立刻预热谁的语音
                selOpen=null;   // 选完就折叠，标签显示在角色位旁边
                buildSelect();
              });
            }
            chips.appendChild(chip);
          }
        }
        slot.appendChild(chips);
      }
      col.appendChild(slot);
    }
    wrap.appendChild(col);
  }
  document.querySelectorAll('#modeRow .modebtn').forEach(btn=>{
    if(btn.dataset.field) btn.classList.toggle('sel', btn.dataset.field===fieldKey);
    if(btn.dataset.teams) btn.classList.toggle('sel', Number(btn.dataset.teams)===teamCount);
    if(btn.dataset.per) btn.classList.toggle('sel', Number(btn.dataset.per)===perTeam);
  });
  if(window.__sbLayout) window.__sbLayout();
  selScrollRestore();
}

const speedBar=document.getElementById('speedBar');

speedBar.querySelectorAll('.spd').forEach(btn=>{
  btn.addEventListener('click',()=>{

let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  // 跳过战斗期间一律不触发角色语音
  window.__skipQuiet = !!(skipMode && state==='fight' && !over);
  if(skipMode && state==='fight' && !over){
    // 【立即跳过】：每帧快进约30倍战斗时间，直接推演到分出胜负
    const el=now-(skipStartT||now);
    const left=Math.max(0,SKIP_FORCE_MS-el);
    skipBtn.textContent='跳过中… '+(left/1000).toFixed(1)+'s';
    if(el>=SKIP_FORCE_MS){
      // 10 秒还没打完：强制结束，按剩余总血量判胜
      forceEndFight();
      skipMode=false;
      addText(W/2,H/2-60,'跳过超时 · 强制结束','#ffb066');
      burst(W/2,H/2,'#ffb066',24);
    }else{
      for(let i=0;i<30 && !over && state==='fight';i++) step(1/60);
    }
    particles=skipMode?[]:particles; texts=skipMode?[]:texts;
  }else{
    // 倍速：把本帧时间放大后拆成小步推进，避免高速下互相穿透
    let total=dt*gameSpeed;
    while(total>0 && state==='fight' && !over){
      const s=Math.min(total,1/60);
      step(s);
      total-=s;
    }
    dt*=gameSpeed;
  }

  for(const p of particles){
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.96; p.vy*=0.96;
    p.life-=dt*1.6;
  }
  particles=particles.filter(p=>p.life>0);
  updateHeals(dt);
  updateHits(dt);
  updateTriBursts(dt);
  for(const t of texts){ t.y+=t.vy*dt; t.vy*=0.94; t.life-=dt*0.85; }
  texts=texts.filter(t=>t.life>0);

  if(state==='fight' && over && !over.__scored){
    over.__scored=true;
    if(window.__rlScore) window.__rlScore(over.winner);
    if(window.__rlOverTip) window.__rlOverTip();
  }
  if(state==='fight'){ draw(); hud(); }
  const canSkip = state==='fight' && !over;
  skipBtn.style.display = canSkip?'block':'none';
  speedBar.style.display = canSkip?'flex':'none';
  if(!canSkip){
    skipMode=false; skipStartT=0; skipBtn.textContent='立即跳过';
    gameSpeed=1;
    speedBar.querySelectorAll('.spd').forEach(x=>x.classList.toggle('sel',Number(x.dataset.spd)===1));
  }
  requestAnimationFrame(loop);
}

/* ================= 小球对决 · 正式版 =================
   默认进「自选模式」= 官方版原来的选角界面。
   选角界面右上角有「随机模式」按钮 → 切到随机配置界面；
   配置界面有「自选模式」按钮 → 切回选角界面。没有中间的模式选择页。
   随机模式流程：配置 → 选人动画（iframe）→ 对决
   ==================================================== */
(function(){
  var $=function(id){ return document.getElementById(id); };
  var html=document.documentElement;

  var rlMode='custom';       // 当前模式：custom（默认）/ random
  var rlN=2;                 // 随机模式：每队人数
  var rlTeams=2;             // 随机模式：队伍数 2 / 3 / 4
  var rlScored=true;         // 本局是否积分
  var rlAnimating=false, rlAnimTimer=0;
  var rlPairs=[], rlRound=0, rlGot=[];   // 分轮抽签：每轮抽两支队伍

  var FIELD_LABEL={small:'小场',mid:'中场',large:'大场',portrait:'竖屏（正方形）'};
  var FIELD_ORDER=['small','mid','large','portrait'];

  function show(el){ if(el) el.classList.remove('hide'); }
  function hide(el){ if(el) el.classList.add('hide'); }
  function isHidden(el){ return !el || el.classList.contains('hide'); }

  /* ---------------- 场地 ---------------- */
  function setField(k){
    fieldKey=k;
    html.setAttribute('data-field',k);
    if(k==='portrait') setCanvasSize(820,820);
    else setCanvasSize(1280,800);
    applyField();
    try{ fitWrap(); }catch(e){}
  }
  window.__rlField=setField;

  /* ---------------- 角色池 ---------------- */
  function poolKeys(){
    // 随机模式不抽「鱼鱼号」「红球」这两个测试角色（自选模式里仍然能选）
    var out=[], skip={yuyu:1, red:1};
    for(var k in CHARS){
      var c=CHARS[k];
      if(c && !c.hidden && !c.empty && k!=='none' && !skip[k]) out.push(k);
    }
    return out;
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }
  function drawKeys(n,used){
    var pool=poolKeys().filter(function(k){ return !used[k]; });
    shuffle(pool);
    var out=[];
    for(var i=0;i<pool.length && out.length<n;i++){ used[pool[i]]=1; out.push(pool[i]); }
    return out;
  }

  /* ---------------- 积分 ---------------- */
  var RK_KEY='ball1999.rank.v1';
  var RK=null;
  function rank(){
    if(RK) return RK;
    try{ RK=JSON.parse(localStorage.getItem(RK_KEY)||'{}')||{}; }catch(e){ RK={}; }
    return RK;
  }
  function saveRank(){ try{ localStorage.setItem(RK_KEY,JSON.stringify(rank())); }catch(e){} }

  // 记分，同时把每个人的增减整理成明细返回（结算面板要用）
  function recordScore(winner){
    if(!rlScored) return null;
    var r=rank(), touched=false, rows=[];
    for(var t=0;t<teamCount;t++){
      var ks=(picks[t]||[]).filter(function(k){ return k && k!=='none' && CHARS[k]; });
      if(!ks.length) continue;
      var win=(winner===t), draw=(winner<0);
      for(var i=0;i<ks.length;i++){
        var o=r[ks[i]]||(r[ks[i]]={p:0,w:0,l:0,d:0,pts:0});
        var d=0;
        o.p=(o.p|0)+1;
        if(draw){ o.d=(o.d|0)+1; o.pts=(o.pts|0)+1; d=1; }
        else if(win){ o.w=(o.w|0)+1; o.pts=(o.pts|0)+3; d=3; }
        else { o.l=(o.l|0)+1; }
        rows.push({name:CHARS[ks[i]].name, color:CHARS[ks[i]].color||teamColor(t),
          team:t, win:win, draw:draw, delta:d, total:o.pts|0});
        touched=true;
      }
    }
    if(touched) saveRank();
    if(rows.length) queueScore(rows,winner);
    return rows;
  }
  window.__rlScore=recordScore;

  // 官方版是在主循环里检测「打完了」再记分的，但 rAF 会被浏览器节流
  // （切到后台标签页、省电模式、部分内嵌浏览器），那样结算就迟迟不触发。
  // 这里用定时器补一刀，靠 over.__scored 去重，两边谁先跑都不会记两次。
  setInterval(function(){
    if(state!=='fight' || !over || over.__scored) return;
    over.__scored=true;
    if(window.__rlScore) window.__rlScore(over.winner);
    if(window.__rlOverTip) window.__rlOverTip();
  },200);

  /* ---------------- 结算面板 ---------------- */
  var scoreTimer=0, scoreSeq=0;

  // 关掉结算面板，并让还没弹出来的那一次作废
  function hideScore(){
    scoreSeq++;
    if(scoreTimer){ clearTimeout(scoreTimer); scoreTimer=0; }
    hide($('scoreBox'));
  }
  window.__rlHideScore=hideScore;

  // 隔 0.9 秒再弹：先让玩家看清是谁把谁撞死的
  function queueScore(rows,winner){
    hideScore();
    var seq=scoreSeq;
    scoreTimer=setTimeout(function(){
      scoreTimer=0;
      if(seq!==scoreSeq) return;              // 这期间已经回入口 / 又开了一局
      if(state!=='fight' || !over) return;
      showScore(rows,winner);
    },900);
  }

  function showScore(rows,winner){
    var list=$('scoreList');
    if(!list) return;
    var sub=$('scoreSub');
    if(sub){
      if(winner<0) sub.textContent='平局 · 所有出场角色 +1';
      else{
        var n=0;
        for(var i=0;i<rows.length;i++) if(rows[i].win) n++;
        sub.textContent='队伍'+(winner+1)+' 获胜 · 胜方 '+n+' 人各 +3，败方只记出场';
      }
    }
    list.innerHTML='';
    rows.forEach(function(x,i){
      var row=document.createElement('div');
      row.className='rlSRow out '+(x.draw?'draw':(x.win?'win':'lose'));

      var cd=document.createElement('span'); cd.className='cd'; cd.style.background=x.color;
      var nm=document.createElement('span'); nm.className='nm'; nm.textContent=x.name;
      var tg=document.createElement('span'); tg.className='tg';
      tg.textContent='队伍'+(x.team+1)+(x.draw?' · 平':(x.win?' · 胜':' · 负'));
      var tt=document.createElement('span'); tt.className='tt'; tt.textContent='总 '+x.total;
      var dl=document.createElement('span'); dl.className='dl'; dl.textContent='+0';

      row.appendChild(cd); row.appendChild(nm); row.appendChild(tg);
      row.appendChild(tt); row.appendChild(dl);
      list.appendChild(row);

      // 逐行滑入：摘掉 .out，让 CSS 过渡接管。定时器一定会跑，
      // 就算过渡没生效，元素也停在「可见」的最终态，不会整张表看不见。
      setTimeout(function(){ row.classList.remove('out'); }, i*65);

      // 数字从 0 滚到实际增减。用定时器而不是 rAF：无头浏览器里 rAF 不产帧
      var k=0, N=8;
      var iv=setInterval(function(){
        k++;
        if(k>=N){ clearInterval(iv); dl.textContent='+'+x.delta; return; }
        dl.textContent='+'+(Math.round(x.delta*k/N)||0);
      },65);
    });
    show($('scoreBox'));
  }

  function renderRank(){
    RK=null;                 // 每次都从存储重读，别的标签页改了也能看到
    var r=rank();
    var rows=[];
    for(var k in r){
      if(!CHARS[k]) continue;
      var o=r[k];
      rows.push({name:CHARS[k].name, color:CHARS[k].color||'#5ad2ff',
        p:o.p|0, w:o.w|0, l:o.l|0, d:o.d|0, pts:o.pts|0});
    }
    rows.sort(function(a,b){
      return (b.pts-a.pts)||(b.w-a.w)||(b.p-a.p)||a.name.localeCompare(b.name,'zh');
    });
    var tb=$('rankTable');
    if(!tb) return;
    if(!rows.length){
      tb.innerHTML='<tr><td class="empty">还没有记录。<br>在配置里选「计入积分」，打完一局就会记到这里。</td></tr>';
      return;
    }
    var h='<tr><th>#</th><th>角色</th><th>出场</th><th>胜</th><th>负</th><th>积分</th></tr>';
    for(var i=0;i<rows.length;i++){
      var x=rows[i];
      h+='<tr'+(i<3?' class="top"':'')+'>'
        +'<td class="rk">'+(i+1)+'</td>'
        +'<td class="nm"><span class="cd" style="background:'+x.color+'"></span>'+x.name+'</td>'
        +'<td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td class="pt">'+x.pts+'</td></tr>';
    }
    tb.innerHTML=h;
  }

  /* ---------------- 配置界面 ---------------- */
  function chip(label,on,fn){
    var b=document.createElement('button');
    b.type='button';
    b.className='rlChip'+(on?' sel':'');
    b.textContent=label;
    b.addEventListener('click',fn);
    return b;
  }
  function renderCfg(){
    var tm=$('cfgTeams');
    if(tm){
      tm.innerHTML='';
      [2,3,4].forEach(function(n){
        tm.appendChild(chip(n+' 队', rlTeams===n, function(){ rlTeams=n; renderCfg(); }));
      });
    }
    var c=$('cfgCount');
    if(c){
      c.innerHTML='';
      for(var n=1;n<=5;n++)(function(n){
        c.appendChild(chip(n+' 人', rlN===n, function(){ rlN=n; renderCfg(); }));
      })(n);
    }
    var f=$('cfgField');
    if(f){
      f.innerHTML='';
      FIELD_ORDER.forEach(function(k){
        f.appendChild(chip(FIELD_LABEL[k], fieldKey===k, function(){ setField(k); renderCfg(); }));
      });
    }
    var s=$('cfgScore');
    if(s){
      s.innerHTML='';
      s.appendChild(chip('计入积分', rlScored, function(){ rlScored=true; renderCfg(); }));
      s.appendChild(chip('不计积分', !rlScored, function(){ rlScored=false; renderCfg(); }));
    }
    var hint=$('cfgHint');
    if(hint){
      var total=rlN*rlTeams, rounds=Math.ceil(rlTeams/2);
      hint.textContent=rlTeams+' 队 · 每队 '+rlN+' 人 · 从 '+poolKeys().length
        +' 名角色里随机抽出 '+total+' 个，各队不重复'
        +(rounds>1?' · 分 '+rounds+' 轮抽签':'');
    }
  }

  /* ---------------- 随机 → 选人动画 → 对决 ---------------- */
  function resetIdle(){
    state='select';
    balls=[]; stories=[]; rices=[]; over=null;
    var h=$('hud'); if(h) h.innerHTML='';
    var tp=$('tip'); if(tp) tp.style.display='none';
    try{ tipHide(); }catch(e){}
  }

  function validKey(k){ return !!(k && CHARS[k] && !CHARS[k].empty && !CHARS[k].hidden); }

  function teamColor(i){
    return (typeof TEAMS!=='undefined' && TEAMS[i] && TEAMS[i].color) ? TEAMS[i].color : '#5ad2ff';
  }

  // lists = [[key,...], ...]，每队一个数组（长度 = 队伍数）；缺的用角色池补满
  function beginFight(lists){
    var n=(lists&&lists.length)||rlTeams, i, j;
    teamCount=n; perTeam=rlN;
    var used={}, out=[];
    for(i=0;i<n;i++){
      var arr=(lists[i]||[]).filter(validKey).slice(0,rlN);
      arr=arr.filter(function(k){
        if(used[k]) return false;
        used[k]=1; return true;
      });
      out.push(arr);
    }
    for(j=0;j<n;j++){
      if(out[j].length<rlN) out[j]=out[j].concat(drawKeys(rlN-out[j].length,used));
    }
    picks=out;
    try{ startFight(); }catch(e){ console.error(e); }
  }

  function cancelAnim(){
    rlAnimating=false;
    rlPairs=[]; rlRound=0; rlGot=[];
    clearTimeout(rlAnimTimer); rlAnimTimer=0;
    var f=$('animFrame');
    // 单文件版用 srcdoc 加载动画，src 设成 about:blank 盖不掉 srcdoc，得先删掉
    if(f){ f.classList.remove('on'); try{ f.removeAttribute('srcdoc'); f.src='about:blank'; }catch(e){} }
  }

  // 已经抽到的队伍保留，没抽到的从角色池补满 —— 动画不回话时走这条
  function fallbackStart(){
    if(!rlAnimating) return;
    finishRandom();
  }

  // 跑一轮抽签（一轮最多两支队伍）
  function runRound(){
    var f=$('animFrame'), pr=rlPairs[rlRound];
    if(!f || !pr){ finishRandom(); return; }
    var a=pr[0], b=(pr.length>1?pr[1]:-1);
    rlAnimating=true;
    f.classList.add('on');
    // 单边轮（3 队时的最后一轮）：n2=0，动画只出一列并居中
    var qs='embed=1&auto=1&n1='+rlN+'&n2='+(b>=0?rlN:0)
        +'&c1='+encodeURIComponent(teamColor(a))
        +'&c2='+encodeURIComponent(teamColor(b>=0?b:a));
    if(window.__SEL_TEMPLATE){
      // 单文件版：整个选人动画内嵌在 __SEL_TEMPLATE 里，用 srcdoc 加载。
      // srcdoc 的地址是 about:srcdoc，带不了查询串，所以参数塞进模板里的 __SEL_CFG__ 占位符，
      // 由 select.js 从 window.__SEL_URL 读回来（解析逻辑完全不变）。
      try{ f.removeAttribute('src'); f.srcdoc=window.__SEL_TEMPLATE.replace('__SEL_CFG__',qs); }catch(e){}
    }else{
      f.src='选人动画.html?'+qs;
    }
    clearTimeout(rlAnimTimer);
    rlAnimTimer=setTimeout(fallbackStart,32000);   // 这一轮没回话就直接本地随机
  }

  function startRandom(){
    resetIdle();
    hide($('cfgPick'));
    hide($('rankBox'));
    hideScore();
    // 队伍两两分组：2 队 → [[0,1]]；3 队 → [[0,1],[2]]；4 队 → [[0,1],[2,3]]
    rlPairs=[];
    for(var i=0;i<rlTeams;i+=2){
      rlPairs.push(i+1<rlTeams ? [i,i+1] : [i]);
    }
    rlRound=0; rlGot=[];
    if(!$('animFrame')){ beginFight([]); return; }
    runRound();
  }

  function finishRandom(){
    var f=$('animFrame'), i, r;
    var lists=[];
    for(i=0;i<rlTeams;i++) lists.push([]);
    for(r=0;r<rlPairs.length;r++){
      var pr=rlPairs[r], got=rlGot[r]||[[],[]];
      lists[pr[0]]=got[0]||[];
      if(pr.length>1) lists[pr[1]]=got[1]||[];
    }
    rlAnimating=false;
    clearTimeout(rlAnimTimer); rlAnimTimer=0;
    if(f) f.classList.remove('on');
    beginFight(lists);
    setTimeout(function(){ try{ if(f) f.src='about:blank'; }catch(err){} },400);
  }

  window.addEventListener('message',function(e){
    var d=e.data;
    if(!d || d.__selAnim!==1 || d.type!=='done') return;
    if(!rlAnimating) return;
    clearTimeout(rlAnimTimer); rlAnimTimer=0;
    rlGot[rlRound]=[d.p1||[], d.p2||[]];
    rlRound++;
    if(rlRound<rlPairs.length){ runRound(); return; }   // 还有下一轮
    finishRandom();
  });

  /* ---------------- 流程切换 ---------------- */
  // 自选模式记住自己的队伍数：随机模式固定 2 队，不能把它冲掉
  var customTeams=2;

  // 把 #modeRow 上的场地 / 阵营高亮同步成当前状态
  // （随机模式里改过场地或队伍数，切回来不能还是旧的高亮）
  function syncModeRow(){
    var row=$('modeRow');
    if(!row) return;
    var fs=row.querySelectorAll('[data-field]');
    for(var i=0;i<fs.length;i++) fs[i].classList.toggle('sel', fs[i].getAttribute('data-field')===fieldKey);
    var ts=row.querySelectorAll('[data-teams]');
    for(var j=0;j<ts.length;j++) ts[j].classList.toggle('sel', +ts[j].getAttribute('data-teams')===teamCount);
  }

  // 自选模式：官方版原来的选角界面
  function showCustom(){
    rlMode='custom';
    cancelAnim();
    hide($('rankBox')); hide($('cfgPick'));
    hideScore();
    teamCount=customTeams;     // 恢复自选模式的队伍数
    perTeam=5;                 // 自选模式每队固定 5 个位置
    resetIdle();
    show($('select'));
    try{ buildSelect(); }catch(e){}
    syncModeRow();
    try{ fitWrap(); }catch(e){}
  }

  // 随机模式：配置界面
  function showRandom(){
    if(rlMode==='custom') customTeams=teamCount;   // 记下自选模式选的是几队
    rlMode='random';
    cancelAnim();
    hide($('rankBox')); hide($('select'));
    hideScore();
    resetIdle();
    renderCfg();
    show($('cfgPick'));
    try{ fitWrap(); }catch(e){}
  }

  // 回到「当前模式」的入口界面
  function backToEntry(){
    if(rlMode==='random') showRandom();
    else showCustom();
  }

  // 一局结束后点画面：回到当前模式的入口界面
  window.__rlRestart=function(){
    if(state!=='fight') return false;
    try{ keepAwake(false); }catch(e){}
    backToEntry();
    return true;
  };

  // 分出胜负后把底部提示换成「回入口」，否则和点击行为对不上
  window.__rlOverTip=function(){
    var tp=document.getElementById('tip');
    if(!tp) return;
    tp.textContent = (rlMode==='random')
      ? '点一下画面回到配置界面 · 小球只会被撞着走'
      : '点一下画面回到选角界面 · 小球只会被撞着走';
  };

  /* ---------------- 选角界面上的模式切换按钮 ---------------- */
  function injectSwitch(){
    var row=$('modeRow');
    if(!row || $('rlRandomBtn')) return;

    var rank=document.createElement('button');
    rank.type='button'; rank.id='rlRankBtn'; rank.className='rlSwitch ghost';
    rank.textContent='排行榜';
    rank.addEventListener('click',function(){ renderRank(); show($('rankBox')); });

    var lb=document.createElement('span');
    lb.className='lbl'; lb.textContent='模式';

    var rnd=document.createElement('button');
    rnd.type='button'; rnd.id='rlRandomBtn'; rnd.className='rlSwitch';
    rnd.textContent='随机模式 ▶';
    rnd.title='切换到随机模式：先配置人数 / 场地 / 积分，再抽签';
    rnd.addEventListener('click',function(){ showRandom(); });

    row.appendChild(rank);
    row.appendChild(lb);
    row.appendChild(rnd);
  }

  /* ---------------- 事件绑定 ---------------- */
  var cr=$('cfgRank'); if(cr) cr.addEventListener('click',function(){ renderRank(); show($('rankBox')); });
  var rc=$('rankClose'); if(rc) rc.addEventListener('click',function(){ hide($('rankBox')); });
  var rr=$('rankReset');
  if(rr) rr.addEventListener('click',function(){
    if(!window.confirm('清空所有积分记录？这个操作不能撤销。')) return;
    RK={}; saveRank(); renderRank();
  });
  // 配置界面的「自选模式」→ 回到选角界面
  var cb=$('cfgBack'); if(cb) cb.addEventListener('click',showCustom);
  var cg=$('cfgGo'); if(cg) cg.addEventListener('click',startRandom);
  // 结算面板：排行榜 / 知道了 / 点背景关掉
  var sr=$('scoreRank');
  if(sr) sr.addEventListener('click',function(){ renderRank(); show($('rankBox')); });
  var sc=$('scoreClose');
  if(sc) sc.addEventListener('click',hideScore);
  var sb=$('scoreBox');
  if(sb) sb.addEventListener('click',function(e){ if(e.target===sb) hideScore(); });

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(!isHidden($('rankBox'))){ hide($('rankBox')); return; }
    if(!isHidden($('scoreBox'))){ hideScore(); return; }
    if(rlAnimating){ cancelAnim(); showRandom(); return; }
    if(state!=='fight' || !over) return;     // 入口界面 / 战斗中都按 Esc 不做事
    backToEntry();
  });

  /* ---------------- 启动 ---------------- */
  setField(fieldKey);
  renderCfg();
  renderRank();
  injectSwitch();          // 选角界面上挂「排行榜 / 随机模式」
  rlMode='custom';         // 默认自选模式（#select 本身就没有 hide）
  customTeams=teamCount;   // 记住自选模式的默认队伍数
  syncModeRow();
})();

</script>
<script>
/* ---- 移动端触摸滚动：完全接管手势，1:1 跟随手指，不再让原生滚动插手 ---- */
(function mobileScrollFix(){
  const teams=document.getElementById('teams');
  const rules=document.getElementById('rules');
  function isMobile(){ return document.documentElement.getAttribute('data-device')==='mobile'; }
  // 竖着拿手机时整页被 rotate(90deg) 转成横版，手指方向与内容方向要重新映射
  function rotated(){ return window.innerHeight>window.innerWidth; }
  let sx=0,sy=0,baseTeams=0,baseEl=0,box=null,axis=null;
  function pick(e){
    const t=e.target;
    if(!t||!t.closest) return null;
    if(t.closest('#rules')) return rules;
    const col=t.closest('.teamcol');
    if(col) return col;
    if(t.closest('#teams')) return teams;
    return null;
  }
  function onStart(e){
    if(!isMobile()||e.touches.length!==1){ box=null; return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    box=pick(e); axis=null;
    baseTeams=teams?teams.scrollLeft:0;
    baseEl=box?box.scrollTop:0;
  }
  function onMove(e){
    if(!isMobile()||!box||e.touches.length!==1) return;
    const t=e.touches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    const r=rotated();
    // 旋转后：屏幕上下 = 内容的左右；屏幕左右 = 内容的上下
    const hMove = r?-dy:-dx, vMove = r?dx:dy;
    if(!axis){
      if(Math.abs(hMove)<5 && Math.abs(vMove)<5) return;
      const onTeams=!!(box===teams||(teams&&box.contains&&!box.classList.contains('teamcol')));
      axis = (onTeams && Math.abs(hMove)>=Math.abs(vMove))?'h':'v';
      if(!onTeams && Math.abs(vMove)<Math.abs(hMove)) axis='h';
    }
    if(e.cancelable) e.preventDefault();
    if(axis==='h' && teams){
      teams.scrollLeft = baseTeams + hMove;
    }else{
      box.scrollTop = baseEl + vMove;
    }
    if(window.__sbLayout) window.__sbLayout();
  }
  function onEnd(){ box=null; axis=null; }
  [rules,teams].forEach(node=>{
    if(!node) return;
    node.addEventListener('touchstart',onStart,{passive:true});
    node.addEventListener('touchmove',onMove,{passive:false});
    node.addEventListener('touchend',onEnd,{passive:true});
    node.addEventListener('touchcancel',onEnd,{passive:true});
  });
})();
</script>
<script>
/* ---- 比例滚动条：滑块长度 = 可见部分占整体的比例，拖动时按同一比例换算 ---- */
(function proportionalScrollBars(){
  const bars=new Map();
  function isMobile(){ return document.documentElement.getAttribute('data-device')==='mobile'; }
  function rotated(){ return isMobile() && window.innerHeight>window.innerWidth; }
  function targets(){
    const out=[];
    const rulesEl=document.getElementById('rules');
    if(rulesEl) out.push([rulesEl,'y']);
    const teamsEl=document.getElementById('teams');
    if(teamsEl) out.push([teamsEl,'x']);
    document.querySelectorAll('#teams .teamcol').forEach(c=>out.push([c,'y']));
    return out;
  }
  function ensure(el,axis){
    let b=bars.get(el);
    if(b && b.axis===axis) return b;
    if(b) b.track.remove();
    const track=document.createElement('div');
    track.className='sbTrack '+(axis==='y'?'v':'h');
    const thumb=document.createElement('div');
    thumb.className='sbThumb';
    track.appendChild(thumb);
    document.body.appendChild(track);
    b={track,thumb,axis};
    bars.set(el,b);
    bindDrag(el,b);
    return b;
  }
  function bindDrag(el,b){
    let sx=0,sy=0,startPos=0,drag=false;
    b.thumb.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      drag=true; sx=e.clientX; sy=e.clientY;
      startPos = b.axis==='y' ? el.scrollTop : el.scrollLeft;
      try{ b.thumb.setPointerCapture(e.pointerId); }catch(_){}
    });
    b.thumb.addEventListener('pointermove',e=>{
      if(!drag) return;
      let dx=e.clientX-sx, dy=e.clientY-sy, d;
      // 竖屏整页转过90°时，屏幕坐标和界面方向是错位的
      if(rotated()){ d = b.axis==='y' ? -dx : dy; }
      else{ d = b.axis==='y' ? dy : dx; }
      const view = b.axis==='y'? el.clientHeight : el.clientWidth;
      const total = b.axis==='y'? el.scrollHeight : el.scrollWidth;
      const thLen = b.axis==='y'? b.thumb.offsetHeight : b.thumb.offsetWidth;
      const trLen = b.axis==='y'? b.track.offsetHeight : b.track.offsetWidth;
      const room = Math.max(1, trLen-thLen);
      const pos = startPos + d*((total-view)/room);
      if(b.axis==='y') el.scrollTop=pos; else el.scrollLeft=pos;
      layout();
    });
    const stop=()=>{ drag=false; };
    b.thumb.addEventListener('pointerup',stop);
    b.thumb.addEventListener('pointercancel',stop);
  }
  function layout(){
    // 电脑端完全不用这套滑动条，浏览器自己的滚动条就够了
    if(!isMobile()){ for(const [,b] of bars) b.track.style.display='none'; return; }
    if(rotated()){ for(const [,b] of bars) b.track.style.display='none'; return; }
    const live=new Set();
    for(const [el,axis] of targets()){
      live.add(el);
      const view = axis==='y'? el.clientHeight : el.clientWidth;
      const total = axis==='y'? el.scrollHeight : el.scrollWidth;
      const pos = axis==='y'? el.scrollTop : el.scrollLeft;
      const b=ensure(el,axis);
      if(total<=view+2 || view<24){ b.track.style.display='none'; continue; }
      const r=el.getBoundingClientRect();
      if(r.width<24 || r.height<24 || r.bottom<0 || r.top>window.innerHeight){ b.track.style.display='none'; continue; }
      b.track.style.display='block';
      const ratio=Math.max(0.08, view/total);
      const maxPos=Math.max(1,total-view);
      if(axis==='y'){
        const trackLen=r.height-6;
        const thLen=Math.max(18,trackLen*ratio);
        b.track.style.left=(r.right-9)+'px';
        b.track.style.top=(r.top+3)+'px';
        b.track.style.width='6px';
        b.track.style.height=trackLen+'px';
        b.thumb.style.height=thLen+'px';
        b.thumb.style.top=((pos/maxPos)*(trackLen-thLen))+'px';
      }else{
        const trackLen=r.width-6;
        const thLen=Math.max(26,trackLen*ratio);
        b.track.style.top=(r.bottom-9)+'px';
        b.track.style.left=(r.left+3)+'px';
        b.track.style.height='6px';
        b.track.style.width=trackLen+'px';
        b.thumb.style.width=thLen+'px';
        b.thumb.style.left=((pos/maxPos)*(trackLen-thLen))+'px';
      }
    }
    for(const [el,b] of bars){ if(!live.has(el)||!el.isConnected){ b.track.remove(); bars.delete(el); } }
  }
  window.__sbLayout=layout;
  window.addEventListener('resize',()=>requestAnimationFrame(layout));
  window.addEventListener('scroll',()=>requestAnimationFrame(layout),true);
  setInterval(()=>{ if(typeof state==='undefined'||state==='select') layout(); },420);
})();
</script>
<script>
/* ---- 屏蔽长按菜单与右键菜单，避免打断游戏操作 ---- */
document.addEventListener('contextmenu',e=>{ e.preventDefault(); },false);
document.addEventListener('selectstart',e=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
  e.preventDefault();
},false);
document.addEventListener('dragstart',e=>{ e.preventDefault(); },false);

/* ===== 单文件版：选人动画整页内联在这里，runRound() 用 srcdoc 加载 ===== */

 0 34px -6px var(--pc)}\n  .cell.picked .nm{color:#fff}\n\n  /* 小球 */\n  .ball,.st-ball{position:relative;border-radius:50%;flex:0 0 auto;\n    box-shadow:inset 0 0 0 2px rgba(255,255,255,.10),0 10px 26px rgba(0,0,0,.55);\n    display:flex;align-items:center;justify-content:center;\n    font-weight:800;color:rgba(255,255,255,.94);\n    text-shadow:0 2px 10px rgba(0,0,0,.55);letter-spacing:1px;\n    background-size:cover;background-position:center}\n  .ball.hasimg,.st-ball.hasimg{\n    box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 10px 26px rgba(0,0,0,.55)}\n\n  /* ================= 滚动选框 ================= */\n  #frames,#p1col,#p2col,#flyLayer{position:absolute;inset:0;pointer-events:none}\n\n  .frame{position:absolute;left:0;top:0;border-radius:14px;pointer-events:none;\n    border:2px solid var(--c);opacity:0;\n    box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 28px -4px var(--c),\n               inset 0 0 34px -12px var(--c)}\n  .frame .cn{position:absolute;width:14px;height:14px;border:2px solid var(--c)}\n  .frame .c1{left:-3px;top:-3px;border-right:0;border-bottom:0;border-top-left-radius:5px}\n  .frame .c2{right:-3px;top:-3px;border-left:0;border-bottom:0;border-top-right-radius:5px}\n  .frame .c3{left:-3px;bottom:-3px;border-right:0;border-top:0;border-bottom-left-radius:5px}\n  .frame .c4{right:-3px;bottom:-3px;border-left:0;border-top:0;border-bottom-right-radius:5px}\n\n  /* ================= 两侧卡片 ================= */\n  .pickcard{position:absolute;border-radius:16px;overflow:hidden;opacity:0;\n    background:linear-gradient(180deg,rgba(17,26,36,.96),rgba(9,14,19,.98));\n    border:1px solid #1b2634;display:flex;flex-direction:column;align-items:center;\n    justify-content:center;padding:34px 12px 16px}\n  .pickcard .lbl{position:absolute;left:0;right:0;top:0;height:34px;\n    display:flex;align-items:center;justify-content:center;\n    font-family:Consolas,ui-monospace,monospace;font-size:13px;font-weight:700;\n    letter-spacing:4px;color:#080b0f;backgrou ar-gradient(180deg,#ffffff,#8fb6d0);\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n    filter:drop-shadow(0 0 26px rgba(90,210,255,.45));\n    pointer-events:none}\n  #vsRule{position:absolute;left:50%;top:50%;height:1px;width:0;opacity:0;\n    transform:translate(-50%,-50%);\n    background:linear-gradient(90deg,transparent,#5ad2ff,transparent);pointer-events:none}\n\n  /* ================= 底部 ================= */\n  #ft{position:absolute;left:0;right:0;bottom:32px;text-align:center;\n    font-family:Consolas,ui-monospace,monospace;font-size:13px;letter-spacing:2px;\n    color:#44515f;transition:opacity .3s}\n  #ft b{color:#7d8b9c;font-weight:600}\n  #ft.hide{opacity:0}\n  #corner{position:absolute;right:40px;bottom:30px;font-family:Consolas,monospace;\n    font-size:12px;letter-spacing:2px;color:#26313d}\n\n  /* 被游戏页面嵌入时：收掉录屏用的快捷键提示 */\n  body.embed #ft,body.embed #corner{display:none}\n\n  /* ================= 选人配置界面 ================= */\n  #setup{position:absolute;inset:0;z-index:50;display:none;padding:52px 72px 36px;\n    background:radial-gradient(circle at 50% 38%,rgba(12,18,26,.975),rgba(6,9,13,.995))}\n  #setup.on{display:block}\n  .st-wrap{width:100%;height:100%;display:flex;flex-direction:column;\n    gap:20px;justify-content:center}\n\n  .st-head{display:flex;align-items:baseline;gap:20px;flex:0 0 auto}\n  .st-head b{font-size:28px;font-weight:800;letter-spacing:5px;\n    background:linear-gradient(180deg,#eaf7ff,#9dc0d8);\n    -webkit-background-clip:text;background-clip:text;color:transparent}\n  .st-head span{font-size:13px;letter-spacing:2px;color:#5f7186}\n\n  .st-teams{display:flex;justify-content:space-between;gap:36px;flex:0 0 auto;\n    align-items:flex-start}\n  .st-team{flex:0 0 auto;min-width:300px;display:flex;flex-direction:column;gap:14px;\n    border:1px solid #1b2634;border-radius:16px;padding:16px 20px 20px;\n    background:linear-gradient(180deg,rgba(17,26,36,.72),rgba(9,14,19,.5))}\n  .st-teamhead{display:flex;align-items:center;gap:18px}\n  .tname{font-family:Consolas,ui-monospace,monospace;font-size:22px;font-weight:800;\n    letter-spacing:3px;color:var(--c)}\n  .tcnt{display:flex;align-items:center;gap:8px;margin-left:auto;\n    font-family:Consolas,ui-monospace,monospace;font-size:13px;letter-spacing:2px;color:#5f7186}\n  .cbtn{width:38px;height:32px;border-radius:8px;border:1px solid #24303e;\n    background:#0d141c;color:#8fa3b8;font-family:Consolas,ui-monospace,monospace;\n    font-size:14px;font-weight:700;cursor:pointer;transition:.15s}\n  .cbtn:hover{border-color:#3a4d63;color:#cfdeeb}\n  .cbtn.on{background:var(--c);border-color:var(--c);color:#080b0f}\n\n  .st-slots{display:flex;gap:12px}\n  .st-slot{width:128px;height:166px;border-radius:12px;border:1px dashed #24303e;\n    background:rgba(13,20,28,.6);display:flex;flex-direction:column;\n    align-items:center;justify-content:center;gap:10px;cursor:pointer;\n    transition:.15s;overflow:hidden}\n  .st-slot:hover{border-color:var(--c);background:rgba(20,30,42,.85)}\n  .st-slot.filled{border-style:solid;border-color:var(--c);background:rgba(17,26,36,.92)}\n  .st-slot-name{font-size:13px;font-weight:700;color:#cfdeeb;text-align:center;\n    padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .st-empty{font-size:34px;color:#2a3a4c;line-height:1;font-weight:300}\n\n  .st-poolwrap{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}\n  .st-poollabel{flex:0 0 auto;font-family:Consolas,ui-monospace,monospace;\n    font-size:13px;letter-spacing:3px;color:#5f7186}\n  .st-pool{flex:0 1 auto;max-height:420px;min-height:0;overflow-y:auto;\n    display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;\n    gap:10px;padding:2px 8px 2px 2px}\n  .st-pool::-webkit-scrollbar{width:8px}\n  .st-pool::-webkit-scrollbar-thumb{background:#1e2a38;border-radius:4px}\n  .st-ch{width:106px;height:128px;border-radius:10px;border:1px solid #1a2532;\n    background:lin 'hasimg');\n    } else {\n      el.style.background = ballGradient(ch.color || '#4a9dff');\n      el.textContent = ch.short || initial(ch);\n      el.classList.remove('hasimg');\n    }\n  }\n\n  /* ---------------- 渲染 ---------------- */\n  function drawFrame(it, t) {\n    var el = it.frame;\n    if (t \u003C it.rollStart) { el.style.opacity = '0'; return; }\n\n    var i, sc = 1, op = 1;\n    if (t \u003C it.lockStart) {\n      i = idxAt(it.roll, t - it.rollStart);\n    } else {\n      var p = prog(t, it.lockStart, CFG.lockMs * 0.85);\n      if (p >= 1) { el.style.opacity = '0'; return; }\n      i = it.idx;\n      sc = 1 + 0.10 * Math.sin(p * Math.PI);\n      op = 1 - p;\n    }\n\n    var c = cells[i];\n    el.style.opacity = String(op);\n    el.style.width = (c.w + 6) + 'px';\n    el.style.height = (c.h + 6) + 'px';\n    el.style.transform =\n      'translate(' + (c.x - 3) + 'px,' + (c.y - 3) + 'px) scale(' + sc + ')';\n  }\n\n  function drawFly(it, t) {\n    var el = it.fly;\n    var fp = prog(t, A.pullStart, CFG.pullMs);\n    if (fp \u003C= 0 || fp >= 1) { el.style.opacity = '0'; return; }\n\n    var src = cells[it.idx];\n    var dst = sideCards[it.side][it.slot];\n    var e = easeInOutCubic(fp);\n    var rp = fp * fp * fp;                       // 半径压到最后才放大\n    var r = lerp(src.br, dst.br, rp);\n    var x = lerp(src.bx, dst.bx, e);\n    var y = lerp(src.by, dst.by, e) - Math.sin(e * Math.PI) * 72;\n\n    el.style.opacity = '1';\n    el.style.left = (x - r) + 'px';\n    el.style.top = (y - r) + 'px';\n    el.style.width = el.style.height = (r * 2) + 'px';\n    el.style.fontSize = Math.round(r * 2 * 0.40) + 'px';\n  }\n\n  function drawSide(t) {\n    [1, 2].forEach(function (side) {\n      sideCards[side].forEach(function (c, k) {\n        var p = prog(t, A.pullStart + k * 70, 320);\n        c.el.style.opacity = String(easeOutCubic(p));\n        c.ball.style.opacity = (t >= A.pullStart + CFG.pullMs) ? '1' : '0';\n      });\n    });\n  }\n\n  function render(t) {\ , '*');\n      } catch (err) {}\n    };\n  }\n\n  /* ?still= 定格 */\n  var still = Q.get('still');\n  if (still !== null && still !== '' && A) {\n    cancelAnimationFrame(raf);\n    running = false;\n    render(parseFloat(still));\n  }\n\n  window.__render = render;\n  window.__state = function () { return A; };\n\n})();\n\n\u003C/script>\n\u003Cscript>\n/* =====================================================================\n * picker.js — 选人配置界面\n * ---------------------------------------------------------------------\n * 在 select.js 之后加载。负责：\n *   - 每边选几个人（1~3）\n *   - 具体选哪几个角色\n *   - 点「开始播放」把配置交给 SelectionAnim.play()\n *\n * Tab / Esc 打开或关闭配置界面。\n * ===================================================================== */\n(function () {\n  'use strict';\n\n  var API = window.SelectionAnim;\n  if (!API) return;\n\n  var ROSTER = API.roster;\n  var MAX = 5;                       // 每边最多几人\n  var setup = document.getElementById('setup');\n\n  /* picks[side][slot] = key 或 '' */\n  var S = {\n    counts: [1, 1],\n    picks: [[''], ['']]\n  };\n\n  var elPool = null;\n  var elSlots = { 1: null, 2: null };\n\n  function byKey(k) {\n    for (var i = 0; i \u003C ROSTER.length; i++) if (ROSTER[i].key === k) return ROSTER[i];\n    return null;\n  }\n\n  function firstEmpty() {\n    for (var s = 0; s \u003C 2; s++) {\n      for (var k = 0; k \u003C S.counts[s]; k++) {\n        if (!S.picks[s][k]) return { s: s, k: k };\n      }\n    }\n    return null;\n  }\n\n  function usedMap() {\n    var u = {};\n    for (var s = 0; s \u003C 2; s++) {\n      S.picks[s].forEach(function (k) { if (k) u[k] = 1; });\n    }\n    return u;\n  }\n\n  /* ---------------- 构建 DOM ---------------- */\n  function build() {\n    setup.innerHTML = '';\n\n    var wrap = document.createElement('div');\n    wrap.className = 'st-wrap';\n\n    var head = document.createElement('div');\n    head.className = 'st-head';\n    head.innerHTML =\n      '\u003Cb>选人配置\u003C/b>' +\n      '\u003Cspan>点角色填入空位 · 再点一次取消 · Tab 关闭\u003C/span>';\n    wrap.appendChild(head);\n\n    var teams = document.createElement('div');\n    teams.className = 'st-teams';\n\n    [1, 2].forEach(function (side) {\n      var t = document.createElement('div');\n      t.className = 'st-team';\n      t.style.setProperty('--c', side === 1 ? '#ff4d5e' : '#5ad2ff');\n\n      var h = document.createElement('div');\n      h.className = 'st-teamhead';\n\n      var nm = document.createElement('span');\n      nm.className = 'tname';\n      nm.textContent = 'P' + side;\n      h.appendChild(nm);\n\n      var cnt = document.createElement('span');\n      cnt.className = 'tcnt';\n      cnt.appendChild(document.createTextNode('人数'));\n      for (var n = 1; n \u003C= MAX; n++) {\n        (function (side, n) {\n          var b = document.createElement('button');\n          b.type = 'button';\n          b.textContent = String(n);\n          b.className = 'cbtn' + (S.counts[side - 1] === n ? ' on' : '');\n          b.onclick = function () { setCount(side, n); };\n          cnt.appendChild(b);\n        })(side, n);\n      }\n      h.appendChild(cnt);\n      t.appendChild(h);\n\n      var slots = document.createElement('div');\n      slots.className = 'st-slots';\n      t.appendChild(slots);\n      elSlots[side] = slots;\n\n      teams.appendChild(t);\n    });\n    wrap.appendChild(teams);\n\n    /* 角色池 */\n    var pw = document.createElement('div');\n    pw.className = 'st-poolwrap';\n\n    var pl = document.createElement('div');\n    pl.className = 'st-poollabel';\n    pl.textContent = '角色池 · ' + ROSTER.length + ' 人';\n    pw.appendChild(pl);\n\n    var pool = document.createElement('div');\n    pool.className = 'st-pool';\n    elPool = pool;\n\n    ROSTER.forEach(function (ch, i) {\n      var c = document.createElement('div');\n      c.className = 'st-ch';\n\n      var b = document.createElement('div');\n      b.className = 'st-ball';\n      API.paintBall(b, ch, 54);\n\n      var t2 = document.createElement('div');\n      t2.className = 'st-ch-name';\n      t2.textContent = ch.name;\n\n      c.appendChild(b);\n      c.appendChild(t2);\n      c.onclick = function () { toggleChar(i); };\n      pool.appendChild(c);\n    });\n\n    pw.appendChild(pool);\n    wrap.appendChild(pw);\n\n    /* 底部按钮 */\n    var foot = document.createElement('div');\n    foot.className = 'st-foot';\n\n    var bR = document.createElement('button');\n    bR.type = 'button';\n    bR.className = 'st-btn';\n    bR.textContent = '随机填满';\n    bR.onclick = fillRandom;\n\n    var bC = document.createElement('button');\n    bC.type = 'button';\n    bC.className = 'st-btn';\n    bC.textContent = '清空';\n    bC.onclick = clearAll;\n\n    var bG = document.createElement('button');\n    bG.type = 'button';\n    bG.className = 'st-btn primary';\n    bG.textContent = '开始播放 ▶';\n    bG.onclick = start;\n\n    foot.appendChild(bR);\n    foot.appendChild(bC);\n    foot.appendChild(bG);\n    wrap.appendChild(foot);\n\n    setup.appendChild(wrap);\n\n    renderSlots();\n    renderPool();\n  }\n\n  /* ---------------- 渲染 ---------------- */\n  function renderSlots() {\n    [1, 2].forEach(function (side) {\n      var box = elSlots[side];\n      box.innerHTML = '';\n\n      for (var k = 0; k \u003C S.counts[side - 1]; k++) {\n        (function (side, k) {\n          var key = S.picks[side - 1][k];\n          var ch = key ? byKey(key) : null;\n\n          var c = document.createElement('div');\n          c.className = 'st-slot' + (ch ? ' filled' : '');\n\n          if (ch) {\n            var b = document.createElement('div');\n            b.className = 'st-ball';\n            API.paintBall(b, ch, 88);\n\n            var n = document.createElement('div');\n            n.className = 'st-slot-name';\n            n.textContent = ch.name;\n\n            c.appendChild(b);\n            c.appendChild(n);\n            c.title = '点击移除';\n          } else {\n            c.innerHTML = '\u003Cdiv class=\"st-empty\">+\u003C/div>';\n          }\n\n          c.onclick = function () { removeSlot(side, k); };\n          box.appendChild(c);\n        })(side, k);\n      }\n    });\n  }\n\n  function renderPool() {\n    var used = usedMap();\n    Array.prototype.forEach.call(elPool.children, function (c, i) {\n      c.classList.toggle('used', !!used[ROSTER[i].key]);\n    });\n  }\n\n  function refresh() {\n    renderSlots();\n    renderPool();\n    // 人数按钮高亮\n    Array.prototype.forEach.call(setup.querySelectorAll('.st-team'), function (t, si) {\n      Array.prototype.forEach.call(t.querySelectorAll('.cbtn'), function (b, bi) {\n        b.classList.toggle('on', S.counts[si] === bi + 1);\n      });\n    });\n  }\n\n  /* ---------------- 操作 ---------------- */\n  function setCount(side, n) {\n    var s = side - 1;\n    S.counts[s] = n;\n    while (S.picks[s].length \u003C n) S.picks[s].push('');\n    S.picks[s].length = n;\n    refresh();\n  }\n\n  function removeSlot(side, k) {\n    S.picks[side - 1][k] = '';\n    refresh();\n  }\n\n  function toggleChar(i) {\n    var key = ROSTER[i].key;\n\n    // 已经选了 -> 取消\n    for (var s = 0; s \u003C 2; s++) {\n      for (var k = 0; k \u003C S.counts[s]; k++) {\n        if (S.picks[s][k] === key) {\n          S.picks[s][k] = '';\n          refresh();\n          return;\n        }\n      }\n    }\n\n    // 没选 -> 填第一个空位\n    var slot = firstEmpty();\n    if (!slot) return;\n    S.picks[slot.s][slot.k] = key;\n    refresh();\n  }\n\n  function fillRandom() {\n    var used = usedMap();\n    for (var s = 0; s \u003C 2; s++) {\n      for (var k = 0; k \u003C S.counts[s]; k++) {\n        if (S.picks[s][k]) continue;\n        var pool = [];\n        for (var i = 0; i \u003C ROSTER.length; i++) {\n          if (!used[ROSTER[i].key]) pool.push(i);\n        }\n        if (!pool.length) break;\n        var pick = pool[Math.floor(Math.random() * pool.length)];\n        S.picks[s][k] = ROSTER[pick].key;\n        used[ROSTER[pick].key] = 1;\n      }\n    }\n    refresh();\n  }\n\n  function clearAll() {\n    S.picks = [[''], ['']];\n    for (var s = 0; s \u003C 2; s++) {\n      while (S.picks[s].length \u003C S.counts[s]) S.picks[s].push('');\n      S.picks[s].length = S.counts[s];\n    }\n    refresh();\n  }\n\n  function start() {\n    fillRandom();          // 空位自动随机补齐\n    close();\n    API.play({\n      counts: S.counts.slice(),\n      picks: [S.picks[0].slice(), S.picks[1].slice()]\n    });\n  }\n\n  /* ---------------- 开关 ---------------- */\n  function open() {\n    setup.classList.add('on');\n    document.body.classList.add('setup-open');\n    API.stop();          // 暂停动画但保留画面，别把上一局擦掉\n    refresh();\n  }\n\n  function close() {\n    setup.classList.remove('on');\n    document.body.classList.remove('setup-open');\n  }\n\n  function toggle() {\n    if (setup.classList.contains('on')) {\n      if (API.hasCfg()) close();\n    } else {\n      open();\n    }\n  }\n\n  var EMBED = /[?&](embed|auto)=/.test(location.search);\n\n  document.addEventListener('keydown', function (ev) {\n    if (EMBED) return;\n    if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;\n    if (ev.key === 'Tab' || ev.key === 'Escape') {\n      ev.preventDefault();\n      toggle();\n    }\n  });\n\n  /* ---------------- 启动 ---------------- */\n  build();\n\n  // 网址里已经指定了对局 / 被游戏页面嵌入时，不弹配置界面\n  if (EMBED) close();\n  else if (!API.hasCfg()) open();\n  else close();\n\n  // 播完之后允许再按 Tab 改（嵌入模式保留外层挂的回调）\n  if (!API.onEnd) API.onEnd = function () {};\n\n  window.SelectionPicker = {\n    open: open,\n    close: close,\n    state: S\n  };\n})();\n\n\u003C/script>\n\u003C/body>\n\u003C/html>\n";
</script>
