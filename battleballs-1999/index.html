<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1999小球对决·神秘学家对对碰（正式版）</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #wrap{width:min(97vw,1820px,calc((100vh - 104px) * 1.6))}
  #hud{display:flex;gap:clamp(6px,0.8vw,12px);margin-bottom:clamp(5px,0.7vh,10px);font-size:clamp(12px,1.05vw,17px)}
  .hcol{flex:1;background:#0c1219;border:1px solid #1b2634;border-radius:10px;padding:6px 8px;min-width:0}
  .hcol .teamhead{font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:4px;opacity:.9}
  .unit{margin-bottom:8px}
  .un{display:flex;justify-content:space-between;gap:8px;font-size:13px}
  .uhp{color:#9fb0c4}
  .bar{height:14px;border-radius:7px;background:#1f2630;overflow:hidden;margin-top:4px;border:1px solid #2b3440}
  .fill{height:100%;width:100%;transition:width .15s linear;border-radius:6px}
  .sk{font-size:11px;color:#5ad2ff;margin-top:3px;height:auto;min-height:13px;line-height:1.25;letter-spacing:.3px}
  /* 【术具】交感能量：每个属性一颗会跳的大圆珠 */
  .shjrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:5px;margin-top:5px;min-height:0}
  .shjball{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px rgba(255,255,255,.22),0 0 12px rgba(255,215,107,.45);
    transition:transform .12s ease}
  .shjball b{font-size:10px;font-weight:800;line-height:1;color:#20180a;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .shjball i{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-style:normal;
    font-size:9px;font-weight:700;color:#ffe9a8;letter-spacing:0;text-shadow:0 0 6px rgba(255,215,107,.7)}
  @keyframes shjPop{0%{transform:scale(1);filter:brightness(1)}
    30%{transform:scale(1.34);filter:brightness(2.0)}
    60%{transform:scale(.96);filter:brightness(1.35)}
    100%{transform:scale(1);filter:brightness(1)}}
  .shjball.pop{animation:shjPop .46s cubic-bezier(.2,.9,.3,1.4)}
  /* 【万能交感能量】：彩虹球 *//* uni */
  .shjball.uni{background:conic-gradient(from 0deg,#ff7b7b,#ffc46b,#f5f27a,#7deba0,#6fd8ff,#a98bff,#ff85e0,#ff7b7b);
    box-shadow:0 0 0 2px rgba(255,255,255,.42),0 0 15px rgba(186,222,255,.65);
    animation:shjHue 6s linear infinite}
  .shjball.uni.pop{animation:shjPop .46s cubic-bezier(.2,.9,.3,1.4),shjHue 6s linear infinite}
  .shjball.uni::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.26) 36%,rgba(255,255,255,0) 64%)}
  .shjball.uni b{position:relative;z-index:2;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
  .shjball.uni i{z-index:2;color:#eaf6ff;text-shadow:0 0 7px rgba(150,220,255,.95)}
  @keyframes shjHue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
  .shjlv{font-size:9px;font-weight:700;color:#ffd76b;letter-spacing:0;align-self:flex-end;
    padding-bottom:2px;text-shadow:0 0 7px rgba(255,215,107,.55)}
  #stage{position:relative}
  canvas{width:100%;display:block;border-radius:14px;background:#0a0e13;border:1px solid #2b3440;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #tip{margin-top:8px;font-size:12px;color:#7d8899;text-align:center;letter-spacing:.5px;display:none}

  #select{position:absolute;inset:0;border-radius:14px;
    background:radial-gradient(circle at 50% 0%,#101a26,#070a0e 72%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(5px,0.7vw,12px);box-sizing:border-box;gap:clamp(4px,0.6vw,9px);overflow:hidden}
  #select.hide{display:none}
  #modeRow{display:flex;gap:clamp(3px,0.45vw,6px);flex-wrap:wrap;justify-content:center;align-items:center}
  #mainRow{display:flex;flex-direction:row;gap:clamp(4px,0.6vw,8px);width:100%;flex:1;min-height:0;align-items:stretch}
  #rules{flex:0 0 clamp(250px,26%,400px);background:#0a1118;border:1px solid #1a2431;border-radius:10px;
    padding:7px 10px;box-sizing:border-box;height:100%;overflow-y:auto}
  #rules::-webkit-scrollbar{width:5px}
  #rules::-webkit-scrollbar-thumb{background:#24313f;border-radius:3px}
  #rules .rtitle{font-size:clamp(11px,1.05vw,15px);letter-spacing:2px;color:#9dc0d8;margin-bottom:7px}
  #rules .rgrid{display:grid;grid-template-columns:1fr;gap:clamp(4px,0.7vh,8px)}
  .rule{font-size:clamp(11px,1.02vw,14.5px);line-height:1.6;color:#a8bccf;white-space:pre-line}
  .rule b{display:block;font-weight:700;margin:0 0 3px}
  #rules .rfold{border:1px solid #1d2a38;border-radius:9px;background:#0c141c;overflow:hidden}
  #rules .rfold-h{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer;
    font-size:clamp(11px,1.02vw,14.5px);font-weight:700;color:#a8bccf;-webkit-tap-highlight-color:transparent}
  #rules .rfold-h span.rn{font-size:10px;font-weight:400;color:#5f7186;letter-spacing:1px}
  #rules .rfold-h i{margin-left:auto;width:7px;height:7px;flex:0 0 auto;border-right:2px solid #6e849a;
    border-bottom:2px solid #6e849a;transform:rotate(45deg);transition:transform .16s}
  #rules .rfold.open .rfold-h i{transform:rotate(-135deg)}
  #rules .rfold-b{display:none;padding:0 9px 9px;white-space:pre-line}
  #rules .rfold.open .rfold-b{display:grid;grid-template-columns:1fr;gap:clamp(4px,0.7vh,8px)}
  .chips .grp{flex:0 0 100%;font-size:clamp(12px,1.02vw,15px);font-weight:700;color:#5f7186;letter-spacing:1px;margin:6px 0 3px}
  #modeRow .lbl{font-size:11px;color:#5f7186;letter-spacing:1px;margin-left:5px}
  .modebtn{border:1px solid #24313f;background:#101a24;color:#8fa3ba;border-radius:9px;
    padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:1px}
  .modebtn.sel{border-color:#5ad2ff;color:#eaf7ff;background:#132533;box-shadow:0 0 14px rgba(90,210,255,.2)}
  #pickRow{position:relative;display:flex;flex-direction:row;gap:8px;align-items:stretch;justify-content:center;flex:1;min-width:0;min-height:0}
  #teams{display:flex;gap:8px;flex:1;min-height:0;min-width:0}
  .teamcol{flex:1 1 0;min-width:0;overflow-y:auto;background:#0b1017;border:1px solid #1a2431;border-radius:10px;padding:6px;box-sizing:border-box}
  .teamcol::-webkit-scrollbar{width:5px}
  .teamcol::-webkit-scrollbar-thumb{background:#24313f;border-radius:3px}
  .teamhead{display:flex;align-items:center;justify-content:space-between;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:5px}
  .teamhead .xue{display:none;align-items:center;gap:5px;font-size:13px;font-weight:800;
    letter-spacing:0;color:#ffd6e0;padding:2px 8px;border-radius:999px;
    background:linear-gradient(135deg,rgba(255,107,138,.42),rgba(255,60,110,.14));
    border:1px solid rgba(255,107,138,.85);
    box-shadow:0 0 12px rgba(255,107,138,.5),inset 0 0 8px rgba(255,107,138,.28);
    text-shadow:0 0 7px rgba(255,107,138,.85)}
  .teamhead .xue.on{display:inline-flex}
  .teamhead .xue.yh{color:#fff8e4;padding:2px 8px;
    background:linear-gradient(135deg,rgba(255,252,238,.32),rgba(228,192,116,.16));
    border:1px solid rgba(255,246,214,.9);
    box-shadow:0 0 12px rgba(255,238,186,.5),inset 0 0 8px rgba(255,246,214,.3);
    text-shadow:0 0 7px rgba(255,238,186,.85)}
  .teamhead .xue.yh b{color:#fffdf5;text-shadow:0 0 8px rgba(255,238,186,.9)}
  .teamhead .xue.yh .cap{color:#f6e6bd}
  .teamhead .xue.yh .hb{background:rgba(255,238,186,.22)}
  .teamhead .xue.yh .hb i{background:linear-gradient(90deg,#fffdf2,#f0d79b,#c9a256)}
  .teamhead .xue.yh .cr{width:13px;height:13px;display:inline-block;
    background:linear-gradient(135deg,#ffffff,#f4e0a8 42%,#c8a154 78%,#fffdf6);
    clip-path:polygon(50% 0,92% 34%,74% 100%,26% 100%,8% 34%);
    box-shadow:0 0 10px rgba(255,246,212,.95)}
  .teamhead .xue .nm{font-size:9px;font-weight:700;opacity:.82;letter-spacing:1px}
  .teamhead .xue .hi{font-size:14px;color:#ff6b8a;text-shadow:0 0 9px rgba(255,107,138,.95)}
  .teamhead .xue b{font-size:15px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(255,107,138,.9)}
  .teamhead .xue .cap{font-size:11px;font-weight:700;opacity:.75}
  .teamhead .xue .hb{width:52px;height:7px;border-radius:4px;background:rgba(255,107,138,.22);overflow:hidden;
    box-shadow:inset 0 0 4px rgba(0,0,0,.35)}
  .teamhead .xue .hb i{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#ff9cb4,#ff4d74);transition:width .15s linear}
  .teamhead .xue.full{animation:xuePulse .85s infinite alternate}
  .teamhead .ctrs{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;min-width:0}
  .teamhead .elec{display:none;align-items:center;gap:4px;font-size:11px;font-weight:800;
    letter-spacing:0;color:#d8f1ff;padding:2px 7px;border-radius:999px;white-space:nowrap;
    background:linear-gradient(135deg,rgba(90,210,255,.34),rgba(40,130,220,.14));
    border:1px solid rgba(127,211,255,.85);
    box-shadow:0 0 12px rgba(127,211,255,.45),inset 0 0 8px rgba(127,211,255,.25);
    text-shadow:0 0 7px rgba(127,211,255,.85)}
  .teamhead .elec.on{display:inline-flex}
  .teamhead .elec .nm{font-size:9px;font-weight:700;opacity:.82;letter-spacing:1px}
  .teamhead .elec b{font-size:14px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(127,211,255,.9)}
  .teamhead .elec .cap{font-size:10px;font-weight:700;opacity:.75}
  .teamhead .elec.lv3{animation:elecPulse .85s infinite alternate}
  @keyframes elecPulse{from{box-shadow:0 0 10px rgba(127,211,255,.45)}
    to{box-shadow:0 0 20px rgba(127,211,255,1),inset 0 0 10px rgba(127,211,255,.5)}}
  @keyframes xuePulse{from{box-shadow:0 0 10px rgba(255,107,138,.45)}
    to{box-shadow:0 0 20px rgba(255,107,138,1),inset 0 0 10px rgba(255,107,138,.5)}}
  .slot{margin-bottom:7px}
  .slothead{font-size:10px;color:#5f7186;margin-bottom:3px;letter-spacing:1px}
  .slothead b{font-size:clamp(13px,1.1vw,16px);font-weight:700;color:#b8d3e6;letter-spacing:1px}
  .picktag{display:inline-flex;align-items:center;gap:5px;border:1px solid #1e2a38;background:#111922;
    border-radius:7px;padding:clamp(3px,0.45vh,5px) clamp(6px,0.6vw,10px);font-size:clamp(11px,0.9vw,13px);
    color:#c6d8e8;cursor:pointer;transition:.12s;margin-bottom:4px;max-width:100%}
  .picktag:hover{background:#16222f;border-color:#2b4055}
  .picktag.empty{color:#5f7186;border-style:dashed}
  .picktag .cd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
  .picktag .tr{font-style:normal;font-size:10px;color:#c8a97f;background:#221b16;border-radius:4px;padding:0 3px}
  .slot.open .picktag{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{display:inline-flex;align-items:center;gap:4px;border:2px solid #2b3c50;background:#111922;
    border-radius:8px;padding:clamp(2px,0.35vh,4px) clamp(5px,0.55vw,8px);font-size:clamp(10px,0.84vw,13px);line-height:1.25;color:#8fa3ba;cursor:pointer;transition:.12s}
  .chip:hover{background:#16222f;border-color:#3d5872;color:#c6d8e8}
  .chip.sel{background:#16283a;color:#eaf7ff;border-width:3px;font-weight:700;box-shadow:0 0 14px rgba(120,210,255,.4)}
  .chip.lack{opacity:.6;border-style:dashed;cursor:not-allowed}
  .chip .el{font-style:normal;font-size:10px;color:#7fa8c8;background:#16222f;border-radius:4px;padding:0 3px}
  .chip .tr{font-style:normal;font-size:10px;color:#c8a97f;background:#221b16;border-radius:4px;padding:0 3px}
  .chip .miss{font-style:normal;font-size:10px;color:#ff9a6b;margin-left:2px}
  .chip .en{font-style:normal;font-size:9.5px;color:#6d8299;background:#131e29;border-radius:4px;padding:0 3px;letter-spacing:.2px}
  #cardTip{position:fixed;z-index:99;width:320px;box-sizing:border-box;display:none;pointer-events:none;
    background:#0c1219;border:1px solid #26374a;border-radius:10px;padding:8px 10px;
    font-size:12px;line-height:1.6;color:#c7d6e6;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #cardTip .tname{font-size:13px;font-weight:700;color:#eaf7ff;margin-bottom:2px}
  #cardTip .tmeta{font-size:11px;color:#7fa8c8;margin-bottom:5px}
  #cardTip .ten{font-size:11px;color:#6d8299;letter-spacing:.4px;margin:-1px 0 4px}
  #cardTip .tdesc{color:#8fa3ba}
  #cardTip .tskill{margin-top:5px;color:#b9d4ea}
  #cardTip .twarn{margin-top:5px;color:#ff9a6b}
  .chip .cd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
  .card{display:flex;gap:7px;align-items:flex-start;background:#111922;
    border:2px solid #1e2a38;border-radius:11px;padding:7px 8px;margin-bottom:6px;
    cursor:pointer;transition:.15s;text-align:left}
  .card:hover{background:#16222f;border-color:#2b4055}
  .card.sel{border-color:#5ad2ff;background:#132533;box-shadow:0 0 16px rgba(90,210,255,.2)}
  .card .dot{width:18px;height:18px;border-radius:50%;flex:0 0 18px;margin-top:2px;
    box-shadow:inset -4px -5px 8px rgba(0,0,0,.5),0 0 10px rgba(255,255,255,.08)}
  .card .nm{font-size:12.5px;font-weight:700;line-height:1.2}
  .card .ds{font-size:10px;color:#7f8fa3;margin-top:2px;line-height:1.35}
  .card .skl{font-size:10px;color:#5ad2ff;margin-top:2px;line-height:1.35}
  .mid{flex:0 0 116px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px}
  .vs{font-size:22px;font-weight:800;color:#2f4459;letter-spacing:2px}
  #startBtn{border:0;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;
    color:#04121b;background:linear-gradient(135deg,#7ae0ff,#4cc9f0);cursor:pointer;
    box-shadow:0 6px 20px rgba(76,201,240,.3);font-family:inherit}
  #startBtn:hover{filter:brightness(1.08)}
  #skipBtn{position:absolute;top:12px;right:12px;z-index:30;display:none;
    border:1px solid #5ad2ff;background:rgba(12,20,30,.88);color:#eaf7ff;border-radius:9px;
    padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;
    box-shadow:0 4px 16px rgba(0,0,0,.45)}
  #skipBtn:hover{background:#132533;border-color:#7ae0ff}
  #speedBar{position:absolute;top:12px;left:12px;z-index:30;display:none;gap:5px;align-items:center;
    background:rgba(12,20,30,.88);border:1px solid #2b4055;border-radius:9px;padding:4px 7px;
    box-shadow:0 4px 16px rgba(0,0,0,.45)}
  #speedBar .slbl{font-size:11px;color:#7fa8c8;letter-spacing:1px;margin-right:2px}
  #speedBar .spd{border:1px solid #1e2a38;background:#111922;color:#8fa3ba;border-radius:6px;
    padding:2px 7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
  #speedBar .spd:hover{background:#16222f;border-color:#2b4055}
  #speedBar .spd.sel{background:#132533;border-color:#5ad2ff;color:#eaf7ff;box-shadow:0 0 10px rgba(90,210,255,.2)}

  /* ---- 设备选择层 ---- */
  #devicePick{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;
    background:radial-gradient(circle at 50% 18%,#12202e,#05080c 72%)}
  #devicePick.hide{display:none}
  #dpLogo{width:clamp(280px,44vw,600px);height:auto;display:block;
    filter:drop-shadow(0 6px 22px rgba(90,210,255,.18));margin-bottom:-2px}
  #devicePick .dp-title{font-size:clamp(19px,2.4vw,28px);font-weight:800;letter-spacing:3px;color:#eaf7ff}
  #devicePick .dp-sub{font-size:13px;color:#7d8899;letter-spacing:1px;text-align:center}
  #devicePick .dp-row{display:flex;flex-direction:row;gap:14px;flex-wrap:nowrap;justify-content:center;align-items:stretch;margin-top:8px}
  .dp-btn{flex:0 1 auto;min-width:0;width:clamp(130px,28vw,240px);padding:16px 18px;border-radius:14px;border:1px solid #29455c;
    background:#0f1a24;color:#cfe6f5;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px;
    cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:7px}
  .dp-btn small{font-size:11px;font-weight:400;color:#6f8496;letter-spacing:0}
  .dp-btn:hover{border-color:#5ad2ff;background:#132533;color:#eaf7ff;box-shadow:0 0 22px rgba(90,210,255,.22)}

  /* ---- 比例滚动条：长度=可见部分/总长 ---- */
  .sbTrack{position:fixed;z-index:120;border-radius:6px;background:rgba(140,180,220,.12);touch-action:none;display:none}
  .sbThumb{position:absolute;border-radius:6px;background:rgba(120,200,255,.55);
    box-shadow:0 0 8px rgba(90,210,255,.28)}
  .sbTrack.v{width:6px}
  .sbTrack.v .sbThumb{left:0;right:0;top:0}
  .sbTrack.h{height:6px}
  .sbTrack.h .sbThumb{top:0;bottom:0;left:0}

  /* ---- 移动端 UI（html[data-device="mobile"]，横屏布局）---- */
  html[data-device="mobile"],html[data-device="mobile"] body{display:block;overflow:hidden;height:100%;height:100dvh}
  /* 手机端战斗界面：左边队伍详情竖栏，右边战斗区，左右并排 */
  html[data-device="mobile"] #wrap{width:100%;max-width:none;height:100%;padding:4px 6px 6px;box-sizing:border-box;
    display:flex;flex-direction:row;align-items:stretch;gap:5px}
  html[data-device="mobile"] #hud{flex:0 0 24%;max-width:24%;height:100%;flex-direction:column;
    font-size:var(--hudFs,10px);gap:3px;margin:0;overflow:hidden;justify-content:flex-start}
  html[data-device="mobile"] #hud:empty{display:none}
  /* 队伍详情：每队一块，高度均分，内容按字号自动缩，保证多队也能一眼全看到 */
  html[data-device="mobile"] .hcol{flex:1 1 0;min-height:0;padding:3px 5px;border-radius:7px;
    display:flex;flex-direction:column;gap:1px;overflow:hidden}
  html[data-device="mobile"] .hcol .teamhead{font-size:calc(var(--hudFs,10px) * 1.05);
    margin-bottom:1px;letter-spacing:1px}
  html[data-device="mobile"] .unit{flex:1 1 0;min-height:0;margin-bottom:1px;overflow:hidden}
  html[data-device="mobile"] .un{font-size:calc(var(--hudFs,10px) * 1.05);gap:4px;line-height:1.15}
  html[data-device="mobile"] .bar{height:calc(var(--hudFs,10px) * 0.9);margin-top:2px;border-radius:5px}
  html[data-device="mobile"] .sk{font-size:calc(var(--hudFs,10px) * 0.9);margin-top:1px;height:auto;line-height:1.1}
  html[data-device="mobile"] #stage{flex:1 1 auto;min-width:0;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  html[data-device="mobile"] canvas{order:1;width:auto;height:auto;border-radius:8px;
    max-width:100%;max-height:calc(100% - 34px)}
  /* 移动端竖着拿也按横版排，整页等比缩放，不再要求转手机 */
  html[data-device="mobile"] #select{position:fixed;inset:0;z-index:50;border-radius:0;
    justify-content:flex-start;padding:6px;gap:6px;overflow:hidden}
  html[data-device="mobile"] #modeRow{gap:4px;justify-content:flex-start;width:100%;flex:0 0 auto;flex-wrap:wrap}

<div id="devicePick">
  <img id="dpLogo" src="assets/faces/logo.webp" alt="重返小球1999">
  <div class="dp-title">选择游玩设备</div>
  <div class="dp-sub" id="dpLoading">正在载入游戏资源…（首次打开约 2 MB，之后有缓存会更快）</div>
  <div class="dp-row">
    <button class="dp-btn" type="button" data-device="pc" onclick="window.__pickDevice&&window.__pickDevice('pc')">电脑端<small>宽屏大视界，适配电脑</small></button>
    <button class="dp-btn" type="button" data-device="mobile" onclick="window.__pickDevice&&window.__pickDevice('mobile')">移动端<small>单列大按钮，适配手机</small></button>
  </div>
</div>
<script>
/* 慢加载兜底：整页约 17MB，主脚本要十几秒才执行到 window.__pickDevice。
   在此之前点击按钮时先记录选择并给提示，等真正的函数就绪后自动补上。 */
(function(){
  window.__pickPending=null;
  window.__pickDevice=function(dev){
    dev=(dev==='mobile')?'mobile':'pc';
    window.__pickPending=dev;
    document.documentElement.setAttribute('data-device',dev);
    var t=document.getElementById('dpLoading');
    if(t){ t.textContent='已选择'+(dev==='mobile'?'移动端':'电脑端')+'，正在载入游戏，请稍候…'; }
  };
})();
</script>

// 让界面按浏览器实际可视高度铺开：HUD 和底部提示占多少，剩下的全给战场
function fitWrap(){
  const wrap=document.getElementById('wrap'), hud=document.getElementById('hud'), tip=document.getElementById('tip');
  if(!wrap) return;
  document.body.style.transform='';
  document.body.style.width='';
  document.body.style.height='';
  const isMobile=document.documentElement.getAttribute('data-device')==='mobile';
  const portrait=window.innerHeight>window.innerWidth;
  if(isMobile){
    // 手机端：竖屏整页旋转成横版（宽高互换），横屏直接铺满
    wrap.style.width='';
    wrap.style.height='';
    // 竖屏场地本身就要竖着看，不能把整页转 90°
    if(portrait && document.documentElement.getAttribute('data-field')!=='portrait'){
      wrap.style.width=Math.round(window.innerHeight)+'px';
      wrap.style.height=Math.round(window.innerWidth)+'px';
    }
    requestAnimationFrame(function(){ try{ fitHudText(); }catch(e){} });
    return;
  }
  const used=(hud?hud.offsetHeight:0)+(tip?tip.offsetHeight:0)+34;
  const availH=Math.max(240,window.innerHeight-used);
  const availW=Math.max(240,window.innerWidth-8);
  wrap.style.width=Math.min(availW,1920,availH*canvasAspect)+'px';
}
window.addEventListener('resize',fitWrap);
window.addEventListener('orientationchange',function(){setTimeout(fitWrap,80)});
fitWrap();
// HUD 队数变化后高度会变，重新算一次可用高度
if(window.ResizeObserver){
  let lock=false;
  new ResizeObserver(function(){ if(lock) return; lock=true; fitWrap(); requestAnimationFrame(function(){lock=false;}); })
    .observe(document.getElementById('hud'));
}


let W=cv.width, H=cv.height;
// 换场地时同步改画布尺寸：竖屏是正方形，横屏保持 16:10
function setCanvasSize(w,h){
  canvasAspect=w/h;
  if(cv.width===w && cv.height===h) return;
  cv.width=w; cv.height=h; W=w; H=h;
  applyField();
}
const WALL=18;
const FIELDS={
  small:{w:760,h:470},
  mid:{w:1020,h:630},
  large:{w:1280,h:800},
  portrait:{w:820,h:820}
};
let fieldKey='large';
let L=WALL, R=W-WALL, T=WALL, B=H-WALL;
function applyField(){
  const f=FIELDS[fieldKey]||FIELDS.large;
  const x0=Math.round((W-f.w)/2), y0=Math.round((H-f.h)/2);
  L=x0+WALL; R=x0+f.w-WALL; T=y0+WALL; B=y0+f.h-WALL;
}
applyField();

// 标签加成：主C +6攻；副C +3攻 +150血；辅助 +300血
const TAGS={
  '主C':{atk:6,hp:0},
  '副C':{atk:3,hp:150},
  '辅助':{atk:0,hp:300}
};
const ELEMENTS=['岩','兽','木','星','灵','智'];
// 属性分组标题的颜色与小球一致
const ELEM_COLOR={'岩':'#ffc53d','兽':'#ff4d5e','木':'#43c25b','星':'#4a9dff','灵':'#a25cff','智':'#9aa7b5'};
const ELEM_FALLBACK='#9dc0d8';
// 选人界面统一用属性色描边：不看角色自己的配色，只认属性
function elemColorOf(key){
  const ch=CHARS[key]||{};
  if(ch.element && ELEM_COLOR[ch.element]) return ELEM_COLOR[ch.element];
  if(ch.element2 && ELEM_COLOR[ch.element2]) return ELEM_COLOR[ch.element2];
  return ELEM_FALLBACK;
}
// 克制：岩克兽、兽克木、木克星、星克岩；灵智互克
const COUNTER={'岩':'兽','兽':'木','木':'星','星':'岩'};
// 克制不再翻倍率，只在打出克制时额外附加固定伤害（见 ctrBonus）
function tagBonus(key){
  const c=CHARS[key]||{};
  // tag=='all'：同时拥有主C/副C/辅助全部定位，效果全部叠加
  if(c.tag==='all'){
    let atk=0,hp=0;
    for(const k of Object.keys(TAGS)){ atk+=(TAGS[k].atk||0); hp+=(TAGS[k].hp||0); }
    return {atk,hp};
  }
  // tag 写成 '主C/副C' 这种多标签：各标签加成取平均（即五五分）
  if(c.tag && c.tag.indexOf('/')>-1){
    const ks=c.tag.split('/').filter(k=>TAGS[k]);
    if(ks.length){
      let atk=0,hp=0;
      for(const k of ks){ atk+=(TAGS[k].atk||0); hp+=(TAGS[k].hp||0); }
      return {atk:Math.round(atk/ks.length), hp:Math.round(hp/ks.length)};
    }
  }
  return TAGS[c.tag]||{atk:0,hp:0};
}
function elemName(e){
  // 没有【全系】这个属性，全属性角色在各系分组里各自出现，不额外显示属性标签
  if(e==='all') return '';
  return e||'';
}
function baseStats(key){
  const t=tagBonus(key);
  const c=CHARS[key]||{};
  // hpBonus：角色自带的额外基础生命（如诺谛卡 +350）
  return {hp:BASE_HP+t.hp+(c.hpBonus||0), atk:BASE_ATK+t.atk};
}

// 新增角色校验：性别与皮肤价格必须齐全，
// 缺字段的角色先不上场，先在群里提醒对方补全再添加
function charMissing(key){
  const c=CHARS[key]; const miss=[];
  if(!c.gender) miss.push('性别');
  if(typeof c.price!=='number') miss.push('皮肤价格');
  return miss;
}
(function validateChars(){
  for(const k of Object.keys(CHARS)){
    const miss=charMissing(k);
    if(miss.length) console.warn('[角色缺字段] '+CHARS[k].name+'（'+k+'）缺少 '+miss.join(' / ')+'，补全后再添加');
    const lab=[];
    if(!CHARS[k].element) lab.push('属性');
    if(!CHARS[k].tag) lab.push('定位');
    if(!CHARS[k].trait) lab.push('特色标签');
    if(lab.length) console.warn('[角色缺标签] '+CHARS[k].name+'（'+k+'）缺少 '+lab.join(' / ')+'，记得补全');
  }
})();

const TEAM_SHIELD_WINDOW=10;
const TEAM_SHIELD_TIMES=2;
let shieldPool=[];
function resetShieldPool(){
  shieldPool=[];
  for(let i=0;i<8;i++) shieldPool.push({left:TEAM_SHIELD_TIMES,win:TEAM_SHIELD_WINDOW});
}
function shieldPoolOf(team){
  if(!shieldPool[team]) shieldPool[team]={left:TEAM_SHIELD_TIMES,win:TEAM_SHIELD_WINDOW};
  return shieldPool[team];
}
function shieldPoolTick(dt){
  for(const q of shieldPool){
    if(!q) continue;
    q.win-=dt;
    if(q.win<=0){ q.win=TEAM_SHIELD_WINDOW; q.left=TEAM_SHIELD_TIMES; }
  }
}
function shieldPoolUse(team){
  const q=shieldPoolOf(team);
  if(q.left<=0) return false;
  q.left--;
  return true;
}

// 薪血与余辉不会共存：取编号最靠前的薪血/余辉角色，由它的体系与计数器生效
function teamCtrKind(team){
  for(const b of balls){
    if(b.team!==team) continue;
    if(b.trait==='薪血'||b.trait==='余辉') return b.trait;
  }
  return null;
}
function teamHasXue(team){ return teamCtrKind(team)==='薪血'; }
function xueCap(team){
  let hp=0;
  for(const b of balls){ if(b.team===team && b.hp>0) hp+=b.maxhp; }
  return Math.max(1,Math.round(hp*XUE_RATIO));
}
// 掉血累计：满10点换1点薪血，不满10的余数留着继续攒
function addXue(team,loss){
  if(!(loss>0)) return 0;
  if(!teamHasXue(team)) return 0;
  const f=xueOf(team), cap=xueCap(team);
  const per=semeDomainOn(team)?SEME_XUE_PER:XUE_PER;
  f.lost=(f.lost||0)+loss;
  if(f.stock>=cap){ f.rem=0; return 0; }
  const s0=f.stock;
  f.rem+=loss;
  while(f.rem>=per && f.stock<cap){ f.rem-=per; f.stock++; }
  if(f.stock>=cap) f.rem=0;
  xueEarn(team,f.stock-s0);
  return f.stock-s0;
}
// 直接加点（玛丽安娜狙击那种），不走路掉血的累计
function xueGain(team,n){
  if(!teamHasXue(team)) return;
  const f=xueOf(team), cap=xueCap(team);
  const s0=f.stock;
  f.stock=Math.min(cap,f.stock+Math.max(0,n));
  xueEarn(team,f.stock-s0);
}

/* ---- 爆炸冲击波：纯视觉，不造成伤害 ---- */
function spawnShock(x,y,color,max,dur,lw){
  shocks.push({x,y,color,r:12,max,max0:max,speed:(max-12)/Math.max(0.05,dur),
    life:dur,life0:dur,lw:lw||6});
}
function updateShocks(dt){
  for(const s of shocks){
    s.r+=s.speed*dt;
    s.life-=dt;
    if(s.life<=0 || s.r>=s.max) s.life=0;
  }
  if(shocks.length) shocks=shocks.filter(s=>s.life>0);
}
function drawShocks(){
  for(const s of shocks){
    const k=Math.max(0,Math.min(1,s.life/s.life0));
    const t=1-k;   // 0 -> 1 的扩散进度
    g.save();
    g.shadowColor=s.color; g.shadowBlur=28;
    // 外圈冲击环
    g.globalAlpha=0.70*k*k;
    g.strokeStyle=s.color; g.lineWidth=(s.lw||6)*k+1.5;
    g.beginPath(); g.arc(s.x,s.y,s.r,0,7); g.stroke();
    // 内圈余波
    g.globalAlpha=0.34*k;
    g.strokeStyle='#ffffff'; g.lineWidth=1.6*k+0.6;
    g.beginPath(); g.arc(s.x,s.y,s.r*0.72,0,7); g.stroke();
    // 内部红光填充
    g.globalAlpha=0.18*k*k;
    g.fillStyle=s.color;
    g.beginPath(); g.arc(s.x,s.y,s.r*0.95,0,7); g.fill();
    // 十字光芒
    g.globalAlpha=0.40*k;
    g.strokeStyle=s.color; g.lineWidth=4.5*k+1;
    for(const a of [0,Math.PI/2,Math.PI,Math.PI*1.5]){
      g.beginPath();
      g.moveTo(s.x+Math.cos(a)*s.r*0.35,s.y+Math.sin(a)*s.r*0.35);
      g.lineTo(s.x+Math.cos(a)*(s.r+40*k),s.y+Math.sin(a)*(s.r+40*k));
      g.stroke();
    }
    g.restore();
  }
}

function addElectric(team,stack){
  if(!teamHasElec(team)) return;
  const f=fieldOf(team);
  if(f.lv===3) return;
  f.charge+=Math.max(0,stack);
  const src=balls.find(b=>b.team===team && b.hp>0 && b.trait==='电能')||balls.find(b=>b.team===team && b.hp>0);
  // 卡戎在场：没有二级阶段，Lv.1 攒满90层直接跳 Lv.3
  if(teamHasCharon(team)){
    if(f.lv===1 && f.charge>=CHARON_TOTAL_NEED){

/* ---- 告死鸟：铁轨与列车 ---- */
function heronStats(b){
  const lv=fieldOf(b.team).lv;
  return {
    cars: lv===3?HERON_CARS_3:HERON_CARS,
    speed: lv===3?HERON_SPEED3:(lv===2?HERON_SPEED2:HERON_SPEED),
    dmg: HERON_DMG + (lv===3?HERON_UP3:(lv===2?HERON_UP2:0))
  };
}
// 求过点p、方向(dx,dy)的直线与场地边界相交的两个端点
function railEdges(p,dx,dy){
  const ts=[];
  if(Math.abs(dx)>1e-6){ ts.push((L-p.x)/dx); ts.push((R-p.x)/dx); }
  if(Math.abs(dy)>1e-6){ ts.push((T-p.y)/dy); ts.push((B-p.y)/dy); }
  let tmin=Infinity,tmax=-Infinity;
  for(const t of ts){
    const x=p.x+dx*t, y=p.y+dy*t;
    if(x<L-0.8||x>R+0.8||y<T-0.8||y>B+0.8) continue;
    tmin=Math.min(tmin,t); tmax=Math.max(tmax,t);
  }
  if(!isFinite(tmin)||!isFinite(tmax)) return null;
  return [{x:p.x+dx*tmin,y:p.y+dy*tmin},{x:p.x+dx*tmax,y:p.y+dy*tmax}];
}
function heronWallHit(b){
  if(b.heronCd>0) return;
  const cur=rails.find(r=>r.owner===b && !r.ready && !r.traveling);
  if(cur){
    // 两次撞墙点连成一条横跨全场的直线，不再沿墙面来回折
    const A=cur.pts[0], pb={x:b.x,y:b.y};
    let dx=pb.x-A.x, dy=pb.y-A.y;
    let len=Math.hypot(dx,dy);
    if(len<40){ dx=(L+R)/2-A.x; dy=(T+B)/2-A.y; len=Math.hypot(dx,dy)||1; }
    dx/=len; dy/=len;
    let e=railEdges(A,dx,dy);
    const minLen=Math.max(R-L,B-T)*0.55;
    if(!e || Math.hypot(e[1].x-e[0].x,e[1].y-e[0].y)<minLen){
      const e2=railEdges({x:(L+R)/2,y:(T+B)/2},dx,dy);
      if(e2) e=e2;
    }
    // 方向贴着墙面走时，把直线挪到场地中线，避免轨道擦着墙开
    const sideWall=(A.x-L<60)||(R-A.x<60);
    const topWall=(A.y-T<60)||(B-A.y<60);
    if((sideWall && Math.abs(dy)>Math.abs(dx)*1.2) || (topWall && Math.abs(dx)>Math.abs(dy)*1.2)){
      const e3=railEdges({x:(L+R)/2,y:(T+B)/2},dx,dy);
      if(e3) e=e3;
    }
    if(e){
      cur.pts=[e[0],e[1]];
      cur.ready=true; cur.waitT=HERON_WAIT;
      addText(b.x,b.y-b.r-46,'铁轨接通',HERON_COLOR);
      burst(b.x,b.y,HERON_COLOR,10);
      return;
    }
  }
  if(rails.some(r=>r.owner===b)) return;
  rails.push({owner:b,team:b.team,pts:[{x:b.x,y:b.y}],ready:false,waitT:0,traveling:false});
  sePlay('rail');
}
function heronTrack(b,dt){
  if(b.heronCd>0) return;
  const cur=rails.find(r=>r.owner===b && !r.ready && !r.traveling);
  if(!cur) return;
  b.railTick=(b.railTick||0)-dt;
  if(b.railTick<=0){
    b.railTick=0.04;
    // 预览只画起点到当前身位的直线，撞墙时再裁成横跨全场的弦
    cur.pts=[cur.pts[0],{x:b.x,y:b.y}];
  }
}
function railLen(pts){
  let d=0;
  for(let i=1;i<pts.length;i++) d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  return d;
}
function railPoint(pts,dist){
  if(!pts.length) return {x:0,y:0,ang:0};
  if(pts.length===1) return {x:pts[0].x,y:pts[0].y,ang:0};
  let d=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    const seg=Math.hypot(b.x-a.x,b.y-a.y)||0.0001;
    if(d+seg>=dist){
      const t=Math.max(0,Math.min(1,(dist-d)/seg));
      return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,ang:Math.atan2(b.y-a.y,b.x-a.x)};
    }
    d+=seg;
  }
  const a=pts[pts.length-2], b=pts[pts.length-1];
  const ang=Math.atan2(b.y-a.y,b.x-a.x);
  const over=dist-d;
  return {x:b.x+Math.cos(ang)*over,y:b.y+Math.sin(ang)*over,ang};
}
function launchTrain(r){
  spiritTeamSkill(r);
  const st=heronStats(r.owner);
  r.traveling=true;
  trains.push({owner:r.owner,team:r.team,pts:r.pts.slice(),dist:0,
    cars:st.cars,speed:st.speed,dmg:st.dmg,color:HERON_COLOR,hitCd:new Map()});
  addText(r.pts[0].x,r.pts[0].y-24,'列车出发',HERON_COLOR);
  sePlay('train');
}
function updateHeron(dt){
  for(const b of balls){
    if(b.hp<=0) continue;
    if(b.heronCd>0) b.heronCd=Math.max(0,b.heronCd-dt);
    if(b.skillType==='corvus') heronTrack(b,dt);
  }
  for(const r of rails){
    if(r.owner && r.owner.hp<=0 && !r.traveling) r.dead=true;
    if(r.dead) continue;
    if(r.ready && !r.traveling){
      r.waitT-=dt;
      if(r.waitT<=0) launchTrain(r);
    }
  }
  for(const t of trains){
    t.dist+=t.speed*dt;
    const len=railLen(t.pts);
    const tail=t.dist-(t.cars-1)*HERON_GAP;
    for(const b of balls){
      if(b.hp<=0||b.team===t.team) continue;
      for(let i=0;i<t.cars;i++){
        const d=t.dist-i*HERON_GAP;
        if(d<0) continue;
        const p=railPoint(t.pts,d);
        if(Math.hypot(b.x-p.x,b.y-p.y)>=b.r+13*HERON_CAR_SCALE) continue;
        const cd=t.hitCd.get(b)||0;
        if(cd>0) continue;
        t.hitCd.set(b,0.35);
        applyDamage(b,t.dmg,t.color,t.owner);
        // 列车车厢撞人也算【电能】角色碰撞：基础5层 + 电能角色额外10层
        addElectric(t.team,ELEC_STACK_COLLIDE+ELEC_STACK_ELEC);
        const a2=Math.atan2(b.y-p.y,b.x-p.x)||0;
        b.vx=Math.cos(a2)*760; b.vy=Math.sin(a2)*760;
        addText(b.x,b.y-b.r-22,'列车 '+LRv(t.dmg),t.color);
        burst(p.x,p.y,t.color,10);
        hitFx(b.x,b.y,t.color,'train');
        shake=Math.max(shake,5);
        break;
      }
    }
    for(const [k,v] of t.hitCd) t.hitCd.set(k,Math.max(0,v-dt));
    if(tail>len+160){
      t.done=true;
      const r=rails.find(x=>x.owner===t.owner && x.traveling);
      if(r) r.dead=true;
      if(t.owner){ t.owner.heronCd=0; t.owner.railTick=0; }
      if(t.owner) addText(t.owner.x,t.owner.y-t.owner.r-46,'清轨',HERON_COLOR);
    }
  }
  trains=trains.filter(t=>!t.done);
  rails=rails.filter(r=>!r.dead);
}

const FISH_CD=2;
const FISH_BIG_DMG=28;
const FISH_LI_DMG=15;
const FISH_CAO_DMG=10;

function maxSp(b){
  let m=b.dashPhase==='dash'?DASH_SPEED:b.speedMax;
  if(b.semePhase==='dash') m=Math.max(m,SEME_DASH);
  if(b.grayDriveT>0) m+=GRAY_DRIVE_SPEED;
  if((b.beastT||0)>0 && b.beastKind==='horse') m*=MARCUS_HORSE_SPEED;   // 当海风翻页时·小马 305%
  m*=elecSpeedMul(b.team);
  if(b.slowT>0) m*=1-(b.slowAmt||ELEC_SLOW);
  return m;
}
function clampSp(b){
  const sp=Math.hypot(b.vx,b.vy)||1, mx=maxSp(b);
  if(sp>mx){ b.vx*=mx/sp; b.vy*=mx/sp; }
  else if(sp<b.speedMin){ b.vx*=b.speedMin/sp; b.vy*=b.speedMin/sp; }
}
/* ---- 芦草结：惠姑 / 种子 / 一苇之所如 ---- */
function reedFormHui(b,silent){
  if(!b) return;
  if(!b.reedBaseMax) b.reedBaseMax=Math.max(1,b.maxhp-(b.eagleHpAdd||0));
  b.reedMode='hui';
  b.maxhp=REED_HUI_HP;
  b.hp=REED_HUI_HP;
  b.reedT=REED_HUI_TICK;
  b.reedGrace=false;

// 克制追加：打出克制伤害时，额外再附2点固定克制伤害
const CTR_BONUS=2;
function isCounter(a,b){
  if(!a||!b) return false;
  // 全属性：攻防任一方拥有全部属性，都视为打出克制
  if(a==='all'||b==='all') return true;
  if((a==='灵'&&b==='智')||(a==='智'&&b==='灵')) return true;
  return COUNTER[a]===b;
}
function ctrBonus(a,b){ return isCounter(a,b)?CTR_BONUS:0; }
// 露西在3级电场中，自身造成的伤害全部视为克制伤害
function ctrBonusOf(b,t){
  // 露西：克制伤害额外 +2（3级电场中全部视为克制）
  if(b && b.skillType==='lucy'){
    if(fieldOf(b.team).lv===3) return CTR_BONUS+LUCI_CTR_UP;
    if(t && isCounter(b.element,t.element)) return CTR_BONUS+LUCI_CTR_UP;
    return 0;
  }
  if(!b||!t) return 0;
  // 【肥鸟尘酿鹰】在场：己方克制伤害额外附加 +3
  const eAdd=eagleCtrAdd(b.team);
  // 双属性角色（双生舞伶合体）：岩、星任一克制即算克制
  if(isCounter(b.element,t.element)) return CTR_BONUS+eAdd;
  if(b.element2 && isCounter(b.element2,t.element)) return CTR_BONUS+eAdd;
  return 0;
}
function poisonTotal(b){ let s=0; for(const p of b.poison) s+=p.dmg; return s; }

/* ---- 环状水星：宇宙能量累积 ---- */
// 己方角色身上的计数器（升阶类）
function merCounterOf(x){
  if(!x || x.hp<=0) return null;
  if(x.skillType==='marcus') return 'read';
  if(x.skillType==='s37') return 'spirit';
  if(x.skillType==='mercuria') return 'cosmos';
  if(x.skillType==='argus') return 'marks';
  return null;
}
function merAddCounter(x,n){
  const k=merCounterOf(x);
  if(!k || n<=0) return;
  if(k==='read'){ x.read=(x.read||0)+n; addText(x.x,x.y-x.r-58,'阅历 +'+n,MARCUS_COLOR); }
  else if(k==='spirit'){ spiritAdd(x,n); }
  else if(k==='marks'){ argusAddMark(x,n); }
  else { merTouch(x,n); }   // 宇宙能量：走统一入口，绿色流溢加的层数同样会判定【环状家族】/【赠予夜的晨星】
}
function merTouch(b,add){
  if(!b || b.hp<=0 || b.skillType!=='mercuria') return;
  b.cosmos=(b.cosmos||0)+add;
  addText(b.x,b.y-b.r-50,'宇宙能量 '+Math.floor(b.cosmos),MER_COLOR);
  while(b.cosmos-(b.merSmallMark||0)>=MER_SMALL){
    b.merSmallMark=(b.merSmallMark||0)+MER_SMALL;
    // 正式版削弱：冷却期间凑满的触发直接作废（不会排队等冷却）
    if((b.merRingCd||0)<=0){ b.merRingCd=MER_RING_CD; merRingFamily(b); }
  }
  while(b.cosmos-(b.merBigMark||0)>=MER_BIG){
    b.merBigMark=(b.merBigMark||0)+MER_BIG;
    // 【漫游迪斯科】期间同样可以触发赠予夜的晨星
    merMeteor(b);
  }
}
function merOf(team){ return balls.find(b=>b.team===team && b.hp>0 && b.skillType==='mercuria') || null; }
// 其他【升阶】角色计数器满进入强化状态后，环状水星【宇宙能量】+5
function merUpgradeBonus(team){
  const m=merOf(team);
  if(!m) return;
  addText(m.x,m.y-m.r-40,'升阶共鸣 · 宇宙能量+5',MER_COLOR);

// 【环状家族】：己方全体角色（含环状水星自己）计数器+2（n 固定为 2，不再按属性数加成）
function merRingFamily(b){
  const n=MER_SMALL_ADD;
  seMerFamily();
  addText(b.x,b.y-b.r-74,'环状家族',MER_COLOR);
  burst(b.x,b.y,MER_COLOR,18);
  // 【环状家族】触发时环状水星自身回复生命
  if(b.hp>0){
    const before=b.hp;
    b.hp=Math.min(b.maxhp,b.hp+MER_RING_HEAL+healBonus(b));
    const hv=Math.round(b.hp-before);
    if(hv>0){
      addText(b.x,b.y-b.r-52,'+'+hv,MER_COLOR);
      burst(b.x,b.y,MER_COLOR,10);
      healFx(b.x,b.y,hv,'heal');
    }
  }
  for(const x of balls){
    if(x.team!==b.team || x.hp<=0) continue;
    x.merRingT=MER_RING_DUR;   // 己方全体小球周围闪一圈环状图案
    // 环状水星自己只吃 +1（MER_SELF_ADD），其他队友 +2
    merAddCounter(x, x.skillType==='mercuria' ? MER_SELF_ADD : n);
  }
}
// 击退到最近的墙边
function merKnockToWall(f){
  if(!f || f.hp<=0) return;
  const dl=f.x-L, dr=R-f.x, dt=f.y-T, db=B-f.y;
  const m=Math.min(dl,dr,dt,db), sp=(f.speedMax||700)*0.7;
  if(m===dl){ f.x=L+f.r+1; f.vx=-sp; }
  else if(m===dr){ f.x=R-f.r-1; f.vx=sp; }
  else if(m===dt){ f.y=T+f.r+1; f.vy=-sp; }
  else { f.y=B-f.r-1; f.vy=sp; }
  addText(f.x,f.y-f.r-26,'击退',MER_COLOR);
}
// 【赠予夜的晨星】：敌人吃等同宇宙能量层数/5的伤害（上限当前生命25%），击退至墙
function merMeteor(b){
  const dmgBase=Math.max(1,Math.floor((b.cosmos||0)/5));
  seMerStar();
  addText(b.x,b.y-b.r-96,'赠予夜的晨星',MER_COLOR);
  burst(b.x,b.y,MER_COLOR,30);
  shake=Math.max(shake,9);
  // 【贝丽尔】：环状水星释放【赠予夜的晨星】＝叠满进入强化 → 所有敌人 +4 层【光晕】
  berylUpgradeFull(b);
  // 场地中央出现迪斯科灯球，照亮全场，结算完伤害后消失
  merBalls.push({x:(L+R)/2,y:(T+B)/2,t:MER_BALL_DUR,dur:MER_BALL_DUR,seed:Math.random()*6.283});
  for(const f of foesOf(b)){
    if(f.hp<=0) continue;
    const d=Math.max(1,Math.min(dmgBase,Math.round(f.hp*0.25)));
    applyDamage(f,d,MER_COLOR,b);
    // 正式版削弱：不再击退到墙边（merKnockToWall 保留但已无人调用）
  }
}
// 【漫游迪斯科】：每10秒虚化5秒
function merTick(b,dt){
  // 【环状家族】内置冷却（正式版削弱），放在虚化 return 之前，虚化期间也照常走
  b.merRingCd=Math.max(0,(b.merRingCd||0)-dt);
  if((b.merDiscoT||0)>0){
    b.merDiscoT=Math.max(0,b.merDiscoT-dt);
    if(b.merDiscoT<=0){
      b.merDiscoCd=MER_DISCO_CD-MER_DISCO_DUR;
      addText(b.x,b.y-b.r-40,'迪斯科结束','#a9c0d4');
    }
    return;
  }
  b.merDiscoCd=Math.max(0,(b.merDiscoCd||0)-dt);
  if(b.merDiscoCd<=0){
    b.merDiscoT=MER_DISCO_DUR;
    b.merTrace=Math.min(MER_TRACE_MAX,(b.merTrace||0)+2);
    seMerDisco();
    addText(b.x,b.y-b.r-40,'漫游迪斯科 · 行迹'+(b.merTrace),'#c9a8ff');
    burst(b.x,b.y,'#c9a8ff',20);
  }
}

/* ---- 环状水星特效：迪斯科灯球 / 环状家族 / 漫游迪斯科 ---- */
function drawMerBalls(){
  if(!merBalls.length) return;
  const now=performance.now();
  for(const mb of merBalls){
    const k=1-Math.max(0,mb.t)/mb.dur;
    const fade=k<0.14?(k/0.14):Math.max(0,1-(k-0.14)/0.86);
    const cx=mb.x, cy=mb.y;
    const far=Math.hypot(R-L,B-T)*0.9;
    g.save();
    // 照亮全场：中心白，外圈淡紫，铺满整块场地
    const gl=g.createRadialGradient(cx,cy,8,cx,cy,Math.hypot(R-L,B-T)*0.62);
    gl.addColorStop(0,'rgba(255,255,255,'+(0.30*fade).toFixed(3)+')');
    gl.addColorStop(0.38,'rgba(201,168,255,'+(0.15*fade).toFixed(3)+')');
    gl.addColorStop(1,'rgba(201,168,255,0)');
    g.fillStyle=gl;
    g.fillRect(L-60,T-60,(R-L)+120,(B-T)+120);
    // 旋转的彩色光束
    const rays=10;
    for(let i=0;i<rays;i++){
      const a=now/900+i*(Math.PI*2/rays)+mb.seed;
      const hue=(i*36+now/14)%360;
      g.save();
      g.translate(cx,cy); g.rotate(a);
      const grd=g.createLinearGradient(0,0,far,0);
      grd.addColorStop(0,'hsla('+hue.toFixed(0)+',92%,80%,'+(0.30*fade).toFixed(3)+')');
      grd.addColorStop(1,'hsla('+hue.toFixed(0)+',92%,70%,0)');
      g.fillStyle=grd;
      g.beginPath();
      g.moveTo(0,0); g.lineTo(far,-24); g.lineTo(far,24); g.closePath(); g.fill();
      g.restore();
    }
    // 灯球本体：银白镜面球，表面刻着菱形镜片
    const R0=34*(0.86+0.14*Math.min(1,k*4));
    g.save();
    g.translate(cx,cy);
    g.rotate(now/900);
    const bg=g.createRadialGradient(-11,-13,4,0,0,R0);
    bg.addColorStop(0,'#ffffff');
    bg.addColorStop(0.42,'#ded9ff');
    bg.addColorStop(1,'#6d61a6');
    g.beginPath(); g.arc(0,0,R0,0,7); g.fillStyle=bg; g.fill();
    g.save();
    g.beginPath(); g.arc(0,0,R0,0,7); g.clip();
    g.strokeStyle='rgba(74,62,124,.55)'; g.lineWidth=1.8;
    for(let i=-2;i<=2;i++){
      const y=i*R0*0.34, w=Math.sqrt(Math.max(0,R0*R0-y*y));
      g.beginPath(); g.moveTo(-w,y); g.lineTo(w,y); g.stroke();
    }
    for(let i=-2;i<=2;i++){
      const w=Math.abs(i)*R0*0.46;
      g.beginPath(); g.ellipse(0,0,Math.max(2,w),R0,0,0,7); g.stroke();
    }
    for(let i=0;i<14;i++){
      const aa=mb.seed+i*2.399, rr=R0*(0.25+((i*0.37)%1)*0.62);
      const tw=0.55+0.45*Math.sin(now/160+i*1.7);
      g.globalAlpha=fade*tw;
      g.fillStyle='#ffffff';
      g.beginPath(); g.arc(Math.cos(aa)*rr,Math.sin(aa)*rr,2.1,0,7); g.fill();
    }
    g.restore();
    g.globalAlpha=fade;
    g.shadowColor='#c9a8ff'; g.shadowBlur=30;
    g.strokeStyle='rgba(233,226,255,.9)'; g.lineWidth=2.4;
    g.beginPath(); g.arc(0,0,R0,0,7); g.stroke();
    g.restore();
    g.restore();
  }
}

function drawMerRing(b){
  const t=b.merRingT||0;
  if(t<=0) return;
  const k=1-t/MER_RING_DUR;
  const fade=Math.max(0,1-k);
  const now=performance.now();
  g.save();
  g.strokeStyle=MER_COLOR; g.shadowColor=MER_COLOR; g.shadowBlur=20;
  for(let i=0;i<2;i++){
    const rr=b.r+8+i*10+k*12;
    g.globalAlpha=fade*(0.92-i*0.30);
    g.lineWidth=3-i;
    g.setLineDash([9,7]);
    g.lineDashOffset=-(now/26)*(i?-1:1);
    g.beginPath(); g.arc(b.x,b.y,rr,0,7); g.stroke();
  }
  g.setLineDash([]);
  for(let i=0;i<4;i++){
    const a=now/430+i*Math.PI/2;
    const rr=b.r+14;
    g.globalAlpha=fade*0.95;
    g.fillStyle=MER_COLOR;
    g.beginPath(); g.arc(b.x+Math.cos(a)*rr,b.y+Math.sin(a)*rr,2.8,0,7); g.fill();
  }
  g.restore();
}

  seArgusBullet();
  addText(b.x,b.y-b.r-74,'子弹 +'+give+' ('+b.bullets+'/'+ARGUS_BULLET_CAP+')',ARGUS_COLOR);
  burst(b.x,b.y,ARGUS_COLOR,10);
  if(b.bullets>=ARGUS_BULLET_CAP) argusFullShot(b);
}

// 一枪的伤害：总伤害 × 比例，封顶敌人当前生命值的另一个比例
function argusShotDamage(b,t,ratio,hpCap){
  const base=argusTotalOf(b)*ratio+ARGUS_SHOT_FLAT;   // 子弹基础伤害额外 +5
  const cap=t.hp*hpCap;
  return Math.max(1,Math.round(Math.min(base||1,cap)));
}
// 绿色子弹：直线飞行，按目标移动做一次提前量，命中后结算
function argusAimAt(b,t,speed){
  const dist=Math.hypot(t.x-b.x,t.y-b.y);
  const lead=Math.min(0.35,dist/Math.max(1,speed));
  return Math.atan2((t.y+(t.vy||0)*lead)-b.y,(t.x+(t.vx||0)*lead)-b.x);
}
function argusShoot(b,t,dmg,label,opt){
  opt=opt||{};
  if(!b || !t || t.hp<=0 || b.hp<=0) return;
  const sp=opt.speed||ARGUS_BULLET_SPEED;
  const ang=argusAimAt(b,t,sp);
  projs.push({type:'argusBullet',
    x:b.x+Math.cos(ang)*(b.r+10), y:b.y+Math.sin(ang)*(b.r+10),
    vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
    ang:Math.atan2(t.y-b.y,t.x-b.x), dmg:dmg, size:opt.strong?16:11,
    color:ARGUS_BULLET_COLOR, owner:b, target:t, life:2.4,
    label:label||'追击', strong:!!opt.strong,
    knock:opt.knock||0, noCount:!!opt.noCount});
  const mx=b.x+Math.cos(ang)*(b.r+8), my=b.y+Math.sin(ang)*(b.r+8);
  spawnShock(mx,my,ARGUS_BULLET_COLOR,opt.strong?30:22,0.28,2);
}
function argusFire(b,t,dmg,label,opt){
  argusShoot(b,t,dmg,label,opt);
}

// 子弹满 10：立刻对随机一名敌人开枪，视为追击，并清空子弹
function argusFullShot(b){
  b.bullets=0;
  addText(b.x,b.y-b.r-64,'子弹满 10 · 齐射!',ARGUS_COLOR);
  const t=skillFoe(b);
  if(!t) return;
  argusFire(b,t,argusShotDamage(b,t,ARGUS_FULL_RATIO,ARGUS_FULL_HP_CAP),'追击·齐射');
}

// 每追击 4 次进入【百眼巨人】
function argusChaseCount(b){
  if(!b || b.hp<=0) return;
  if((b.giantT||0)>0) return;   // 巨人期间的追击不再累加，避免自己滚起来
  b.chase=(b.chase||0)+1;
  if(b.chase>=ARGUS_GIANT_AFTER) argusGiant(b);
}

function argusGiant(b){
  b.chase=0;
  b.giantT=ARGUS_GIANT_DUR;
  // 其他升阶角色进入强化 → 环状水星【宇宙能量】+5
  merUpgradeBonus(b.team);
  b.giantX=b.x; b.giantY=b.y;
  b.vx=0; b.vy=0;
  // 【贝丽尔】：阿尔古斯进入【百眼巨人】＝叠满进入强化 → 所有敌人 +4 层【光晕】
  berylUpgradeFull(b);
  addText(b.x,b.y-b.r-70,'百眼巨人',ARGUS_COLOR);
  burst(b.x,b.y,ARGUS_COLOR,26);
  shake=Math.max(shake,7);
  argusChase(b);
}

// 【追猎】/【散射】
function argusChase(b){
  const foes=foesOf(b).filter(x=>x.hp>0);
  if(!foes.length) return;
  const scatter=Math.random()<((b.scatterChance)||0);
  if(!scatter){
    // 【嘲讽】优先：锁定的目标从嘲讽者里挑（多个嘲讽者时挑血最少的那个）
    const tkPool=foes.filter(f=>isTaunting(f));
    const pool=tkPool.length?tkPool:foes;
    let t=null;
    for(const f of pool) if(!t || f.hp<t.hp) t=f;
    if(!t) return;
    seArgusChase();
    addText(b.x,b.y-b.r-92,'追猎 · 锁定',ARGUS_COLOR);
    burst(b.x,b.y,ARGUS_COLOR,14);
    b.argusLocks=b.argusLocks||[];
    b.argusLocks.push({target:t,t:ARGUS_LOCK_DUR,dur:ARGUS_LOCK_DUR});
    b.scatterChance=Math.min(1,((b.scatterChance)||0)+ARGUS_SCATTER_STEP);
  }else{
    b.scatterChance=0;
    const per=ARGUS_CHASE_RATIO/foes.length;
    addText(b.x,b.y-b.r-92,'散射',ARGUS_COLOR);
    spawnShock(b.x,b.y,ARGUS_COLOR,Math.hypot(R-L,B-T)+40,0.8,6);
    burst(b.x,b.y,ARGUS_COLOR,24);
    for(const f of foes){
      if(f.hp<=0) continue;
      const dmg=argusShotDamage(b,f,per,ARGUS_CHASE_HP_CAP);
      argusShoot(b,f,dmg,'散射',{speed:ARGUS_CHASE_SPEED,strong:true,knock:ARGUS_KNOCK,noCount:true});
    }
    spiritAction(b);
  }
}

// 每帧：冷却、巨人期间锁位
function argusTick(b,dt){
  b.argusGunCd=Math.max(0,(b.argusGunCd||0)-dt);
  b.argusWallCd=Math.max(0,(b.argusWallCd||0)-dt);
  // 【追猎】眼睛锁定 0.3 秒，锁定完再打强化子弹
  if(b.argusLocks && b.argusLocks.length){
    for(const lk of b.argusLocks){
      lk.t-=dt;
      if(lk.t>0) continue;
      lk.done=true;
      const tg=lk.target;
      if(!tg || tg.hp<=0) continue;
      argusShoot(b,tg,argusShotDamage(b,tg,ARGUS_CHASE_RATIO,ARGUS_CHASE_HP_CAP),
        '追猎',{speed:ARGUS_CHASE_SPEED,strong:true,knock:ARGUS_KNOCK});
    }
    b.argusLocks=b.argusLocks.filter(x=>!x.done);
  }
  if((b.giantT||0)>0){
    b.giantT=Math.max(0,b.giantT-dt);
    b.vx=0; b.vy=0;
    if(b.giantX!=null){ b.x=b.giantX; b.y=b.giantY; }
    if(b.giantT<=0){
      addText(b.x,b.y-b.r-40,'百眼巨人结束','#a9c0d4');
      b.giantX=null; b.giantY=null;
      const dir=Math.random()*Math.PI*2, sp=Math.max(430,b.speedMax*0.62);
      b.vx=Math.cos(dir)*sp; b.vy=Math.sin(dir)*sp;
    }
  }
}

// 阿尔古斯自己打出伤害：累计总伤害，并叠【百眼神迹】+2（子弹本身不再叠，避免自循环滚雪球）
function argusOnDeal(b,dealt){
  if(!b || b.hp<=0) return;
  b.argusTotal=(b.argusTotal||0)+Math.max(0,dealt);
  if(argusDepth>0) return;
  argusAddMark(b,ARGUS_GAIN_DMG);
}

// 队友对敌人造成伤害：阿尔古斯消耗 1 发子弹，对同一敌人开枪（0.35秒内置冷却）
function argusAllyHit(t,src){
  if(!t || !src || argusDepth>0) return;
  if(t.hp<=0 || src.hp<=0) return;
  if(src.skillType==='argus') return;      // 自己开枪不触发自己
  for(const b of balls){
    if(b.skillType!=='argus' || b.hp<=0) continue;
    if(b.team!==src.team || b.team===t.team) continue;
    if((b.bullets||0)<=0) continue;
    if((b.argusGunCd||0)>0) continue;
    if((b.giantT||0)>0) continue;
    b.argusGunCd=ARGUS_GUN_CD;
    b.bullets--;
    argusFire(b,t,argusShotDamage(b,t,ARGUS_SHOT_RATIO,ARGUS_SHOT_HP_CAP),'追击·开枪');
  }
}

/* ---- 马库斯：【标注】/ 阅历累积 / 当海风翻页时 ---- */
function marcusOf(team){ return balls.find(b=>b.team===team && b.hp>0 && b.skillType==='marcus') || null; }
// 【标注】：始终标记敌方当前生命值最高的那一个
function marcusMarkUpdate(b){
  if(!b || b.hp<=0) return;
  const foes=balls.filter(x=>x.team!==b.team && x.hp>0);
  if(!foes.length){ if(b.markFoe) b.markFoe=null; return; }
  let best=foes[0];
  for(const f of foes) if(f.hp>best.hp) best=f;
  // 滞后 3%，避免两个敌人血量胶着时每帧来回改标注
  if(b.markFoe && b.markFoe.hp>0 && b.markFoe.markedBy===b && best.hp<=b.markFoe.hp*1.03) best=b.markFoe;
  if(b.markFoe && b.markFoe!==best && b.markFoe.markedBy===b) b.markFoe.markedBy=null;
  if(b.markFoe!==best){
    b.markFoe=best; best.markedBy=b;
    addText(best.x,best.y-best.r-64,'标注',MARCUS_COLOR);
    burst(best.x,best.y,MARCUS_COLOR,10);
  }else if(best.markedBy!==b) best.markedBy=b;
}
// 【标注】的敌人释放技能时，马库斯累计 3.05 阅历
function marcusOnEnemySkill(caster){
  if(!caster || !caster.markedBy) return;
  const m=caster.markedBy;
  if(m.hp<=0){ caster.markedBy=null; return; }
  m.read=(m.read||0)+MARCUS_MARK_READ;
  addText(m.x,m.y-m.r-58,'阅历 +3.05（标注）',MARCUS_COLOR);
  while(m.read>=MARCUS_READ_MAX){ m.read-=MARCUS_READ_MAX; marcusBeast(m); }
}

function marcusTouch(b){
  if(!b || b.hp<=0 || b.skillType!=='marcus') return;
  if((b.beastT||0)>0) return;              // 变身期间停止累积
  if((b.marcusCd||0)>0) return;
  b.marcusCd=MARCUS_READ_CD;
  b.read=(b.read||0)+MARCUS_READ_COLLIDE;
  if(b.read>=MARCUS_READ_MAX){ b.read-=MARCUS_READ_MAX; marcusBeast(b); }
  else addText(b.x,b.y-b.r-50,'阅历 +3.05',MARCUS_COLOR);
}

function marcusBeast(b){
  if(!b || b.hp<=0) return;
  b.beastT=MARCUS_BEAST_DUR;
  b.beastShots=0; b.beastShotT=0;
  b.marcusBookT=MARCUS_BOOK_DUR;   // 书页翻动图案闪烁
  shake=Math.max(shake,5);
  sePlay('marcus1');   // 马库斯·当海风翻页时
  burst(b.x,b.y,MARCUS_COLOR,18);
  if(Math.random()<MARCUS_HORSE_PCT){
    b.beastKind='horse';
    addText(b.x,b.y-b.r-46,'当海风翻页时·小马',MARCUS_COLOR);
    // 进入小马形态的瞬间给全队一次护盾，整个形态只给这一次
    const sh=Math.round(MARCUS_SHIELD);
    for(const x of balls){
      if(x.team!==b.team || x.hp<=0) continue;
      x.shield=(x.shield||0)+sh;
      addText(x.x,x.y-x.r-34,'盾 +'+sh,'#a9c0d4');
    }
    const cur=Math.hypot(b.vx,b.vy)||1;
    const nsp=Math.max(cur,b.speedMax)*MARCUS_HORSE_SPEED;
    b.vx*=nsp/cur; b.vy*=nsp/cur;
  }else{
    b.beastKind='squirrel';
    b.beastShots=MARCUS_SQ_HITS;
    b.beastShotT=MARCUS_SQ_INTERVAL;
    b.beastMarkT=(b.markFoe && b.markFoe.hp>0)?MARCUS_MARK_EXTRA:-1;   // 额外朝【标注】敌人补一枚松果
    addText(b.x,b.y-b.r-46,'当海风翻页时·松鼠',MARCUS_COLOR);
  }
  // 【贝丽尔】：马库斯化【小马】或【松鼠】＝叠满进入强化 → 所有敌人 +4 层【光晕】
  berylUpgradeFull(b);
  // 其他升阶角色进入强化 → 环状水星【宇宙能量】+5
  merUpgradeBonus(b.team);
}

function marcusBeastEnd(b){
  b.beastKind=null; b.beastShots=0; b.beastShotT=0; b.beastMarkT=-1;
  clampSp(b);                              // 小马结束后速度自动落回原档
  addText(b.x,b.y-b.r-40,'当海风翻页时结束','#a9c0d4');
}

function marcusTick(b,dt){
  marcusMarkUpdate(b);
  if((b.beastT||0)>0){
    b.beastT=Math.max(0,b.beastT-dt);
    // 小马：整个形态期间都维持在305%基础移速，被减速后立刻补回来
    if(b.beastKind==='horse'){
      const cur=Math.hypot(b.vx,b.vy)||1;
      const want=maxSp(b);
      if(cur>1){ b.vx=b.vx/cur*want; b.vy=b.vy/cur*want; }
    }
    if(b.beastKind==='squirrel' && (b.beastShots||0)>0){
      b.beastShotT=(b.beastShotT||0)-dt;
      while(b.beastShotT<=0 && b.beastShots>0){
        b.beastShotT+=MARCUS_SQ_INTERVAL;
        b.beastShots--;
        marcusNutShot(b);
      }
    }
    if(b.beastKind==='squirrel' && (b.beastMarkT||0)>0){
      b.beastMarkT-=dt;
      if(b.beastMarkT<=0){
        const mf=b.markFoe;
        b.beastMarkT=-1;
        if(mf && mf.hp>0) marcusNutShot(b,mf);
      }
    }
    if(b.beastT<=0) marcusBeastEnd(b);
    return;                                // 变身期间不累积阅历
  }
  b.read=(b.read||0)+MARCUS_READ_SEC*dt;
  if(b.read>=MARCUS_READ_MAX){ b.read-=MARCUS_READ_MAX; marcusBeast(b); }
}

function marcusNutShot(b,forced){
  if(!b || b.hp<=0) return;
  const t=(forced && forced.hp>0)?forced:skillFoe(b);
  if(!t) return;
  const ang=Math.atan2(t.y-b.y,t.x-b.x);
  projs.push({type:'nut',
    x:b.x+Math.cos(ang)*(b.r+10), y:b.y+Math.sin(ang)*(b.r+10),
    vx:Math.cos(ang)*MARCUS_NUT_SPEED, vy:Math.sin(ang)*MARCUS_NUT_SPEED,
    ang,dmg:MARCUS_SQ_DMG,size:15,color:MARCUS_NUT_COLOR,owner:b,target:t,life:6,
    homing:true,speed:MARCUS_NUT_SPEED,spin:0});
  addText(b.x,b.y-b.r-40,'松果!',MARCUS_NUT_COLOR);
  burst(b.x,b.y,MARCUS_NUT_COLOR,10);
}

// 小马撞人：额外伤害 + 停止攻击1秒（护盾已在进入形态时给过）
function marcusHorseHit(b,foe){
  applyDamage(foe,MARCUS_HORSE_DMG,MARCUS_COLOR,b,true);
  foe.stunT=Math.max(foe.stunT||0,MARCUS_HORSE_STUN);
  addText(foe.x,foe.y-foe.r-46,'停止攻击 1s','#c9a3ff');
  burst(foe.x,foe.y,MARCUS_COLOR,14);
  shake=Math.max(shake,6);
}

function foesOf(b){ return balls.filter(x=>x.team!==b.team && x.hp>0); }
// 【嘲讽】：优先级最高——敌方任何索敌都先把候选范围缩到嘲讽者
// 场上同时有多个嘲讽者时，再在这几个嘲讽者之间走技能自己的索敌规则（最近 / 随机 / 最低血…）
// 来源：芦草结【一苇之所如】(reedTaunt)；tauntT 是预留的限时嘲讽计时（目前无人设置）
function isTaunting(b){ return !!b && (!!b.reedTaunt || (b.tauntT||0)>0); }
function tauntFoes(owner){
  return balls.filter(b=>b.hp>0 && b.team!==owner.team && isTaunting(b));
}
// 兼容旧接口：只需要一个嘲讽目标时，取最近的嘲讽者
function tauntFoe(owner){
  let best=null,bd=1e9;
  for(const b of tauntFoes(owner)){
    const d=Math.hypot(b.x-owner.x,b.y-owner.y);
    if(d<bd){ bd=d; best=b; }
  }
  return best;
}
// 索敌候选池：有嘲讽者就只从嘲讽者里挑，没有才是全部敌人
function foePoolFor(owner){
  const tk=tauntFoes(owner);
  return tk.length ? tk : foesOf(owner);
}
function skillFoe(owner){
  const pool=foePoolFor(owner);
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function nearestFoe(b){
  let best=null,bd=1e9;
  for(const f of foePoolFor(b)){ const d=Math.hypot(f.x-b.x,f.y-b.y); if(d<bd){bd=d;best=f;} }
  return best;
}
function storyHolds(b){ return stories.some(s=>s.foeTeam===b.team); }


function skillLabel0(b){
  if(!b.skillType) return '';
  if(b.skillType==='deepfish') return '米饭 '+Math.ceil(b.riceCd)+'s';
  if(b.skillType==='s37') return '灵光 '+(b.spirit||0)+'/'+SPIRIT_MAX;
  if(b.skillType==='lilya') return b.dashPhase==='dash'?'冲刺!':(b.dashPhase==='back'?'后撤':'红弩箭就位');
  if(b.skillType==='sotheby') return '药瓶 '+Math.ceil(b.potionCd)+'s'+(b.healT>0?' · 愈合':'悬');
  if(b.skillType==='joe'){
    const q=shieldPoolOf(b.team);
    return ((b.shield||0)>0?('盾'+Math.round(b.shield)+' · '):'')+'补盾 '+q.left+'/'+TEAM_SHIELD_TIMES+' · '+Math.ceil(q.win)+'s';
  }
  if(b.skillType==='babel') return '盾'+Math.round(b.shield)+' · 补盾 '+shieldPoolOf(b.team).left+'/'+TEAM_SHIELD_TIMES+' · '+Math.ceil(shieldPoolOf(b.team).win)+'s'
    +(b.loyal?' · 忠诚伙伴':((b.honor||0)>0?(' · 护主'+(b.honor||0)+'/'+BABEL_HONOR_MAX):''))
    +((b.tauntT||0)>0?(' · 嘲讽'+Math.ceil(b.tauntT)+'s'):'');
  if(b.skillType==='tuesday'){
    const s=stories.find(x=>x.kind==='story' && x.owner.team===b.team);
    return s?('故事会 '+Math.ceil(s.time)+'s'):('激情 '+b.passion+'/'+PASSION_LAN);
  }
  if(b.skillType==='reed'){
    if(b.reedMode==='hui') return '惠姑 '+Math.ceil(b.reedT)+'s';
    if(b.reedMode==='seed') return '种子 '+Math.ceil(b.reedT)+'s';
    if(b.reedGrace) return b.reedTaunt?'一苇之所如 · 嘲讽':'一苇之所如';
    return '芦草结';
  }
  if(b.skillType==='sentinel') return b.snipeLeft>0?('惊惧子弹 '+b.snipeLeft+'/'+SNIPE_MAG):('装弹 '+Math.ceil(b.snipeCd)+'s · '+Math.min(SNIPE_SKIP_XUE,b.reloadXue||0)+'/'+SNIPE_SKIP_XUE);
  if(b.skillType==='twins'){
    const o=balls.find(x=>x!==b && x.skillType==='twins' && x.team===b.team && x.hp>0);
    const sum=(b.tune||0)+(o?(o.tune||0):0);
    return '同调'+Math.round(b.tune||0)+' · 合计'+Math.round(sum)+'/'+TUNE_MAX+' · 攻'+Math.round(b.atk);
  }
  if(b.skillType==='twinsM') return '合体 · 攻'+b.atk;
  if(b.skillType==='cornerstone') return '试错'+b.trial+' · 升版'+b.layer;
  if(b.skillType==='liangyue') return '激情'+b.passion+'/'+PASSION_LIANG+(b.strongT>0?(' · 强梁'+Math.ceil(b.strongT)+'s'):'')+' · 爪'+b.claw+'/'+(b.shenxing>0?Math.max(1,b.clawNeed-1):b.clawNeed)+(b.shenxing>0?' · 神行':'')
  if(b.skillType==='qiangliang') return '强梁 · 独立血条';
  if(b.skillType==='marcus'){
    if((b.beastT||0)>0) return (b.beastKind==='horse'?'小马 ':'松鼠 ')+b.beastT.toFixed(1)+'s';
    return '阅历 '+(b.read||0).toFixed(1)+'/'+MARCUS_READ_MAX;
  }
  if(b.skillType==='mercuria'){
    if((b.merDiscoT||0)>0) return '虚化 '+b.merDiscoT.toFixed(1)+'s · 能量'+Math.floor(b.cosmos||0);
    return '宇宙能量 '+Math.floor(b.cosmos||0)+'/'+MER_BIG;
  }
  if(b.skillType==='argus'){
    if((b.giantT||0)>0) return '百眼巨人 '+b.giantT.toFixed(1)+'s';

// 队伍显示名：战斗中为队伍名加括号，括号内为该队出现最多的【特色标签】
let teamTraitCache={};
function teamTraitLabel(t){
  const cnt={};
  for(const b of balls){
    if(b.team!==t) continue;
    const tr=b.trait;
    if(!tr || tr==='无') continue;
    cnt[tr]=(cnt[tr]||0)+1;
  }
  const keys=Object.keys(cnt);
  if(!keys.length) return '';
  let max=0;
  for(const k of keys) if(cnt[k]>max) max=cnt[k];
  const top=keys.filter(k=>cnt[k]===max);
  // 起名时不带【】括号，直接取特色标签名加“队”
  return top[Math.floor(Math.random()*top.length)]+'队';
}
function teamName(t){
  const base=(TEAMS[t]&&TEAMS[t].name)||('队伍'+(t+1));
  if(state!=='fight') return base;
  if(teamTraitCache[t]==null) teamTraitCache[t]=teamTraitLabel(t);
  const lab=teamTraitCache[t];
  return lab?(base+'（'+lab+'）'):base;
}

function ensurePicks(){
  const defs=['deepfish','red','deepfish','lilya'];
  picks=picks.slice(0,teamCount);
  while(picks.length<teamCount) picks.push([]);
  for(let i=0;i<picks.length;i++){
    // 队内去重：同一名角色只能上一次场（鱼鱼号、红球、无角色除外）
    const seen=new Set();
    picks[i]=picks[i].filter(k=>{
      if(k==='deepfish'||k==='red'||k==='none') return true;
      if(seen.has(k)) return false;
      seen.add(k); return true;
    }).slice(0,perTeam);
    // 空位一律用【无角色】占位，实际不上场
    while(picks[i].length<perTeam){
      picks[i].push('none');
    }
  }
}

// 一个角色位可以是单个球，也可以是双生舞伶拆出来的两个
function spawnEntry(key,x,y,team){
  if(key==='twins'){
    const twL=makeBall('twins',x-50,y,team,{sub:'L',name:'左伶',en:'The Left',color:'#ffc53d',passion:0,hp:TWIN_HP,maxhp:TWIN_HP,element:'岩'});
    const twR=makeBall('twins',x+50,y,team,{sub:'R',name:'右伶',en:'The Right',color:'#4a9dff',passion:0,hp:TWIN_HP,maxhp:TWIN_HP,element:'星'});
    twR.id=twL.id;   // 【左伶】【右伶】共享同一个角色编号
    balls.push(twL); balls.push(twR);
  }else if(key==='cornerstone'){
    const b=makeBall(key,x,y,team);
    b.trial=CORNER_TRIAL_INIT;
    b.feasible=true;
    balls.push(b);
  }else if(key==='reed'){
    const b=makeBall(key,x,y,team);
    b.reedBaseMax=b.maxhp;
    reedFormHui(b,true);
    balls.push(b);
  }else if(key==='everecho'){
    const b=makeBall(key,x,y,team);
    b.tune=ECHO_TUNE_ON; b.echoShT=[]; b.yu=0;
    balls.push(b);
    for(const x of balls){ if(x.team===team && x.hp>0) x.song=true; }
  }else if(key==='flutterpage'){
    const b=makeBall(key,x,y,team);
    b.windT=[];
    paperWindAdd(b,PAPER_WIND_ON);
    b.paperT=[PAPER_T6,PAPER_T5,PAPER_T4];
    b.paperBoost=0; b.paperBoostT=0;
    balls.push(b);
  }else if(key==='matilda'){
    const b=makeBall(key,x,y,team);
    b.matildaCd=MATILDA_ORB_CD*0.4;   // 入场稍等一下就开第一次占卜
    balls.push(b);
  }else if(key==='nautika'){
    const b=makeBall(key,x,y,team);
    b.nodeHurt=0;
    balls.push(b);
  }else if(key==='liangyue'){
    balls.push(makeBall(key,x,y,team,{passion:5}));
  }else if(key==='rhiannon'){
    balls.push(makeBall(key,x,y,team,{passion:5}));
  }else if(key==='babel'){
    const b=makeBall(key,x,y,team);
    // 入场时为全体角色叠加10点护盾（上限30）
    for(const x2 of balls){
      if(x2.team===team && x2.hp>0){
        x2.shield=Math.min(BABEL_SHIELD_MAX,(x2.shield||0)+BABEL_RECOVER);
        hitFx(x2.x,x2.y,BABEL_COLOR,'shield');
        burst(x2.x,x2.y,BABEL_COLOR,7);
      }
    }
    b.shield=Math.min(BABEL_SHIELD_MAX,(b.shield||0)+BABEL_RECOVER);
    seBabelShield();
    b.babelLeft=BABEL_REC_PER; b.babelWin=BABEL_WINDOW;
    balls.push(b);
  }else{
    balls.push(makeBall(key,x,y,team));
  }
  if(key==='corvus') sePlay('enter');
  if(key==='s37') se37Enter();
}

function startFight(){
  tipHide();
  ensurePicks();
  window.__voiceWarmAll&&window.__voiceWarmAll([].concat.apply([],picks));   // 开打前再兜一次
  voiceReset();   // 每局重新允许每条语音播一次
  // 全填【无角色】就没得打了，先拦一下
  // 任一队伍没有除【无角色】以外的角色，就无法开打
  const fighting=picks.slice(0,teamCount).filter(p=>p.some(k=>k!=='none'));
  if(fighting.length<teamCount){ alert('每支队伍都要至少上场一名角色（【无角色】不算）才能开始对决'); return; }
  resetElec();
  resetXue();
  resetGuang();
  resetShuju();
  resetShieldPool();
  merBalls=[];
  applyField();
  balls=[];
  const cx=(L+R)/2, cy=(T+B)/2;
  const anchors=[
    {x:L+155,y:cy,px:0,py:1},
    {x:R-155,y:cy,px:0,py:1},
    {x:cx,y:T+155,px:1,py:0},
    {x:cx,y:B-155,px:1,py:0}
  ];
  for(let t=0;t<teamCount;t++){
    const a=anchors[t%4];
    // 【无角色】不上场，直接跳过；剩下的按实际人数重新排布
    const valid=picks[t].filter(k=>k!=='none');
    const n=valid.length;
    for(let s=0;s<n;s++){
      const off=(s-(n-1)/2)*118;
      spawnEntry(valid[s],a.x+a.px*off,a.y+a.py*off,t);
    }
  }
  // 苏芙比入场：赋予己方全体【愈合】
  for(const b of balls){
    if(b.hp>0 && b.skillType==='sotheby'){
      for(const x of balls){ if(x.team===b.team && x.hp>0) healApply(x); }
      break;
    }
  }
  particles=[];texts=[];projs=[];stories=[];rices=[];rings=[];poppies=[];rails=[];trains=[];shocks=[];bolts=[];heals=[];hits=[];over=null;shake=0;
  skipMode=false;
  skipStartT=0;
  window.__skipQuiet=false;
  gameSpeed=1;
  fishFlashT=0;
  SE_SEME_T={zhen:0,dash:0};
  teamTraitCache={};
  // 塞梅尔维斯入场即布设【血红之域】
  for(let t=0;t<teamCount;t++) if(teamHasSeme(t)) semeDomain(t);
  state='fight';
  selScrollSave();
  document.getElementById('select').classList.add('hide');
  document.getElementById('tip').textContent='点一下画面重新开一局 · 小球只会被撞着走';
  document.getElementById('tip').style.display = (document.documentElement.getAttribute('data-device')==='mobile')?'none':'block';
  buildHud();
  hud();
  keepAwake(true);
}

/* 【降噪A】同源合并：同一角色位置、0.6秒内、同文案不再新增一条，
   而是刷新时长并把次数显示为「文案 ×N」，信息不丢、字不叠 */
const TEXT_MERGE_MS=600, TEXT_MERGE_RX=36, TEXT_MERGE_RY=48;
function addText(x,y,s,c,size){
  const now=performance.now();
  const base=String(s);
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i];
    if(!t || t.base!==base || t.c!==c) continue;
    if(Math.abs(t.ox-x)>TEXT_MERGE_RX || Math.abs(t.oy-y)>TEXT_MERGE_RY) continue;
    if(now-t.t0>TEXT_MERGE_MS) continue;
    t.cnt=(t.cnt||1)+1;
    t.s=t.cnt>1 ? base+' ×'+t.cnt : base;
    t.x=x; t.y=y; t.ox=x; t.oy=y;
    t.life=1; t.vy=-46; t.t0=now;
    return;
  }
  texts.push({x,y,s:base,c,size:size||0,life:1,vy:-46,ox:x,oy:y,base,cnt:1,t0:now});
}
function burst(x,y,c,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*260;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,c,r:1+Math.random()*3});
  }
}

/* ---- 37【洞知】：数字世界与灵光 ---- */
function spiritAdd(b,n){
  if(!b || b.hp<=0) return;
  const cur=b.spirit||0;
  const add=Math.min(Math.max(0,n),Math.max(0,SPIRIT_MAX-cur));
  if(add>0){ b.spirit=cur+add; addText(b.x,b.y-b.r-58,'灵光 +'+add,SPIRIT_COLOR); }
}
// 己方角色（除自己）释放技能后，持有灵光者各 +1
function spiritTeamSkill(caster){
  if(!caster) return;
  for(const b of balls){
    if(b.hp<=0 || b===caster) continue;
    if(b.team!==caster.team) continue;
    if(b.skillType==='s37') spiritAdd(b,1);
  }
  // 【风速】：己方角色每次释放技能后 +1 层
  paperOnCast(caster);
  // 【标注】：被标注的敌人每次释放技能，马库斯累计 3.05 阅历
  marcusOnEnemySkill(caster);
}
// 己方发动【额外行动】（【追击】或【反击】）时，同队持有灵光者再额外 +1（自己打出去的那次不给自己补）
function spiritAction(caster,isCounter){
  if(!caster) return;
  // 【贝丽尔】：这次【追击】的命中窗口，命中敌人后叠【光晕】
  caster.chaseT=0.6;
  // 【可行性推演】：额外行动附加【试错记录】50%，本次为【反击】再加50%
  if(caster.feasible && (caster.trial||0)>0){
    let add=Math.floor((caster.trial||0)*0.5);
    if(isCounter) add+=Math.floor((caster.trial||0)*0.5);
    if(add>0){ caster.feasBoost=add; caster.feasBoostT=CORNER_FEAS_DUR;
      addText(caster.x,caster.y-caster.r-70,'推演 +'+add,'#c9a227'); }
  }
  for(const b of balls){
    if(b.hp<=0 || b===caster) continue;
    if(b.team!==caster.team) continue;
    if(b.skillType==='s37') spiritAdd(b,1);
  }
  // 【设计升版】：己方每发动一次【额外行动】，全队的奠基石各 +1 层；本次是【反击】再额外 +1
  cornerOnExtra(caster,!!isCounter);
  // 【风速】额外层数 + 三个形态的额外行动加伤
  paperOnExtra(caster,!!isCounter);
}
// 【设计升版】只在【额外行动】时获得，不再随时间自动叠
// 【可行性推演】：场上有奠基石时，己方全体都带【试错记录】
function cornerFeasTick(team){
  let has=false;
  for(const b of balls){ if(b.team===team && b.hp>0 && b.skillType==='cornerstone'){ has=true; break; } }
  if(!has) return;
  for(const b of balls){
    if(b.team!==team || b.hp<=0) continue;
    if(!b.feasible){ b.feasible=true; b.trial=(b.trial||0); }
  }
}
function cornerOnExtra(caster,isCounter){
  if(!caster) return;
  const add=isCounter?2:1;
  for(const b of balls){
    if(b.hp<=0 || b.skillType!=='cornerstone') continue;
    if(b.team!==caster.team) continue;
    if((b.layer||0)>=CORNER_LAYER_MAX) continue;
    b.layer=Math.min(CORNER_LAYER_MAX,(b.layer||0)+add);
    sePlay('corner3');
    addText(b.x,b.y-b.r-46,'设计 +'+add+'层','#c9a227');
  }
}

// 三角：直线飞行，撞墙弹射最多3次，碰到敌人就结算伤害后消失
function updateTri(pr,dt){
  pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt;
  const pad=pr.size*0.30;
  let bounced=false;
  if(pr.x-L<pad){ pr.x=L+pad; pr.vx=Math.abs(pr.vx); bounced=true; }
  if(R-pr.x<pad){ pr.x=R-pad; pr.vx=-Math.abs(pr.vx); bounced=true; }
  if(pr.y-T<pad){ pr.y=T+pad; pr.vy=Math.abs(pr.vy); bounced=true; }
  if(B-pr.y<pad){ pr.y=B-pad; pr.vy=-Math.abs(pr.vy); bounced=true; }
  if(bounced){
    pr.ang=Math.atan2(pr.vy,pr.vx);
    pr.bounces-=1;
    // 弹射次数用尽：放大旋转一圈
    if(pr.bounces<0){ triBurst(pr); return; }
  }
  // 飞行满 6 秒：同样放大旋转一圈
  if(pr.life<=0){ triBurst(pr); return; }
  for(const t of balls){
    if(t.hp<=0 || t.team===pr.owner.team) continue;
    if(Math.hypot(t.x-pr.x,t.y-pr.y)<t.r+pad){
      // 命中敌人：原地放大、快速旋转一圈，结算半径 800 的回旋伤害
      triBurst(pr);
      return;
    }
  }
}

// 【三角·回旋】：三角放大旋转一圈，对半径 800 内所有敌人造成 30 点伤害
function triBurst(pr){
  if(!pr || pr.burst) return;
  pr.burst=true;
  const owner=pr.owner;
  triBursts.push({x:pr.x,y:pr.y,color:pr.color,t:0,life:TRI_SPIN});
  addText(pr.x,pr.y-46,'三角·回旋!',pr.color);
  burst(pr.x,pr.y,pr.color,26);
  shake=Math.max(shake,8);
  for(const t of balls){
    if(t.hp<=0 || !owner || t.team===owner.team) continue;
    if(Math.hypot(t.x-pr.x,t.y-pr.y)>TRI_BURST_R) continue;
    applyDamage(t,TRI_BURST_DMG,pr.color,owner);
    // 回旋命中反馈与三角直接命中完全一致：同样的飘字、命中特效、命中点爆点和震屏
    addText(t.x,t.y-t.r-34,'三角 '+LRv(TRI_BURST_DMG),pr.color);
    hitFx(t.x,t.y,pr.color,'tri',true);
    burst(t.x,t.y,pr.color,16);
    shake=Math.max(shake,5);
  }
  pr.life=0;
}

function updateTriBursts(dt){
  for(const b of triBursts) b.t+=dt;
  triBursts=triBursts.filter(b=>b.t<b.life);
}

function drawTriBursts(){
  for(const b of triBursts){
    const u=Math.max(0,Math.min(1,b.t/b.life));
    const e=1-Math.pow(1-u,2);
    const alpha=Math.max(0,1-u);
    g.save();
    g.translate(b.x,b.y);
    g.rotate(u*Math.PI*2);
    const r=TRI_SIZE*(1+1.5*e);
    g.globalAlpha=alpha*0.9;
    g.shadowColor=b.color; g.shadowBlur=30;
    g.strokeStyle=b.color; g.lineWidth=6;
    g.beginPath();
    for(let i=0;i<3;i++){
      const a=-Math.PI/2+i*Math.PI*2/3;
      const px=Math.cos(a)*r, py=Math.sin(a)*r;
      if(i) g.lineTo(px,py); else g.moveTo(px,py);
    }
    g.closePath(); g.stroke();
    g.globalAlpha=alpha*0.22;
    g.fillStyle=b.color; g.fill();
    g.restore();
    g.save();
    g.globalAlpha=alpha*0.34;
    g.strokeStyle=b.color; g.lineWidth=4;
    g.shadowColor=b.color; g.shadowBlur=18;
    g.beginPath(); g.arc(b.x,b.y,TRI_BURST_R*e,0,Math.PI*2); g.stroke();
    g.restore();
  }
}

let jHeatDepth=0;
// J【高温回火】：拥有护盾时受到碰撞，对碰撞来源和随机一名角色反击
function jHighHeat(owner,src){
  if(!owner || owner.hp<=0 || jHeatDepth>3) return;
  const foes=balls.filter(x=>x.team!==owner.team && x.hp>0);
  if(!foes.length) return;
  const targets=[];
  if(src && src.hp>0 && src.team!==owner.team) targets.push(src);
  const pool=foes.filter(x=>targets.indexOf(x)<0);
  if(pool.length) targets.push(pool[Math.floor(Math.random()*pool.length)]);
  if(!targets.length) return;
  const d=Math.max(1,Math.round(owner.atk*dmgMul(owner)+Math.floor((owner.burn||0)/5)));
  addText(owner.x,owner.y-owner.r-28,'高温回火!','#ff7a4c');
  spiritAction(owner,true);   // 【反击】
  jHeatDepth++;
  for(const t of targets){
    // 改成射出一道红色剑气飞过去，命中那一刻再结算伤害与燃烧
    const ang=Math.atan2(t.y-owner.y,t.x-owner.x);
    projs.push({type:'sword',
      x:owner.x+Math.cos(ang)*(owner.r+10), y:owner.y+Math.sin(ang)*(owner.r+10),
      vx:Math.cos(ang)*SWORD_SPEED, vy:Math.sin(ang)*SWORD_SPEED,
      ang,dmg:d,size:34,color:'#ff7a4c',owner,target:t,life:1.8,
      homing:true,speed:SWORD_SPEED,label:'高温回火',burnAdd:3,delay:0.5});
  }
  jHeatDepth--;
  // 自己赋予敌方燃烧后，获得等量燃烧（不计入聚光盏）
  addBurn(owner,3*targets.length,null);
  burst(owner.x,owner.y,'#ff7a4c',14);
}
// J：碰撞后为己方全体叠护盾（10秒窗口内最多两次，上限30）
// J 自己额外获得「每5层燃烧+1」，队友只吃基础 7 点
function jOnCollide(b){
  if(!b || b.hp<=0) return;
  const pool=shieldPoolOf(b.team);
  if(pool.left<=0) return;
  let any=false;
  for(const x of balls){
    if(x.team!==b.team || x.hp<=0) continue;
    const want=SHIELD_GAIN+Math.floor((b.burn||0)/5);   // 队友与 J 等量，燃烧加成也一起算
    const g=Math.min(SHIELD_MAX-(x.shield||0), want);
    if(g<=0) continue;
    x.shield=(x.shield||0)+g;
    any=true;
    addText(x.x,x.y-x.r-30,(x===b?'护盾 +':'盾+')+g,'#ff97a2');
    burst(x.x,x.y,'#ff97a2',x===b?8:5);
  }
  if(!any) return;
  pool.left=Math.max(0,pool.left-1);
  spiritTeamSkill(b);
  seJShield();
}

function bounceBeam(pr,nx,ny){
  const dot=pr.vx*nx+pr.vy*ny;
  pr.vx-=2*dot*nx; pr.vy-=2*dot*ny;
  pr.ang=Math.atan2(pr.vy,pr.vx);
  pr.bounces++;
  if(pr.bounces>=APPLE_BOUNCE) pr.life=0;
}

function updateBeam(pr,dt){
  pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt;
  pr.ang=Math.atan2(pr.vy,pr.vx);
  if(pr.x<L){ pr.x=L; bounceBeam(pr,1,0); }
  else if(pr.x>R){ pr.x=R; bounceBeam(pr,-1,0); }
  if(pr.y<T){ pr.y=T; bounceBeam(pr,0,1); }
  else if(pr.y>B){ pr.y=B; bounceBeam(pr,0,-1); }
  if(pr.life<=0) return;
  for(const b of balls){
    if(b.hp<=0) continue;
    if(pr.hitSet.has(b)) continue;
    const d=Math.hypot(b.x-pr.x,b.y-pr.y);
    if(d>b.r+8) continue;
    pr.hitSet.add(b);
    if(b.team!==pr.owner.team){
      applyDamage(b,APPLE_DMG,APPLE_COLOR,pr.owner);
      addText(b.x,b.y-b.r-30,'-'+APPLE_DMG,APPLE_COLOR);
      burst(pr.x,pr.y,APPLE_COLOR,12);
      hitFx(b.x,b.y,APPLE_COLOR,'beam');
      shake=Math.max(shake,4);
    }else{
      const heal=Math.min(APPLE_HEAL+healBonus(b),b.maxhp-b.hp);
      b.hp+=heal;
      addText(b.x,b.y-b.r-30,'+'+heal,'#6be585');
      if(heal>0) healFx(b.x,b.y,heal,'beam');
      burst(pr.x,pr.y,'#6be585',10);
    }
    const nx=(pr.x-b.x)/(d||1), ny=(pr.y-b.y)/(d||1);
    pr.x=b.x+nx*(b.r+9); pr.y=b.y+ny*(b.r+9);
    bounceBeam(pr,nx,ny);
    if(pr.life<=0) break;
  }
}

function dealDamage(t,dmg){
  // 【肥鸟尘酿鹰】不会受到伤害
  if(t && t.skillType==='birdie') return 0;
  dmg=Math.round(dmg);
  if(dmg<=0) return 0;
  if(t.skillType==='reed'){
    // 【种子】：埋在地下，不受伤害
    if(t.reedMode==='seed') return 0;
    const wasHui=(t.reedMode==='hui');
    if(t.reedMode==='reed' && t.reedGrace){
      // 【一苇之所如】：单次受到的最大伤害不超过 25
      if(dmg>REED_MAX_HIT) dmg=REED_MAX_HIT;
      // 血量小于等于 100 时，每次受伤 10% 失去【一苇之所如】
      if(t.hp<=REED_LOSE_HP && Math.random()<REED_LOSE_CHANCE){
        reedLoseGrace(t);
      }
    }
    // 【惠姑】被打死：转入【种子】，不算真的死亡
    if(wasHui && t.hp-dmg<=0){
      reedToSeed(t);
      return 0;
    }
  }
  // 【余念】：受到致命伤害后保留 1 血，多余的伤害由【余念】承受
  if(t.hp-dmg<=0 && (t.yu||0)>0){
    const over=dmg-(t.hp-1);
    if(over>0){
      if(t.yu>=over){
        t.yu-=over;
        dmg=t.hp-1;
        addText(t.x,t.y-t.r-56,'余念 -'+Math.round(over),ECHO_COLOR);
      }else{
        dmg-=t.yu;
        addText(t.x,t.y-t.r-56,'余念耗尽',ECHO_COLOR);
        t.yu=0;
      }
      burst(t.x,t.y,ECHO_COLOR,18);
    }
  }
  // 珐琅眼：技能重做后不再有【皇女神威】复活，走【术具】体系
  // 【野树莓一世的恩典】：致命伤害后恢复自身最大生命的15%，每人限一次
  if(t.hp-dmg<=0 && !t.graceUsed && teamHasBerry(t.team)){
    t.graceUsed=true;
    const back=Math.max(1,Math.round(t.maxhp*BERRY_GRACE));
    t.hp=back; t.flash=1;
    t.shadowT=MARK_DUR*1.6;   // 被保下来的人闪一圈影子图案
    t.berryGraceT=BERRY_INVUL;  // 恩典护体：无敌 + 停顿 0.5 秒
    t.flash=1;
    const br=berryOf(t.team);
    if(br) br.shadowT=MARK_DUR;
    heapShadowRing(t);
    addText(t.x,t.y-t.r-34,'野树莓一世的恩典',BERRY_COLOR);
    burst(t.x,t.y,BERRY_COLOR,22);
    shake=Math.max(shake,5);
    return 0;
  }
  // 【漫游行迹】：队里有环状水星且还有层数，致命伤害改成回 30 血 + 虚化 1.5 秒
  if(t.hp-dmg<=0){
    const mo=balls.find(x=>x.team===t.team && x.hp>0 && x.skillType==='mercuria' && (x.merTrace||0)>0);
    if(mo){
      mo.merTrace-=1;
      t.hp=MER_TRACE_HP; t.flash=1;
      t.merTraceT=MER_TRACE_DUR;
      addText(t.x,t.y-t.r-34,'漫游行迹','#c9a8ff');
      burst(t.x,t.y,MER_COLOR,22);
      shake=Math.max(shake,5);
      return 0;
    }
  }
  t.hp-=dmg; t.flash=1;
  t.lostHp=(t.lostHp||0)+dmg;   // 自己损失的生命，血红之域按人计算治疗加成
  const __xueGot=addXue(t.team,dmg);   // 【薪血】按实际掉血累计，余数保留
  // 【玛丽安娜】装弹期间自身靠扣血累计到 3 点【薪血】，立即跳过装弹
  if(t.skillType==='sentinel' && t.snipeLeft===0 && __xueGot>0 && t.hp>0){
    t.reloadXue=(t.reloadXue||0)+__xueGot;
    if(t.reloadXue>=SNIPE_SKIP_XUE){
      t.reloadXue=0;
      t.snipeLeft=SNIPE_MAG;
      t.snipeCd=SNIPE_CD;
      addText(t.x,t.y-t.r-48,'装弹跳过','#ffe9a8');
      burst(t.x,t.y,SNIPE_COLOR,14);
    }
  }
  // 【诺谛卡】自身每受伤两次：己方【薪血】+1（额外掉血已移除）
  if(t.skillType==='nautika' && t.hp>0){
    t.nodeHurt=(t.nodeHurt||0)+1;
    if(t.nodeHurt>=2){
      t.nodeHurt=0;
      xueGain(t.team,1);
      addText(t.x,t.y-t.r-52,'受伤两次 · 薪血+1',NODICA_COLOR);
    }
  }
  return dmg;
}

// 【统一伤害显示】：applyDamage 内部扣掉护盾/减伤/加成后，把真正掉的血记下来
// 外围所有飘字都用 LRv() 取值，保证显示的是吃到 BUFF 之后的结果
function LRv(fb){
  return (typeof window.__LR==='number' && window.__LR>=0) ? window.__LR : fb;
}
function applyDamage(t,dmg,color,src,collide,noSeme){
  // 【肥鸟尘酿鹰】不会受到伤害：打到鹰身上的伤害直接无效
  if(t && t.skillType==='birdie') return;
  // 【漫游迪斯科】完全虚化：免疫伤害
  if(t && ((t.merDiscoT||0)>0 || (t.merTraceT||0)>0)) return;
  // 【百眼巨人】正式版：免疫和减伤都去掉了，巨人期间站桩吃全额伤害
  // 【种子】：埋在地下，不受伤害也不结算
  if(t && t.skillType==='reed' && t.reedMode==='seed') return;
  if(t.hp<=0) return;
  // 【野树莓一世的恩典】护体：0.5 秒内免疫一切伤害
  if((t.berryGraceT||0)>0) return;
  // 【术具】同调值满 100：改由轮到自身编号发动【术具咒语】时判定，不再由受伤触发
  // 【隐身】：免疫接下来受到的 2 次伤害
  if(src && src.team!==t.team && dmg>0 && (t.hideHit||0)>0){
    t.hideHit--;
    addText(t.x,t.y-t.r-34,'隐身·免疫','#c9b6ff');
    burst(t.x,t.y,'#c9b6ff',16);
    return;
  }
  // 【躁动的心】：每次受伤 10% 完全免疫
  if(src && src.team!==t.team && dmg>0 && t.heart && Math.random()<0.1){
    seRegImmune();
    addText(t.x,t.y-t.r-34,'躁动的心·免疫','#ff9fe0');
    burst(t.x,t.y,'#ff9fe0',16);
    return;
  }
  const hurtIn=dmg>0;
  let dealt=0;
  // 【百眼神迹】：每层令自身下一次伤害 +1，可叠加，打出去一次就清零重新累计
  if(src && src.skillType==='argus' && dmg>0 && (src.marks||0)>0){
    const add=Math.round(src.marks);
    dmg+=add;
    addText(src.x,src.y-src.r-64,'神迹 +'+add+' 伤害',ARGUS_COLOR);
    src.marks=0;
  }
  // 【肥鸟尘酿鹰】在场：己方造成的伤害 +2（改成加伤，不再加基础攻击）
  if(src && src.team!==t.team && dmg>0 && teamHasEagle(src.team)) dmg+=EAGLE_DMG_ADD;
  // 【纸片游行】【床单波浪】【告别大地】：额外行动那一下的伤害加成
  if(src && src.team!==t.team && !collide && dmg>0 && (src.paperBoostT||0)>0 && (src.paperBoost||0)>0) dmg+=src.paperBoost;
  // 【可行性推演】：额外行动/反击那一下的伤害加成
  if(src && src.team!==t.team && !collide && dmg>0 && (src.feasBoostT||0)>0 && (src.feasBoost||0)>0) dmg+=src.feasBoost;
  // 【上层折射】：技能命中 +1 层【光晕】，额外行动再 +1，【余辉】角色再 +1
  if(src && src.team!==t.team && !collide && dmg>0){
    const by=berylOf(src.team);
    if(by){
      let hn=BERYL_HALO_CHASE;
      if((src.chaseT||0)>0) hn+=1;
      if((src.trait||'')==='余辉') hn+=1;
      addHalo(t,hn,by);
    }
  }
  // 【空军】：免疫下一次的非碰撞伤害，触发后消耗一层（上限3层）
  if(t.skillType==='cheng' && !collide && dmg>0 && (t.aikong||0)>0){
    t.aikong--;
    addText(t.x,t.y-t.r-34,'空军·免疫!',FISH_COLOR);
    burst(t.x,t.y,FISH_COLOR,20);
    shake=Math.max(shake,4);
    return;
  }
  // 【血红之域】：己方造成伤害时消耗自身3点生命，本次伤害额外+3（一次技能多次命中只消耗一次）
  if(!noSeme && src && src.hp>SEME_PAY && src.team!==t.team && semeDomainOn(src.team)){
    dmg+=SEME_ADD;
    if((src.semePaid||0)<=0){
      src.semePaid=SEME_PAY_GAP;
      src.hp-=SEME_PAY;
      addText(src.x,src.y+src.r+16,'血红 -'+SEME_PAY,SEME_COLOR);
    }
  }
  // 强梁有独立血条：挨打只扣它自己的血
  const spot=t;
  dmg=Math.round(dmg);
  // 【百眼巨人】正式版：不再减伤，巨人期间就是站桩挨全额伤害
  // 强梁在场时，梁月与强梁减伤一半
  if((spot.skillType==='liangyue'||spot.skillType==='qiangliang') && hasStrong(spot.team) && dmg>0){
    dmg=Math.max(1,Math.round(dmg*0.5));
  }
  // 【血红之域】不再提供受伤减免（已移除）
  // 【试错记录】先吸收：奠基石上限20/单次5，其他带【可行性推演】的上限8/单次2
  if((t.feasible || t.skillType==='cornerstone') && dmg>0){
    const isCorner=(t.skillType==='cornerstone');
    const cap=isCorner?CORNER_TRIAL_CAP:CORNER_TRIAL_CAP_A;
    const lim=isCorner?CORNER_TRIAL_MAX:CORNER_TRIAL_MAX_A;
    const cur=t.trial||0;
    const ab=Math.min(cap,dmg,Math.max(0,lim-cur));
    if(ab>0){ t.trial=cur+ab; dmg-=ab; addText(t.x,t.y-t.r-52,'试错 +'+ab,'#e8c86a'); }
  }
  // 【新巴别塔】护主本能 / 忠诚伙伴：受到的伤害降低
  if(t.skillType==='babel' && dmg>0){
    if(t.loyal){
      dmg=Math.max(1,Math.round(dmg*BABEL_LOYAL_CUT));
    }else{
      dmg=Math.max(1,Math.round(dmg*Math.max(0.6,1-BABEL_HONOR_CUT*(t.honor||0))));
      // 每次受击叠 1 层【护主本能】；叠满 10 层清空并进入【忠诚伙伴】
      t.honor=(t.honor||0)+1;
      if(t.honor>=BABEL_HONOR_MAX){
        t.honor=0; t.loyal=true;
        addText(t.x,t.y-t.r-60,'忠诚伙伴',BABEL_COLOR);
        burst(t.x,t.y,BABEL_COLOR,24);
        shake=Math.max(shake,4);
      }
    }
  }
  // 【新巴别塔】嘲讽期间受到技能伤害 → 獠牙的忠诚
  if(t.skillType==='babel' && !collide && dmg>0 && src && src.team!==t.team &&
     isTaunting(t) && (t.hitCd||0)<=0 && (t.counterCd||0)<=0){
    t.hitCd=0.28; t.counterCd=COUNTER_CD;
    babelBite(t,src);
  }
  // 通用护盾：先扣盾再扣血
  if(t.shield>0){
    const ab=Math.min(t.shield,dmg);
    t.shield-=ab; dmg-=ab;
    addText(t.x,t.y-t.r-34,'盾 -'+ab,'#a9c0d4');
    if(t.skillType==='joe' && src && (t.counterCd||0)<=0){ t.counterCd=COUNTER_CD; jHighHeat(t,src); }
  }
  window.__LR=0;
  if(dmg>0){
    const real=dealDamage(t,dmg);
    dealt=real;
    window.__LR=real;
    if(real>0) addText(spot.x,spot.y-spot.r-8,'-'+real,color);
    // 【告慰之歌】：受到的伤害 100% 转成【余念】
    if(real>0) echoYuGain(t,real);
  }
  // 奠基石改为被动：撞击后主动结算【复盘反馈】
  // 新巴别塔：己方任意角色受击后为全队补盾
  if(t.hp>0){
    const bl=balls.find(x=>x.skillType==='babel' && x.team===t.team && x.hp>0);
    if(bl) babelOnHit(bl,src);
  }
  // 野树莓：己方受击后让影子飞过去治疗
  if(hurtIn && t.hp>0) berryOnHurt(t);
  // 阿尔古斯：自己打出的伤害累计总伤害并叠【百眼神迹】；队友造成伤害则消耗子弹开枪
  if(src && dealt>0 && src!==t && src.team!==t.team){
    if(src.skillType==='argus') argusOnDeal(src,dealt);
    else argusAllyHit(t,src);
  }
}

let babelReflectDepth=0;
function babelOnHit(b,src){

// 【獠牙的忠诚】：碰撞后对伤害来源反击
function babelBite(b,src){
  if(!b || b.hp<=0 || !src || src.hp<=0 || src.team===b.team) return;
  const d=Math.max(1,Math.round(b.atk));
  addText(b.x,b.y-b.r-30,'獠牙的忠诚 '+d,BABEL_COLOR);

  const ang=Math.atan2(src.y-b.y,src.x-b.x);

    x:b.x+Math.cos(ang)*(b.r+14), y:b.y+Math.sin(ang)*(b.r+14),

    ang,dmg:d,size:16,color:BEAST_COLOR,owner:b,target:src,life:2,
