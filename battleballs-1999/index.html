}


// 珐琅眼的旧【皇女神威】点名已随技能重做删掉，改走【术具】体系


// 中毒结算：平时踩一下毒就消耗一层；【惊惧故事会】罩着的一方只掉血不消耗
function storyOnSide(b){ return stories.some(s=>s.foeTeam===b.team); }
function soulTotal(b){ let s=0; for(const x of (b.soul||[])) s+=x.dmg; return s; }
// 【除灵专家】：拉莫纳身上每层让场上【中毒】的结算伤害翻一倍
function expertLayers(team){
  let n=0;
  for(const x of balls){
    if(x.hp<=0 || x.skillType!=='ramona') continue;
    if(team!=null && x.team!==team) continue;
    const c=(x.expert&&x.expert.length)||0;
    if(c>n) n=c;
  }
  return n;
}
/* ---- 苏芙比【愈合】 ---- */
function healTrigger(b){
  if(!b || b.hp<=0 || !(b.healT>0)) return false;
  if(b.skillType==='reed' && b.reedMode==='seed') return false;   // 种子不给治疗结算
  b.healT=0;
  const before=b.hp;
  // 触发时生命低于100：本次愈合回复量提升至16
  const lowBuffed=(b.hp<HEAL_LOW_HP);
  const base=lowBuffed?HEAL_LOW_AMOUNT:HEAL_AMOUNT;
  b.hp=Math.min(b.maxhp,b.hp+base+healBonus(b));
  if(b.team!==undefined && balls.some(x=>x.team===b.team && x.hp>0 && x.skillType==='sotheby')) seSothebyHeal();
  addText(b.x,b.y-b.r-30,'愈合 +'+(b.hp-before),HEAL_COLOR);
  burst(b.x,b.y,HEAL_COLOR,10);
  healFx(b.x,b.y,b.hp-before,'heal');
  return true;
}
function healApply(b){
  if(!b || b.hp<=0) return;
  if(b.skillType==='reed' && b.reedMode==='seed') return;
  // 已拥有【愈合】时再次被施加：先立即触发旧的那层
  if(b.healT>0) healTrigger(b);
  b.healT=HEAL_DUR;
  addText(b.x,b.y-b.r-46,'愈合',HEAL_COLOR);
}
/* ---- 苏芙比：敌方【中毒】数量最多的角色，其【中毒】每结算 3 次，赋予己方全体 1 层【愈合】 ---- */
const POTION_HEAL_TICK=3;
function potionHealSettle(b){
  if(!b || !b.poison) return;
  const n=b.poison.length;
  if(n<=0) return;
  for(let T=0;T<4;T++){
    if(b.team===T) continue;
    const sf=balls.find(x=>x.team===T && x.hp>0 && x.skillType==='sotheby');
    if(!sf) continue;
    // 只在“敌方【中毒】层数最多”的角色身上计次（并列时都算）
    let max=0;
    for(const x of balls){
      if(x.team!==b.team || x.hp<=0) continue;
      const m=(x.poison?x.poison.length:0);
      if(m>max) max=m;
    }
    if(max<=0 || n!==max) continue;
    sf.healTick=(sf.healTick||0)+1;
    if(sf.healTick>=POTION_HEAL_TICK){
      sf.healTick=0;
      addText(sf.x,sf.y-sf.r-70,'愈合赋予',HEAL_COLOR);
      for(const a of balls){ if(a.team===T && a.hp>0) healApply(a); }
    }
  }
}

/* ---- 治疗效果统一表现：愈合 / 光束 / 影子 ---- */
let heals=[];
const HEAL_FX_PAL={
  heal:{ring:'#7dffa8',core:'#eafff0'},
  beam:{ring:'#ffe487',core:'#fffdf0'},
  shadow:{ring:'#ff9ec4',core:'#ffe8f3'}
};
// kind: heal=苏芙比愈合, beam=APPLe 光束, shadow=野树莓影子
function healFx(x,y,amount,kind){
  kind=kind||'heal';
  const pal=HEAL_FX_PAL[kind]||HEAL_FX_PAL.heal;
  heals.push({x,y,life:1,kind,ring:pal.ring,core:pal.core,
    n:kind==='beam'?16:(kind==='shadow'?13:11),seed:Math.random()*6.283});
}
function updateHeals(dt){
  for(const h of heals) h.life-=dt*1.25;
  heals=heals.filter(h=>h.life>0);
}
function drawHeals(){
  const now=performance.now();
  for(const h of heals){
    const t=Math.min(1,Math.max(0,1-h.life));   // 0→1 进度
    const e=1-Math.pow(1-t,2);                  // 缓出
    const fade=Math.max(0,1-t);
    g.save();
    // 外扩光圈
    g.strokeStyle=h.ring;
    g.globalAlpha=fade*0.9;
    g.lineWidth=h.kind==='beam'?3:2.6;
    g.beginPath(); g.arc(h.x,h.y,16+e*40,0,7); g.stroke();
    // 内层快速圈
    g.globalAlpha=fade*0.45;
    g.lineWidth=1.6;
    g.beginPath(); g.arc(h.x,h.y,7+e*20,0,7); g.stroke();
    // 上升的光点
    for(let i=0;i<h.n;i++){
      const a=h.seed+i*Math.PI*2/h.n;
      const sp=10+e*30;
      const px=h.x+Math.cos(a)*sp*(0.6+0.4*Math.sin(now/260+i));
      const py=h.y+Math.sin(a)*sp-e*(34+(i%4)*9);
      g.globalAlpha=fade*(i%3===0?1:0.62);
      g.fillStyle=i%3===0?h.core:h.ring;
      g.beginPath(); g.arc(px,py,i%3===0?2.6:1.8,0,7); g.fill();
    }
    // 中央符号
    g.globalAlpha=fade*0.95;
    const cy=h.y-e*10;
    if(h.kind==='beam'){
      // 星芒闪一下
      g.strokeStyle=h.core; g.lineWidth=2;
      const r1=4+e*9;
      g.beginPath(); g.moveTo(h.x-r1,cy); g.lineTo(h.x+r1,cy);
      g.moveTo(h.x,cy-r1); g.lineTo(h.x,cy+r1); g.stroke();
    }else if(h.kind==='shadow'){
      // 暗影里透出的一弯柔光
      g.fillStyle='rgba(28,10,24,.55)';
      g.beginPath(); g.ellipse(h.x,cy+4,9-e*3,5.5,0,0,7); g.fill();
      g.strokeStyle=h.ring; g.lineWidth=2;
      g.beginPath(); g.arc(h.x,cy,7,Math.PI*0.15,Math.PI*0.95); g.stroke();
    }else{
      // 绿色治疗十字
      g.fillStyle=h.core; g.shadowColor=h.ring; g.shadowBlur=14;
      const s=7+e*5;
      g.fillRect(h.x-s*0.3,cy-s,s*0.6,s*2);
      g.fillRect(h.x-s,cy-s*0.3,s*2,s*0.6);
      g.shadowBlur=0;
    }
    g.restore();
  }
}
/* ---- 命中反馈特效：狙击 / 炮弹 / 钓鱼 / 车票 ---- */
let hits=[];
let triBursts=[];
// kind: snipe=玛丽安娜狙击, shell=露西炮弹, fish=程和光钓鱼, fare=灰调蓝车票, poppy=卡戎虞美人
function hitFx(x,y,color,kind,strong){
  hits.push({x,y,color:color||'#ffffff',kind:kind||'snipe',strong:!!strong,life:1,seed:Math.random()*6.283});
}
function updateHits(dt){
  for(const h of hits) h.life-=dt*1.15;
  hits=hits.filter(h=>h.life>0);
}
function drawHits(){
  const now=performance.now();
  for(const h of hits){
    const t=Math.min(1,Math.max(0,1-h.life));
    const e=1-Math.pow(1-t,3);
    const fade=Math.max(0,1-t*1.02);
    g.save();
    g.shadowColor=h.color; g.shadowBlur=18;
    if(h.kind==='snipe'){
      // 贯穿光束 + 十字准星
      g.strokeStyle=h.color; g.lineWidth=2.2; g.globalAlpha=fade*0.85;
      g.beginPath(); g.moveTo(h.x-64-e*30,h.y); g.lineTo(h.x+64+e*30,h.y); g.stroke();
      g.lineWidth=2.8; g.globalAlpha=fade;
      g.beginPath(); g.arc(h.x,h.y,9+e*28,0,7); g.stroke();
      const r1=15+e*22;
      g.beginPath();
      g.moveTo(h.x-r1,h.y); g.lineTo(h.x-r1*0.4,h.y);
      g.moveTo(h.x+r1*0.4,h.y); g.lineTo(h.x+r1,h.y);
      g.moveTo(h.x,h.y-r1); g.lineTo(h.x,h.y-r1*0.4);
      g.moveTo(h.x,h.y+r1*0.4); g.lineTo(h.x,h.y+r1);

        g.beginPath(); g.ellipse(0,0,5.4*pw,4*pw,0,0,7); g.fill();
        g.strokeStyle=NC; g.lineWidth=1.6;
        g.beginPath(); g.moveTo(4.6*pw,1); g.lineTo(4.6*pw,-9*pw); g.stroke();
        g.restore();
      }
      g.globalAlpha=fade; g.fillStyle='#fffdf0';
      g.beginPath(); g.arc(h.x,h.y,(7+e*4)*pw,0,7); g.fill();
    }else if(h.kind==='nut'){
      // 松果命中：褐色鳞片向外崩开 + 两圈扩散环
      g.strokeStyle=h.color; g.lineWidth=2.4;
      for(let k=0;k<2;k++){
        g.globalAlpha=fade*(0.75-k*0.26);
        g.beginPath(); g.arc(h.x,h.y,(10+e*(26+k*16)),0,7); g.stroke();
      }
      for(let i=0;i<8;i++){
        const a=h.seed+i*0.785+e*0.9, sp=10+e*40;
        g.save();
        g.globalAlpha=fade*0.92;
        g.translate(h.x+Math.cos(a)*sp,h.y+Math.sin(a)*sp);
        g.rotate(a*1.4);
        g.fillStyle=i%2?h.color:'#e8b877';
        g.beginPath(); g.ellipse(0,0,5.6,3.4,0,0,7); g.fill();
        g.restore();
      }
      g.globalAlpha=fade*0.95; g.fillStyle='#fff6e6';
      g.beginPath(); g.arc(h.x,h.y,7*(1-e*0.6),0,7); g.fill();
    }else if(h.kind==='paper86'){
      // 玛蒂尔达命中：一张 86 分的试卷拍在敌人头上
      g.save();
      g.translate(h.x,h.y-30-e*8);
      g.rotate(-0.16+h.seed*0.05);
      g.scale(1+e*0.3,1+e*0.3);
      g.globalAlpha=fade;
      g.shadowColor='#ffe9a8'; g.shadowBlur=16;
      g.fillStyle='#fdfaf2';
      g.fillRect(-23,-16,46,32);
      g.strokeStyle='#ded5c0'; g.lineWidth=1.6; g.strokeRect(-23,-16,46,32);
      // 题目横线
      g.strokeStyle='#d2c9b3'; g.lineWidth=1.1;
      for(let i=0;i<3;i++){
        g.beginPath(); g.moveTo(-17,-7+i*6); g.lineTo(3,-7+i*6); g.stroke();
      }
      // 红色 86 分
      g.shadowColor='#ff5a5a'; g.shadowBlur=8;
      g.fillStyle='#ff4d4d';
      g.font='bold 16px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText('86', 6, -2);
      // 红勾
      g.strokeStyle='#ff4d4d'; g.lineWidth=2.4;
      g.beginPath(); g.moveTo(-18,3); g.lineTo(-14,8); g.lineTo(-6,0); g.stroke();
      g.restore();
      g.globalAlpha=fade*0.7;
      for(let i=0;i<6;i++){
        const a=h.seed+i*1.047, sp=18+e*42;
        g.fillStyle=i%2?h.color:'#fff6dc';
        g.fillRect(h.x+Math.cos(a)*sp-2,h.y+Math.sin(a)*sp-2,4,4);
      }
    }else{
      // 车票：红色票面残影 + 剪切痕
      g.globalAlpha=fade*0.9; g.strokeStyle=h.color; g.lineWidth=2.6;
      g.beginPath(); g.arc(h.x,h.y,10+e*34,0,7); g.stroke();
      g.save();
      g.translate(h.x,h.y); g.rotate(-0.42);
      g.globalAlpha=fade*0.8; g.strokeStyle='#ffe9ef'; g.lineWidth=2;
      g.strokeRect(-20,-12+e*4,40,24);
      g.beginPath(); g.moveTo(-20,-12+e*4); g.lineTo(20,12+e*4); g.stroke();
      g.restore();
      g.globalAlpha=fade*0.9; g.fillStyle='#fff2f4';
      g.beginPath(); g.arc(h.x,h.y,6*(1-e*0.6),0,7); g.fill();
      for(let i=0;i<8;i++){
        const a=h.seed+i*0.785, sp=16+e*40;
        g.globalAlpha=fade*0.8; g.fillStyle=i%2?h.color:'#ffe1e8';
        g.save(); g.translate(h.x+Math.cos(a)*sp,h.y+Math.sin(a)*sp); g.rotate(a);
        g.fillRect(-4,-1,8,2); g.restore();
      }
    }
    g.restore();
  }
}
/* ---- 芦草结特效：枯萎 / 种子闪叶 / 萌发 / 失去一苇之所如 ---- */
const REED_WITHER_DUR=1.3;
const REED_SPROUT_DUR=1.25;
const REED_BARE_DUR=1.2;
const REED_LEAF_LIGHT='#c8e08a';
const REED_LEAF_DARK='#5f7f3c';
const REED_WITHER_COL='#a8935f';
const REED_BARE_COL='#8a6b3a';

// 一片叶子：以 (cx,cy) 为中心，size 为半高
function reedLeaf(cx,cy,size,col,vein){
  g.beginPath();
  g.moveTo(cx,cy-size);
  g.quadraticCurveTo(cx+size*0.62,cy-size*0.10,cx,cy+size*0.95);
  g.quadraticCurveTo(cx-size*0.62,cy-size*0.10,cx,cy-size);
  g.closePath();
  g.fillStyle=col; g.fill();
  if(vein){
    g.strokeStyle=vein; g.lineWidth=Math.max(1,size*0.14);
    g.beginPath(); g.moveTo(cx,cy-size*0.78); g.lineTo(cx,cy+size*0.66); g.stroke();
  }
}

function drawReedMarks(b){
  if(!b || b.hp<=0 || b.skillType!=='reed') return;
  const now=performance.now();

  // 【种子】：埋着的时候周围有叶子一明一暗地闪
  if(b.reedMode==='seed'){
    g.save();
    for(let i=0;i<7;i++){
      const a=now/760+i*0.897;
      const rr=b.r+13+Math.sin(now/280+i*1.7)*5;
      const px=b.x+Math.cos(a)*rr, py=b.y+Math.sin(a)*rr*0.82;
      const k=Math.max(0,0.30+0.45*Math.sin(now/210+i*1.25));
      g.save();
      g.globalAlpha=k;
      g.translate(px,py); g.rotate(a+Math.PI*0.5);
      reedLeaf(0,0,5.5+Math.sin(now/300+i)*1.2,REED_LEAF_LIGHT,REED_LEAF_DARK);
      g.restore();
    }
    // 土面轻轻起伏的一层光
    g.globalAlpha=0.16+0.12*Math.sin(now/300);
    g.strokeStyle=REED_LEAF_LIGHT; g.lineWidth=2;
    g.beginPath(); g.ellipse(b.x,b.y+b.r*0.85,b.r*0.95,b.r*0.34,0,0,7); g.stroke();
    g.restore();
  }

  // 【枯萎】：变成惠姑那一下，干裂纹外扩 + 枯叶崩飞
  if((b.reedWitherT||0)>0){
    const k=1-(b.reedWitherT/REED_WITHER_DUR);
    const fade=Math.max(0,1-Math.pow(k,1.5));
    g.save();
    // 干裂的三层环
    g.setLineDash([]);
    for(let i=0;i<3;i++){
      g.globalAlpha=fade*(0.85-i*0.22);
      g.strokeStyle=REED_WITHER_COL; g.lineWidth=2.6-i*0.4;
      if(i>0) g.setLineDash([9,10]);
      g.beginPath(); g.arc(b.x,b.y,b.r+5+i*14+k*(44+i*10),0,7); g.stroke();
    }
    g.setLineDash([]);
    // 向外崩开、同时往下掉的枯叶
    for(let i=0;i<11;i++){
      const a=i*0.571+0.35;
      const d=b.r+9+k*(44+(i%5)*7);
      const px=b.x+Math.cos(a)*d, py=b.y+Math.sin(a)*d*0.9+k*k*36;
      g.save();
      g.globalAlpha=fade*(0.92-(i%4)*0.12);
      g.translate(px,py); g.rotate(a+k*2.8+i*0.4);
      reedLeaf(0,0,6.6-(i%3)*0.9,i%2?REED_WITHER_COL:'#8a7644','#54431f');
      g.restore();
    }
    // 壳裂开的一道白闪
    if(k<0.32){
      g.globalAlpha=(1-k/0.32)*0.75;
      g.strokeStyle='#efe6cb'; g.lineWidth=4;
      g.beginPath(); g.arc(b.x,b.y,b.r+2+k*26,0,7); g.stroke();
    }
    g.restore();
  }

  // 【萌发】：种子长回芦草结，土块崩开、嫩芽破土、子叶张开
  if((b.reedSproutT||0)>0){
    const k=1-(b.reedSproutT/REED_SPROUT_DUR);
    const fade=Math.max(0,1-Math.max(0,(k-0.62)/0.38));
    g.save();
    // 土块向两侧崩
    for(let i=0;i<9;i++){
      const a=Math.PI*0.15+i*0.32;
      const d=b.r*0.45+k*(26+(i%4)*8);
      const px=b.x+Math.cos(a)*d, py=b.y+Math.sin(a)*d*0.8-k*k*22;
      const sz=3.6-(i%3)*0.7;
      g.globalAlpha=fade*0.85;
      g.fillStyle=i%2?'#7a5c36':'#523c22';
      g.beginPath();
      g.moveTo(px,py); g.lineTo(px+sz,py+sz*1.5); g.lineTo(px-sz,py+sz*0.7);
      g.closePath(); g.fill();
    }
    // 嫩芽从球底往上抽
    const grow=Math.min(1,k/0.55);
    const baseY=b.y+b.r*0.55, tipY=baseY-grow*(b.r*1.35);
    g.globalAlpha=fade;
    g.strokeStyle=REED_LEAF_DARK; g.lineWidth=3.4;
    g.beginPath(); g.moveTo(b.x,baseY);
    g.quadraticCurveTo(b.x+5*grow,baseY-(baseY-tipY)*0.55,b.x,tipY); g.stroke();
    // 两片子叶慢慢张开
    const open=Math.max(0,Math.min(1,(k-0.28)/0.62));
    for(const side of [-1,1]){
      g.save();
      g.translate(b.x,tipY+7);
      g.rotate(side*(1.15-open*1.05));
      reedLeaf(0,0,10.5+open*3.5,REED_LEAF_LIGHT,REED_LEAF_DARK);
      g.restore();
    }
    // 破土光环 + 上升光点
    g.globalAlpha=fade*0.8;
    g.strokeStyle=REED_GRACE_COLOR; g.lineWidth=3;
    g.beginPath(); g.arc(b.x,b.y,b.r+6+k*42,0,7); g.stroke();
    for(let i=0;i<9;i++){
      const a=i*0.698+0.25;
      g.globalAlpha=fade*(0.72-(i%4)*0.1);
      g.fillStyle=REED_LEAF_LIGHT;
      g.beginPath(); g.arc(b.x+Math.cos(a)*(b.r+10),b.y+Math.sin(a)*(b.r+10)-k*50,2.2,0,7); g.fill();
    }
    g.restore();
  }

  // 【失去一苇之所如】：一圈枯叶绕着身体闪，护罩碎裂
  if((b.reedBareT||0)>0){
    const k=1-(b.reedBareT/REED_BARE_DUR);
    const pulse=0.42+0.58*Math.abs(Math.sin(now/105));
    const fade=Math.max(0,1-k*1.02);
    g.save();
    for(let i=0;i<9;i++){
      const a=now/880+i*0.698;
      const rx=b.r+17+Math.sin(now/250+i)*6, ry=(b.r+17)*0.74;
      const px=b.x+Math.cos(a)*rx, py=b.y+Math.sin(a)*ry;
      g.save();
      g.globalAlpha=fade*pulse*(i%2?0.85:1);
      g.translate(px,py); g.rotate(a*1.5+i*0.3);
      reedLeaf(0,0,i%3?7:5.6,i%3?REED_BARE_COL:'#b99a5c','#54401c');
      g.restore();
    }
    // 碎成几段的护罩弧
    g.globalAlpha=fade*pulse;
    g.strokeStyle=REED_BARE_COL; g.lineWidth=3;
    for(let i=0;i<5;i++){
      const a0=now/620+i*1.257;
      g.beginPath(); g.arc(b.x,b.y,b.r+8+k*24,a0,a0+0.72+k*0.55); g.stroke();
    }
    g.restore();
  }
}

/* ---- 【术具调谐】：小球边框缠一圈半透明五线谱 ---- */
function drawTuneStaff(b){
  const n=b.tune1||0;
  if(!n || b.hp<=0) return;
  const now=performance.now();
  const base=b.r+9, span=Math.PI*1.18, a0=now/1500;
  g.save();
  // 五条平行的谱线，绕着小球慢慢转
  g.globalAlpha=Math.min(0.55,0.16+0.05*n);
  g.strokeStyle='#ffe9a8'; g.lineWidth=1.15;
  for(let i=0;i<5;i++){
    const rr=base+i*2.9;
    g.beginPath(); g.arc(b.x,b.y,rr,a0,a0+span); g.stroke();
  }
  // 谱线上的两个音符头
  g.strokeStyle='#fff3c4'; g.lineWidth=1.4;
  for(let k=0;k<2;k++){
    const ang=a0+span*(0.28+k*0.42);
    const rr=base+2.9*(k?3.2:1.1);
    const x=b.x+Math.cos(ang)*rr, y=b.y+Math.sin(ang)*rr;
    g.globalAlpha=0.45+0.18*Math.sin(now/240+k);
    g.fillStyle='#fff7cf';
    g.beginPath(); g.ellipse(x,y,3.4,2.5,ang,0,7); g.fill();
    g.beginPath(); g.moveTo(x+1.6*Math.cos(ang-1.2),y+1.6*Math.sin(ang-1.2));
    g.lineTo(x+1.6*Math.cos(ang-1.2)-6,y+1.6*Math.sin(ang-1.2)-6); g.stroke();
  }
  g.restore();
}

/* ---- 状态徽标：女巫帽 / 扫把 / 爪痕 / 鹰爪（触发时爆闪，务必看清） ---- */
/* ---- 马库斯：【当海风翻页时】的书页翻动 / 小马 305 / 松鼠护目镜 ---- */
function drawMarcusMarks(b){
  if(!b || b.hp<=0) return;
  const now=performance.now();
  // 触发瞬间：一圈书页从球心向外翻出去，页页错开旋转，中心压一层白闪
  if((b.marcusBookT||0)>0){
    const k=1-Math.max(0,b.marcusBookT)/MARCUS_BOOK_DUR;   // 0→1
    const fade=Math.max(0,1-k*1.02);
    const pages=7;
    g.save();
    // 中心的书脊白闪
    g.globalAlpha=fade*0.55;
    g.fillStyle=MARCUS_BOOK_COLOR;
    g.shadowColor=MARCUS_BOOK_COLOR; g.shadowBlur=26;
    g.beginPath(); g.arc(b.x,b.y,b.r*(0.5+k*1.9),0,7); g.fill();
    // 书页
    for(let i=0;i<pages;i++){
      const a0=i*(Math.PI*2/pages);
      const a=a0+k*1.5;
      const rad=b.r*0.5+k*(b.r+46);
      const px=b.x+Math.cos(a)*rad, py=b.y+Math.sin(a)*rad*0.78;
      const sw=1-Math.abs(Math.cos(a+k*2.2))*0.72;   // 翻页的横向收缩
      g.save();
      g.translate(px,py);
      g.rotate(a+Math.PI/2+ (k-0.5)*1.1);
      g.globalAlpha=fade*0.92;
      const w=15, h=19;
      g.shadowColor=MARCUS_BOOK_COLOR; g.shadowBlur=16;
      g.fillStyle='rgba(246,252,255,.94)';
      g.beginPath();
      g.moveTo(-w/2*sw,-h/2);
      g.quadraticCurveTo(w/2*sw,-h/2-2,w/2*sw,0);
      g.quadraticCurveTo(w/2*sw,h/2+1,-w/2*sw,h/2);
      g.quadraticCurveTo(-w/2*sw-2,0,-w/2*sw,-h/2);
      g.closePath(); g.fill();
      g.strokeStyle=MARCUS_COLOR; g.lineWidth=1.4; g.stroke();
      // 书页上的行字
      g.globalAlpha=fade*0.5;
      g.strokeStyle='#7fa08c'; g.lineWidth=1;
      for(let l=0;l<3;l++){
        const ly=-5+l*5;
        g.beginPath(); g.moveTo(-w/2*sw+3,ly); g.lineTo(w/2*sw-3,ly); g.stroke();
      }
      g.restore();
    }
    g.restore();
  }
  // 小马强化期间：头顶 305 绿色数字
  if((b.beastT||0)>0 && b.beastKind==='horse'){
    const pulse=0.68+0.32*Math.sin(now/110);
    const cy=b.y-b.r-34;
    g.save();
    g.textAlign='center'; g.textBaseline='middle';
    g.globalAlpha=pulse;
    g.shadowColor=MARCUS_COLOR; g.shadowBlur=22;
    g.font='bold 26px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    g.lineWidth=5; g.strokeStyle='rgba(10,28,16,.85)';
    g.strokeText(MARCUS_HORSE_TAG,b.x,cy);
    g.fillStyle=MARCUS_COLOR;
    g.fillText(MARCUS_HORSE_TAG,b.x,cy);
    // 数字两侧的速度线
    const sl=10+6*Math.abs(Math.sin(now/95));
    g.strokeStyle=MARCUS_COLOR; g.lineWidth=2.4; g.shadowBlur=14;
    g.beginPath(); g.moveTo(b.x-34-sl,cy-6); g.lineTo(b.x-26,cy-6); g.stroke();
    g.beginPath(); g.moveTo(b.x+26,cy-6); g.lineTo(b.x+34+sl,cy-6); g.stroke();
    g.restore();
  }
  // 松鼠强化期间：头顶空军护目镜
  if((b.beastT||0)>0 && b.beastKind==='squirrel'){
    const pulse=0.75+0.25*Math.sin(now/120);
    const cy=b.y-b.r-26;
    g.save();
    g.translate(b.x,cy);
    g.globalAlpha=pulse;
    g.shadowColor='#ffd08a'; g.shadowBlur=16;
    // 镜带
    g.strokeStyle=MARCUS_GOGGLE_COLOR; g.lineWidth=5;
    g.beginPath(); g.moveTo(-26,-1); g.lineTo(-13,-3); g.stroke();
    g.beginPath(); g.moveTo(13,-3); g.lineTo(26,-1); g.stroke();
    // 两片镜片
    for(const dx of [-8,8]){
      g.beginPath(); g.ellipse(dx,-3,8.6,7.2,0,0,7);
      g.fillStyle='rgba(150,210,255,.55)'; g.fill();
      g.strokeStyle=MARCUS_GOGGLE_COLOR; g.lineWidth=3.2; g.stroke();
      // 反光
      g.globalAlpha=pulse*0.85;
      g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=1.8;
      g.beginPath(); g.moveTo(dx-4.4,-6.4); g.lineTo(dx-0.6,-7.6); g.stroke();
      g.globalAlpha=pulse;
    }
    // 鼻梁横梁
    g.strokeStyle=MARCUS_GOGGLE_COLOR; g.lineWidth=3;
    g.beginPath(); g.moveTo(-2,-4); g.lineTo(2,-4); g.stroke();
    g.restore();
  }
}

/* ---- 纸信圈儿：【告别大地】期间头顶大号纸飞机 ---- */
function drawPaperMarks(b){
  if(!b || b.hp<=0 || b.skillType!=='flutterpage') return;

  const cy=b.y-b.r-48;
  const sz=1.8+0.14*Math.sin(now/210);
  g.save();
  g.translate(b.x,cy);
  g.scale(sz,sz);
  // 拖尾
  g.globalAlpha=pulse*0.45;
  g.fillStyle='#dbe9ff';
  g.beginPath(); g.moveTo(-32,0); g.lineTo(2,6.5); g.lineTo(2,-6.5); g.closePath(); g.fill();

  g.globalAlpha=pulse;
  g.shadowColor=PAPER_COLOR; g.shadowBlur=26;

function drawStatusMarks(b){
  if(!b || b.hp<=0) return;
  const now=performance.now();
  // 【嘲讽】：半透明黄色嘲笑笑脸绕着小球转；剩余时间越少，闪烁越快
  if(isTaunting(b)){
    const remain=(b.tauntT||0)>0 ? b.tauntT : 1e9;   // 芦草结无固定时限，只做匀速呼吸
    const orbitR=b.r+24;
    const ang=now/850 + (b.id||0)*1.7;
    const fx=b.x+Math.cos(ang)*orbitR, fy=b.y+Math.sin(ang)*orbitR;
    const fr=Math.max(15,b.r*0.66);
    let a;
    if(remain<2.5){
      const f=3+(2.5-Math.min(2.5,remain))*7;       // 越接近结束，闪得越快
      a=0.5*(0.22+0.78*Math.abs(Math.sin(now/1000*f)));
    }else{
      a=0.42+0.12*Math.sin(now/420);
    }
    g.save();
    g.translate(fx,fy);
    g.rotate(Math.sin(now/760)*0.14);
    g.globalAlpha=a;
    g.shadowColor='#ffd83d'; g.shadowBlur=16;
    g.fillStyle='rgba(255,216,61,.55)';
    g.beginPath(); g.arc(0,0,fr,0,7); g.fill();
    g.shadowBlur=0;
    g.strokeStyle='rgba(255,232,128,.9)'; g.lineWidth=Math.max(1.6,fr*0.10);
    g.beginPath(); g.arc(0,0,fr,0,7); g.stroke();
    // 嘲笑的眼睛：两条半眯的斜线
    g.strokeStyle='rgba(74,48,0,.85)'; g.lineCap='round';
    g.lineWidth=Math.max(2,fr*0.13);
    g.beginPath(); g.moveTo(-fr*0.52,-fr*0.18); g.lineTo(-fr*0.14,-fr*0.30); g.stroke();
    g.beginPath(); g.moveTo(fr*0.14,-fr*0.24); g.lineTo(fr*0.52,-fr*0.10); g.stroke();
    // 上扬的咧嘴笑
    g.lineWidth=Math.max(2.2,fr*0.14);
    g.beginPath(); g.arc(0,-fr*0.02,fr*0.48,0.18*Math.PI,0.92*Math.PI); g.stroke();
    // 一侧嘴角挑上去，做出嘲讽感
    g.beginPath(); g.moveTo(fr*0.46,fr*0.26); g.lineTo(fr*0.66,fr*0.08); g.stroke();
    g.restore();
  }
  // 统一外扩光晕：外圈散开 + 内圈收紧 + 中心白闪
  function markHalo(cx,cy,color,base,spread,k,strong){
    const kk=Math.min(1,Math.max(0,k));
    const e=1-Math.pow(1-kk,2);
    g.save();
    g.strokeStyle=color; g.shadowColor=color; g.shadowBlur=26;
    g.globalAlpha=kk*0.95;
    g.lineWidth=(strong?4.4:3.4)-1.8*e;
    g.beginPath(); g.arc(cx,cy,base+e*spread,0,7); g.stroke();
    g.globalAlpha=kk*0.5;
    g.lineWidth=1.8;
    g.beginPath(); g.arc(cx,cy,base*0.55+e*spread*0.62,0,7); g.stroke();
    g.globalAlpha=kk*kk*0.7;
    g.fillStyle='#ffffff';
    g.beginPath(); g.arc(cx,cy,base*0.26*(0.6+kk*0.7),0,7); g.fill();
    g.restore();
  }
  // 【影子的恩典】：被保下来的己方闪一个影子剪影
  if((b.shadowT||0)>0){
    const k=Math.min(1,b.shadowT/(MARK_DUR*1.6));
    const pulse=0.5+0.5*Math.sin(now/85);
    g.save();
    g.globalAlpha=Math.min(1,k*1.7)*pulse;
    g.translate(b.x,b.y);
    g.shadowColor=BERRY_COLOR; g.shadowBlur=20;
    // 上半身剪影
    g.fillStyle='rgba(200,90,122,.85)';
    g.beginPath(); g.arc(0,-14,7.5,0,7); g.fill();
    g.beginPath();
    g.moveTo(-11,14);
    g.quadraticCurveTo(-12,-6,0,-8);
    g.quadraticCurveTo(12,-6,11,14);
    g.closePath(); g.fill();
    // 往下拖的一截影子尾巴
    g.globalAlpha*=0.55;
    g.beginPath();
    g.moveTo(-8,12); g.quadraticCurveTo(0,30,8,12);
    g.quadraticCurveTo(0,22,-8,12);
    g.closePath(); g.fill();
    g.restore();
  }
  // 【野树莓一世的恩典】：触发瞬间在球上闪一个血红色十字架
  if((b.berryGraceT||0)>0){
    const k=Math.min(1,b.berryGraceT/BERRY_INVUL);
    const pulse=0.4+0.6*Math.abs(Math.sin(now/72));
    const s=b.r*0.95;
    g.save();
    g.translate(b.x,b.y);
    g.globalAlpha=Math.min(1,0.35+k*0.65)*pulse;
    g.shadowColor=BERRY_CROSS; g.shadowBlur=22;
    g.strokeStyle=BERRY_CROSS; g.lineCap='round';
    g.lineWidth=Math.max(3,b.r*0.18);
    g.beginPath(); g.moveTo(-s,0); g.lineTo(s,0); g.stroke();
    g.beginPath(); g.moveTo(0,-s); g.lineTo(0,s); g.stroke();
    // 内层白芯，让十字架在暗背景上更亮
    g.shadowBlur=0;
    g.globalAlpha*=0.6;
    g.strokeStyle='rgba(255,242,246,.95)';
    g.lineWidth=Math.max(1,b.r*0.06);
    g.beginPath(); g.moveTo(-s*0.97,0); g.lineTo(s*0.97,0); g.stroke();
    g.beginPath(); g.moveTo(0,-s*0.97); g.lineTo(0,s*0.97); g.stroke();
    g.restore();
  }
  // 【忠诚伙伴】：金色环常驻
  if(b.skillType==='babel' && b.loyal){
    g.save();
    g.globalAlpha=0.5+0.2*Math.sin(now/300);
    g.strokeStyle='#ffd76b'; g.lineWidth=3.4;
    g.shadowColor='#ffd76b'; g.shadowBlur=14;
    g.beginPath(); g.arc(b.x,b.y,b.r+9,0,7); g.stroke();
    g.restore();
  }
  // 【雾中祭祀】：笃笃骨头顶闪一顶女巫帽
  if((b.hatT||0)>0){
    const k=Math.min(1,b.hatT/MARK_STATUS_DUR);
    const pulse=0.6+0.4*Math.sin(now/75);
    const cy=b.y-b.r-14;
    markHalo(b.x,cy,MIST_COLOR,28,60,k,true);
    g.save();
    g.globalAlpha=Math.min(1,k*1.9)*pulse;
    g.translate(b.x,cy+8);
    g.rotate(-0.14);
    g.scale(1.5,1.5);
    g.shadowColor=MIST_COLOR; g.shadowBlur=28;
    g.fillStyle='#2b1d44';
    g.beginPath(); g.ellipse(0,0,23,7,0,0,7); g.fill();
    g.strokeStyle=MIST_COLOR; g.lineWidth=2.2; g.stroke();
    g.beginPath();
    g.moveTo(-14,0);
    g.quadraticCurveTo(-7,-19,-2,-29);
    g.quadraticCurveTo(3,-35,11,-27);
    g.quadraticCurveTo(4,-15,13,0);
    g.closePath();
    g.fillStyle='#3a2757'; g.fill();
    g.strokeStyle=MIST_COLOR; g.lineWidth=2.4; g.stroke();
    g.beginPath();
    g.moveTo(-11,-6); g.quadraticCurveTo(0,-3,11,-6);
    g.strokeStyle='#7ce6b0'; g.lineWidth=4; g.stroke();
    // 帽尖的星芒
    g.strokeStyle='#efe6ff'; g.lineWidth=2; g.shadowBlur=18;
    const sr=5+7*Math.abs(Math.sin(now/130));
    g.beginPath(); g.moveTo(-2-sr,-29); g.lineTo(-2+sr,-29); g.stroke();
    g.beginPath(); g.moveTo(-2,-29-sr); g.lineTo(-2,-29+sr); g.stroke();
    g.restore();
  }
  // 【除灵专家】：拉莫纳脚边闪一把扫把
  if((b.broomT||0)>0){
    const k=Math.min(1,b.broomT/MARK_STATUS_DUR);
    const pulse=0.6+0.4*Math.sin(now/70);
    markHalo(b.x,b.y,ESSENCE_COLOR,b.r+10,48,k,false);
    g.save();
    g.globalAlpha=Math.min(1,k*1.9)*pulse;
    g.translate(b.x+b.r*0.72,b.y+b.r*0.5);
    g.rotate(-0.42);
    g.scale(1.45,1.45);
    g.shadowColor=ESSENCE_COLOR; g.shadowBlur=26;
    g.strokeStyle='#a9793f'; g.lineWidth=4; g.lineCap='round';
    g.beginPath(); g.moveTo(0,-30); g.lineTo(0,12); g.stroke();
    g.strokeStyle=ESSENCE_COLOR; g.lineWidth=3;
    g.beginPath();
    for(let i=-2;i<=2;i++){
      g.moveTo(0,10);
      g.lineTo(i*5.5,28);
    }
    g.stroke();
    g.globalAlpha=Math.min(1,k*1.9)*pulse*0.85;
    g.fillStyle='#d9c7a3';
    g.beginPath();
    g.moveTo(-11,22); g.lineTo(11,22); g.lineTo(7,31); g.lineTo(-7,31);
    g.closePath(); g.fill();
    g.restore();
  }
  // 【八灵震慴】：被打的人头顶闪三道爪痕，颜色看是哪边命中多
  if((b.clawT||0)>0){
    const k=Math.min(1,b.clawT/MARK_STATUS_DUR);
    const col=b.clawColor||CLAW_COLOR_TIE;
    const cy=b.y-b.r-30;
    markHalo(b.x,cy,col,26,62,k,true);
    g.save();
    g.lineCap='round';
    // 先白后彩，两层叠出抓痕的锐利感
    for(let pass=0;pass<2;pass++){
      g.strokeStyle=pass?col:'#ffffff';
      g.lineWidth=pass?5.4:9;
      g.globalAlpha=(pass?1:0.45)*Math.min(1,k*1.9);
      g.shadowColor=col; g.shadowBlur=pass?26:0;
      for(let i=-1;i<=1;i++){
        const ox=i*14;
        g.beginPath();
        g.moveTo(b.x+ox-9,cy-22);
        g.quadraticCurveTo(b.x+ox+7,cy,b.x+ox-9,cy+22);
        g.stroke();
      }
    }
    g.restore();
  }
  // 【肥鸟尘酿鹰】召唤：己方全体闪一次鹰爪
  if((b.eagleClawT||0)>0){
    const k=Math.min(1,b.eagleClawT/MARK_STATUS_DUR);
    const pulse=0.6+0.4*Math.sin(now/65);
    markHalo(b.x,b.y,RYAN_COLOR,b.r+12,56,k,true);
    g.save();
    g.lineCap='round';
    const rr=b.r+18, a0=now/260;
    for(let pass=0;pass<2;pass++){
      g.strokeStyle=pass?RYAN_COLOR:'#ffffff';
      g.lineWidth=pass?5:8.6;
      g.globalAlpha=(pass?1:0.4)*Math.min(1,k*1.9)*pulse;
      g.shadowColor=RYAN_COLOR; g.shadowBlur=pass?26:0;
      // 三趾爪印
      for(let i=-1;i<=1;i++){
        const a=a0+i*0.62;
        const x1=b.x+Math.cos(a)*rr*0.62, y1=b.y+Math.sin(a)*rr*0.62;
        const x2=b.x+Math.cos(a)*(rr+20), y2=b.y+Math.sin(a)*(rr+20);
        g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
      }
    }
    g.globalAlpha=Math.min(1,k*1.9)*0.85;
    g.strokeStyle=RYAN_COLOR; g.lineWidth=3;
    g.beginPath(); g.arc(b.x,b.y,rr+6,0,7); g.stroke();
    g.restore();
  }
}
/* ---- 笃笃骨【雾中祭祀】 ---- */
// 【雾中祭祀】是笃笃骨自身的增益：只有她自己身上的层数参与加伤
function mistLayers(team){
  let n=0;
  for(const x of balls){
    if(x.hp<=0 || x.skillType!=='willow') continue;
    if(team!=null && x.team!==team) continue;
    if(x.mist) n+=x.mist.length;
  }
  return n;
}
function updateMist(dt){
  for(const b of balls){
    if(!b.mist || !b.mist.length) continue;
    for(const m of b.mist) m.t-=dt;
    b.mist=b.mist.filter(m=>m.t>0);
  }
}
/* ---- 【中毒】定时结算：全游戏只有这一种结算方式，每 2 秒统一跳一次 ---- */
const POISON_TICK=2;
let poisonTickT=POISON_TICK;
function tickPoison(dt){
  poisonTickT-=dt;
  if(poisonTickT>0) return;
  poisonTickT+=POISON_TICK;
  for(const b of balls){
    if(b.hp<=0) continue;
    if(b.poison.length<=0 && (!b.soul || b.soul.length<=0)) continue;
    b.poisonCd=0;
    resolvePoison(b,true);
  }
}
function resolvePoison(b,force,consume){
  if(b.hp<=0) return false;
  if(b.poison.length<=0 && (!b.soul || b.soul.length<=0)) return false;
  if(!force && b.poisonCd>0) return false;
  b.poisonCd=0.18;
  // 故事会罩着时不消耗；术阵散场那一次强制消耗
  const keep = consume===false ? false : storyOnSide(b);
  // 【中毒】按“来源队伍”分组：只有该队自己的【除灵专家】【雾中祭祀】才加成这份中毒
  const groups={};
  const bucket=(team)=>{ const k=(team===undefined||team===null)?'?':team; return groups[k]||(groups[k]={team:(team===undefined?null:team),dmg:0,cnt:0}); };
  for(const st of b.poison){ const g=bucket(st.team); g.dmg+=Math.max(1,st.dmg); g.cnt++; }
  for(const sk of (b.soul||[])){ const g=bucket(sk.team); g.dmg+=Math.max(1,Math.round(sk.dmg)); g.cnt++; }
  let total=0, cnt=0;
  for(const k in groups){
    const g=groups[k];
    if(g.cnt<=0) continue;
    const en = (g.team===null) ? 0 : expertLayers(g.team);
    const mist = (g.team===null) ? 0 : mistLayers(g.team)*MIST_DMG;
    total += Math.round((g.dmg + mist) * (1 + en));
    cnt += g.cnt;
  }
  if(cnt<=0) return false;
  // 毒伤不再绕过护盾：先扣盾，再扣血
  let remain=total;
  if(b.shield>0){
    const ab=Math.min(b.shield,remain);
    b.shield-=ab; remain-=ab;
    if(ab>0) addText(b.x,b.y-b.r-34,'盾 -'+Math.round(ab),'#a9c0d4');
  }
  const real = remain>0 ? dealDamage(b,remain) : 0;
  addText(b.x,b.y-b.r-30,(real>0?'毒 -'+real:'毒被盾吸收')+(keep?'（不消耗）':''),POISON_COLOR);
  hitFx(b.x,b.y-b.r-58,POISON_COLOR,'poisonBubble');
  burst(b.x,b.y,POISON_COLOR,10);
  potionHealSettle(b);
  if(!keep){
    b.poison.length=0;
    if(b.soul) b.soul.length=0;
  }
  if(b.hp>0 && !keep && b.poison.length===0 && (!b.soul || b.soul.length===0))
    addText(b.x,b.y+b.r+24,'毒解了','#4e6b58');
  return true;
}

           双生合体全体命中、奠基石全体命中、强梁全体命中、程和光鱼获）
   【反击】：只有碰撞后才触发，来源是先动手的那颗球

/* ---- 拉莫纳：除灵剂 / 灵魂溶剂 ---- */
function soulOnHit(b,foe){
  if(!foe || foe.hp<=0) return;
  if(!foe.soul) foe.soul=[];
  if(foe.poison.length<POISON_CAP) foe.poison.push({dmg:POISON_DMG,team:b.team});
  if(!b.expert) b.expert=[];
  if(b.expert.length<EXPERT_MAX) b.expert.push({t:EXPERT_DUR});
  b.broomT=MARK_STATUS_DUR;  // 扫把闪一下
  foe.poisonCd=0;
  seRamonaExpert();
  addText(foe.x,foe.y-foe.r-30,'中毒 ×1 · 除灵专家 ×'+b.expert.length,ESSENCE_COLOR);
  burst(foe.x,foe.y,ESSENCE_COLOR,8);
}

// 每4秒把敌方的普通【中毒】熬成灵魂溶剂：每6个转1个，每个溶剂造成6点伤害（等于转化掉的中毒数量）
// 视为中毒的词条（【毒咒】等）只响应【惊惧故事会】，不参与这里的转化
function refineSoul(src){
  for(const f of balls){
    if(f.team===src.team || f.hp<=0) continue;
    if(!f.soul) f.soul=[];
    const n=f.poison.length;
    if(n<=0) continue;
    // 每6个转1个溶剂，不足6个的那一组也照转，伤害等于该组实际吃掉的【中毒】数量
    let left=n, count=0;
    while(left>0){
      const take=Math.min(SOUL_PER,left);
      f.soul.push({dmg:take,team:src.team});
      left-=take; count++;
    }
    f.poison.length=0;
    if(count>0) seRamonaSoul();
    addText(f.x,f.y-f.r-52,'中毒→灵魂溶剂 ×'+count,SOUL_COLOR);
    burst(f.x,f.y,SOUL_COLOR,16);
  }
}

// 灵魂溶剂每2秒自己涨1点伤害
function growSoul(b){
  if(!b.soul || b.soul.length<=0) return;
  for(const sk of b.soul) sk.dmg+=SOUL_GROW_ADD;
  addText(b.x,b.y+b.r+38,'灵魂溶剂 +1',SOUL_COLOR);
}

function duduOnHit(owner,foe){
  if(!owner || owner.hp<=0) return;
  if(!owner.mist) owner.mist=[];
  if(owner.mist.length<MIST_MAX) owner.mist.push({t:MIST_DUR});
  owner.hatT=MARK_STATUS_DUR; // 女巫帽闪一下
  sePlay('dudu2');
  addText(owner.x,owner.y-owner.r-30,'雾中祭祀 ×'+owner.mist.length,MIST_COLOR);
  if(foe && foe.hp>0){
    if(foe.poison.length<POISON_CAP) foe.poison.push({dmg:POISON_DMG,team:owner.team});
    foe.poisonCd=0;
    addText(foe.x,foe.y-foe.r-30,'中毒 ×1',POISON_COLOR);
    burst(foe.x,foe.y,POISON_COLOR,8);
  }
}

/* ---- 加程和光：垂钓 ---- */
// 小鱼弹道：必定追踪，命中后结算【追击】伤害
function fireFishShot(owner,target,dmg){
  if(!owner || !target || target.hp<=0) return;
  const ang=Math.atan2(target.y-owner.y,target.x-owner.x);
  projs.push({type:'fishshot',x:owner.x+Math.cos(ang)*(owner.r+12),y:owner.y+Math.sin(ang)*(owner.r+12),
    vx:Math.cos(ang)*FISH_SHOT_SPEED,vy:Math.sin(ang)*FISH_SHOT_SPEED,ang,speed:FISH_SHOT_SPEED,
    color:FISH_COLOR,owner,target,homing:true,life:3,size:13,dmg});
}
// 从敌方里随机抽 n 个目标
function pickRandomFoes(owner,n){
  // 【嘲讽】优先：嘲讽者先随机占位，名额不够再随机补其他人
  const all=foesOf(owner);
  const tk=shuffleArr(all.filter(b=>isTaunting(b)));
  const rest=shuffleArr(all.filter(b=>!isTaunting(b)));
  return (tk.length?tk.concat(rest):rest).slice(0,n);
}
function doFish(b){
  b.fishT=FISH_CD;
  seFish();
  b.fishCount=(b.fishCount||0)+1;
  const roll=Math.random()*100;
  let acc=0, pick='li';
  // 每5次垂钓必定出28斤大鲈鱼
  if(b.fishCount>=5){
    pick='big';
  }else{
    for(const it of FISH_POOL){ acc+=it[1]; if(roll<acc){ pick=it[0]; break; } }
  }
  if(pick==='big') b.fishCount=0;
  if(pick==='kong'){
    b.aikong=Math.min(3,(b.aikong||0)+1);
    addText(b.x,b.y-b.r-46,'空军! 免疫×'+b.aikong,FISH_COLOR);
    burst(b.x,b.y,FISH_COLOR,10);
  }else if(pick==='li'){
    const t=pickRandomFoes(b,1)[0];
    if(!t){ addText(b.x,b.y-b.r-46,'池塘空了',FISH_COLOR); return; }
    const dmg=Math.max(1,Math.round(FISH_LI_DMG*dmgMul(b,t)))+ctrBonusOf(b,t);
    fireFishShot(b,t,dmg);
    addText(b.x,b.y-b.r-46,'鲤鱼!','#8fe7ff');
    burst(b.x,b.y,FISH_COLOR,8);
  }else if(pick==='cao'){
    const ts=pickRandomFoes(b,2);
    if(!ts.length){ addText(b.x,b.y-b.r-46,'池塘空了',FISH_COLOR); return; }
    addText(b.x,b.y-b.r-46,'草鱼! ×'+ts.length,FISH_COLOR);
    burst(b.x,b.y,FISH_COLOR,12);
    for(const t of ts){
      const dmg=Math.max(1,Math.round(FISH_CAO_DMG*dmgMul(b,t)))+ctrBonusOf(b,t);
      fireFishShot(b,t,dmg);
    }
  }else if(pick==='lu'){
    const ly=balls.find(x=>x.skillType==='liangyue' && x.hp>0);
    const strong=balls.find(x=>x.skillType==='qiangliang' && x.team===b.team && x.hp>0);
    if(!ly){
      addText(b.x,b.y-b.r-46,'鲈鱼…场上没梁月',FISH_COLOR);
    }else if(!strong){
      addText(b.x,b.y-b.r-46,'鲈鱼…没强梁可喂',FISH_COLOR);
    }else{
      strong.liyu=1;
      addText(strong.x,strong.y-strong.r-46,'鲈鱼·下次追击翻倍','#9ff5e6');
      burst(strong.x,strong.y,FISH_COLOR,16);
    }
  }else{
    // 【28斤大鲈鱼】：屏幕中央来一次鲈鱼特效，随机三名敌人各吃28点
    addText(b.x,b.y-b.r-56,'28斤大鲈鱼!','#ffe27a');
    shake=Math.max(shake,9);
    fishFlashT=FISH_FLASH_DUR;
    const ts=pickRandomFoes(b,3);
    for(const t of ts){

// 敌方退场时，把它身上的【中毒】转给还活着的同伴，最多转5个
function transferToxin(dead){
  const pool=[];
  if(dead.poison) for(const p of dead.poison) pool.push({dmg:p.dmg,team:p.team});
  if(!pool.length) return;
  const targets=balls.filter(x=>x!==dead && x.team===dead.team && x.hp>0);
  if(!targets.length) return;
  let moved=0;
  for(const item of pool){
    if(moved>=5) break;
    const t=targets[moved%targets.length];
    if(!t.poison) t.poison=[];
    if(t.poison.length>=POISON_CAP) continue;
    t.poison.push({dmg:item.dmg,team:item.team});
    t.poisonCd=0;
    moved++;
  }
  if(!moved) return;
  sePlay('dudu1');
  addText(dead.x,dead.y-dead.r-60,'中毒转移 ×'+moved,POISON_COLOR);
  burst(dead.x,dead.y,POISON_COLOR,18);
}

// 全体命中：对敌方所有球各打一次；limit>0 时改为随机挑选其中 limit 名
function aoeHit(owner,dmg,color,opts,limit){

  let foes=balls.filter(x=>x.team!==owner.team && x.hp>0);
  if(!foes.length){ addText(owner.x,owner.y-owner.r-30,'没人可打','#7a7a8a'); return 0; }
  if(limit>0 && foes.length>limit){
    // 【嘲讽】优先：先随机嘲讽者，占不满名额再随机补其他人
    const tk=shuffleArr(foes.filter(x=>isTaunting(x)));
    const rest=shuffleArr(foes.filter(x=>!isTaunting(x)));
    foes=(tk.length?tk.concat(rest):rest).slice(0,limit);
  }
  const c=color||owner.color;
  for(const t of foes){
    if(opts.poison){
      for(let i=0;i<opts.poison && t.poison.length<POISON_CAP;i++) t.poison.push({dmg:POISON_DMG,team:owner.team});
      t.poisonCd=0;
      addText(t.x,t.y-t.r-30,'中毒 ×'+opts.poison,POISON_COLOR);
    }

    // 状态徽标：被全体命中打中时头顶闪爪子，颜色由调用方决定
    if(opts.claw){ t.clawT=MARK_STATUS_DUR; t.clawColor=opts.claw; }
    // 全体命中按每个目标各自算属性克制（只加固定克制伤害）
    applyDamage(t,Math.max(1,Math.round(dmg))+ctrBonusOf(owner,t),c,owner);
  }
  shake=Math.max(shake,7);
  return foes.length;
}


/* ================= 【术具】体系 ================= */
const SHUJU_COLOR='#ffd76b';
const SHUJU_TICK=5;            // 每 5 秒产出一次交感能量
const SHUJU_GAIN={1:2,2:4,3:9,4:16,5:20,6:24};
const SPELL_GAP=0.75;        // 术具咒语按编号轮放，间隔 0.75 秒
const TUNE_MAX=100;            // 同调值上限
const TUNE_RESET=10;           // 唤起/耗能等级每 10 秒清空（全队共享）
const SHUJU_WIPE=10;           // 【交感能量】每 10 秒清空一次（全队共用）
const SHUJU_ELES=['岩','星','兽','木','灵','智'];
let shujuEnergy=[{},{},{},{}]; // 每队各属性交感能量（全队共用）
let shujuLv=[];                // 每队 {call:唤起等级, cost:耗能等级, t:重置计时}
let shujuCycle=[];             // 每队 {t:轮放计时, idx:轮到第几个}
let shujuProd=[5,5,5,5];       // 每队产出计时
let shujuWipe=[null,null,null,null];   // 每队交感能量清空计时：首次产出后开始倒数 10 秒
function resetShuju(){
  twinSpins=[];
  shujuEnergy=[{},{},{},{}];
  shujuLv=[]; shujuCycle=[]; shujuProd=[SHUJU_TICK,SHUJU_TICK,SHUJU_TICK,SHUJU_TICK];
  shujuWipe=[null,null,null,null];
  for(let i=0;i<4;i++){ shujuLv.push({call:0,cost:0,t:0}); shujuCycle.push({t:0,idx:0}); }
}
function energyOf(team,el){ const m=shujuEnergy[team]; return m?(m[el]||0):0; }
function addEnergy(team,el,n){
  const m=shujuEnergy[team]||(shujuEnergy[team]={});
  m[el]=(m[el]||0)+n;
}
// 术具角色：只有一个（合体形态不施法）
function shujuChars(team){
  return balls.filter(x=>x.hp>0 && x.team===team && x.trait==='术具'
    && (x.skillType==='twins'||x.skillType==='regulars'||x.skillType==='coppelia'||x.skillType==='everecho'));
}
function shujuTuneOf(b){ return b?(b.tune||0):0; }
function addTune(b,n){
  if(!b || b.hp<=0) return;
  const cur=b.tune||0;
  const put=Math.min(Math.max(0,TUNE_MAX-cur),n);
  b.tune=Math.min(TUNE_MAX,cur+n);
  // 回声谣在场：溢出的同调各自临时储存（上限 50），同调爆发清零后回收
  const over=n-put;
  if(over>0 && echoOf(b.team)){
    b.tuneOver=Math.min(ECHO_OVERFLOW_MAX,(b.tuneOver||0)+over);
  }
  if(b.tune>=TUNE_MAX) addText(b.x,b.y-b.r-58,'同调满','#ffe9a8');
}
function addTune1(b,n){
  if(!b || b.hp<=0) return;
  b.tune1=Math.min(9,(b.tune1||0)+n);
  addText(b.x,b.y-b.r-72,'调谐I ×'+(b.tune1||0),SHUJU_COLOR);
}
// 产出：术具角色越多给得越多；总量与属性占比都只看【术具】角色
function shujuProduce(team){
  const list=shujuChars(team);
  if(!list.length) return;
  const total=SHUJU_GAIN[Math.min(6,list.length)]||0;
  if(total<=0) return;
  const cnt={}; let sum=0;
  for(const x of list){
    const els=[];
    if(x.element) els.push(x.element);
    if(x.element2) els.push(x.element2);
    // 回声谣产出的交感能量记为【万能交感能量】，任何属性都能花
    const uniq=(x.skillType==='everecho')?['万能']:Array.from(new Set(els));
    for(const e of uniq){
      if(e!=='万能' && SHUJU_ELES.indexOf(e)<0) continue;
      cnt[e]=(cnt[e]||0)+1; sum++;
    }
  }
  const keys=Object.keys(cnt);
  let given=0;
  if(!sum){ addEnergy(team,'智',total); }
  else{
    keys.forEach((e,i)=>{
      const v=(i===keys.length-1)?(total-given):Math.round(total*cnt[e]/sum);
      given+=v;
      if(v>0) addEnergy(team,e,v);
    });
  }
  const lead=list[0];
  // 每次产出后 10 秒清空：以首次产出为起点开始倒数，之后按 10 秒周期归零
  if(shujuWipe[team]==null) shujuWipe[team]=SHUJU_WIPE;
  addText(lead.x,lead.y-lead.r-64,'交感能量 +'+total,SHUJU_COLOR);
  burst(lead.x,lead.y,SHUJU_COLOR,10);
}
// 等级：唤起按发动次数+1，耗能按真花出去的点数+1，首次触发后 10 秒清空
function shujuGainLv(team,callDelta,costDelta){
  const lv=shujuLv[team]||(shujuLv[team]={call:0,cost:0,t:0});
  if(lv.t<=0) lv.t=TUNE_RESET;
  lv.call=Math.min(99,lv.call+callDelta);
  lv.cost=Math.min(99,lv.cost+costDelta);
}
function shujuLvTick(dt){
  for(let t=0;t<4;t++){
    const lv=shujuLv[t]; if(!lv) continue;
    if(lv.t>0){
      lv.t-=dt;
      if(lv.t<=0){ lv.t=0; lv.call=0; lv.cost=0; }
    }
  }
}
// 【嘲讽】优先级最高：嘲讽者先占目标位，名额不够再按技能自己的规则补其他人
function nearestFoes(owner,n){
  const all=foesOf(owner).sort((a,c)=>Math.hypot(a.x-owner.x,a.y-owner.y)-Math.hypot(c.x-owner.x,c.y-owner.y));
  const tk=all.filter(b=>isTaunting(b));
  const order=tk.length ? tk.concat(all.filter(b=>!isTaunting(b))) : all;
  return order.slice(0,n);
}
function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function randomFoes(owner,n){
  const all=foesOf(owner);
  const tk=shuffleArr(all.filter(b=>isTaunting(b)));
  const rest=shuffleArr(all.filter(b=>!isTaunting(b)));
  return (tk.length?tk.concat(rest):rest).slice(0,n);
}
// 消耗某种属性交感能量：【术具调谐I】让消耗 -1，生效后少一层
// 隐藏规则：本属性不足时，差额由【万能交感能量】补（万能视作任意属性的交感能量）
// 先按本属性垫付，剩下的差值全部从万能里扣；两项加起来仍不够则本条咒语跳过，一点不扣
function shujuPay(b,el,need){
  const layer=b.tune1||0;
  const pay=Math.max(0,need-layer);
  const m=shujuEnergy[b.team]||(shujuEnergy[b.team]={});
  const own=m[el]||0;
  const uni=m['万能']||0;
  const fromOwn=Math.min(own,pay);
  const gap=pay-fromOwn;               // 本属性补不上的差值
  const fromUni=Math.min(uni,gap);     // 差值交给万能
  if(fromOwn+fromUni<pay) return -1;   // 连万能都补不满：整条跳过，不扣任何能量
  m[el]=own-fromOwn;
  m['万能']=uni-fromUni;
  if(layer>0) b.tune1=layer-1;
  // 己方每消耗 6 点交感能量：回声谣立即放一次【往日所寻求】
  if(pay>0) echoOnCost(b.team,pay);
  return pay;
}
// 术具咒语：按编号顺序，每 0.5 秒轮一个；能量不够直接跳过
function shujuCast(b){
  if(!b || b.hp<=0) return;
  if(b.skillType==='twins'){
    if(b.sub==='L') spellTwinRay(b); else spellTwinStars(b);
  }else if(b.skillType==='coppelia') spellEnamel(b);
  else if(b.skillType==='regulars') spellSonic(b);
  else if(b.skillType==='everecho') spellEcho(b);
}
function shujuCycleTick(team,dt){
  const list=shujuChars(team).sort((a,b)=>a.id-b.id);
  const c=shujuCycle[team]||(shujuCycle[team]={t:0,idx:0});
  if(!list.length) return;
  c.t-=dt;
  if(c.t>0) return;
  c.t=SPELL_GAP;
  // 【左伶】【右伶】共享同一角色编号：轮到该编号时两只同时出手
  const groups=[];
  for(const x of list){
    const g=groups[groups.length-1];
    if(g && g[0].id===x.id) g.push(x); else groups.push([x]);
  }
  if(c.idx>=groups.length) c.idx=0;
  const grp=groups[c.idx];
  c.idx=(c.idx+1)%groups.length;
  // 轮到该编号出手时，先判定同调值是否已满（满 100 当场发动爆发），再放【术具咒语】
  for(const x of grp){
    if(!x || x.hp<=0 || balls.indexOf(x)<0) continue;
    shujuBurst(x);
  }
  for(const x of grp){ if(x && x.hp>0 && balls.indexOf(x)>=0) shujuCast(x); }
}
// 【聚合射线】：左伶，3 点岩系能量
function spellTwinRay(b){
  const need=3;
  const lv=shujuLv[b.team]||{call:0,cost:0,t:0};
  const dmg=Math.round(b.atk)+lv.cost*2;
  const pay=shujuPay(b,'岩',need);
  if(pay<0) return;
  shujuGainLv(b.team,1,pay);
  addTune(b,8+pay);   // 每消耗 1 点交感能量，同调值额外 +1
  spiritTeamSkill(b);
  addText(b.x,b.y-b.r-46,'聚合射线 '+dmg,SHUJU_COLOR);
  burst(b.x,b.y,SHUJU_COLOR,14);
  for(const t of nearestFoes(b,3)) fireTwinLaser(b,t,Math.max(1,dmg));
  shake=Math.max(shake,3);
  twinSpellTrim(b);
}
// 【迈向群星】：右伶，1 点星系能量
function spellTwinStars(b){
  const need=1;
  const lv=shujuLv[b.team]||{call:0,cost:0,t:0};
  const dmg=12+lv.call*1;
  const pay=shujuPay(b,'星',need);
  if(pay<0) return;
  shujuGainLv(b.team,1,pay);
  addTune(b,5+pay);   // 每消耗 1 点交感能量，同调值额外 +1
  spiritTeamSkill(b);
  addText(b.x,b.y-b.r-46,'迈向群星 '+dmg,'#9fd0ff');
  burst(b.x,b.y,'#9fd0ff',12);
  for(const t of nearestFoes(b,2)) fireTwinStar(b,t,Math.max(1,dmg));
  twinSpellTrim(b);
}
// 【术具】黄色音符：必定命中，飞行速度 800
const NOTE_SPEED=800;
const NOTE_COLOR='#ffd94a';
// 双生舞伶特效参数
const TWIN_STAR_SPEED=1200;      // 迈向群星：星星飞行速度
const TWIN_STAR_BOUNCE=3;        // 弹墙 3 次
const TWIN_SPIN_DUR=0.8;         // 合体前环绕停顿
const TWIN_ARROW_SPEED=1400;     // 尤里卡灰箭：左右伶交替射出，速度 1400
const TWIN_SPIN_COLOR='#ff9fe0';
const TWIN_STAR_COLOR='#9fd0ff';
const TWIN_ARROW_COLOR='#9aa7b5';
let twinSpins=[];

// 【聚合射线】：向最近的三名敌人打出激光，必定命中
function fireTwinLaser(b,t,dmg){
  if(!b||b.hp<=0||!t||t.hp<=0) return;
  projs.push({type:'laser',x1:b.x,y1:b.y,x2:t.x,y2:t.y,
    x:b.x,y:b.y,vx:0,vy:0,ang:0,
    life:0.34,dur:0.34,size:6,color:SHUJU_COLOR,owner:b});
  addText(t.x,t.y-t.r-34,'聚合射线 -'+LRv(dmg),SHUJU_COLOR);
  applyDamage(t,dmg,SHUJU_COLOR,b);
  burst(t.x,t.y,SHUJU_COLOR,16);
}
// 【迈向群星】：丢出星星，速度 1200，撞墙弹三次
function fireTwinStar(b,t,dmg){
  if(!b||b.hp<=0||!t||t.hp<=0) return;
  const ang=Math.atan2(t.y-b.y,t.x-b.x);
  projs.push({type:'star',
    x:b.x+Math.cos(ang)*(b.r+10), y:b.y+Math.sin(ang)*(b.r+10),
    vx:Math.cos(ang)*TWIN_STAR_SPEED, vy:Math.sin(ang)*TWIN_STAR_SPEED,
    ang,dmg:dmg,size:16,color:TWIN_STAR_COLOR,owner:b,life:3.4,
    bounces:TWIN_STAR_BOUNCE,spin:0});
}
function updateStar(pr,dt){
  pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt; pr.spin=(pr.spin||0)+dt*16;
  const pad=pr.size*0.8;
  let bounced=false;
  if(pr.x-L<pad){ pr.x=L+pad; pr.vx=Math.abs(pr.vx); bounced=true; }
  if(R-pr.x<pad){ pr.x=R-pad; pr.vx=-Math.abs(pr.vx); bounced=true; }
  if(pr.y-T<pad){ pr.y=T+pad; pr.vy=Math.abs(pr.vy); bounced=true; }
  if(B-pr.y<pad){ pr.y=B-pad; pr.vy=-Math.abs(pr.vy); bounced=true; }
  if(bounced){
    pr.ang=Math.atan2(pr.vy,pr.vx);
    pr.bounces-=1;
    burst(pr.x,pr.y,TWIN_STAR_COLOR,10);
    if(pr.bounces<0){ pr.life=0; return; }
  }
  if(pr.life<=0) return;
  for(const t of balls){
    if(t.hp<=0 || t.team===pr.owner.team) continue;
    if(Math.hypot(t.x-pr.x,t.y-pr.y)<t.r+pad*0.62){
      addText(t.x,t.y-t.r-34,'迈向群星 -'+LRv(pr.dmg),TWIN_STAR_COLOR);
      applyDamage(t,pr.dmg,TWIN_STAR_COLOR,pr.owner);
      burst(pr.x,pr.y,TWIN_STAR_COLOR,18);
      pr.life=0; break;
    }
  }
}
// 尤里卡：地图上方飞出的灰色箭头，必定命中
function fireTwinArrow(owner,t,dmg,delay){
  if(!owner||!t||t.hp<=0) return;
  // 左伶的箭从地图左半边上方落下，右伶从右半边，交替时一眼能看出谁在出手
  const isLeft=(owner.sub==='L');
  const mid=(L+R)/2;
  const lo=isLeft?L+70:mid+20;
  const hi=isLeft?mid-20:R-70;
  const sx=lo+Math.random()*Math.max(20,hi-lo);
  const sy=T-30;
  const ang=Math.atan2(t.y-sy,t.x-sx);
  projs.push({type:'garrow',x:sx,y:sy,
    vx:Math.cos(ang)*TWIN_ARROW_SPEED,vy:Math.sin(ang)*TWIN_ARROW_SPEED,
    ang,dmg:dmg,size:17,color:TWIN_ARROW_COLOR,owner:owner,target:t,
    life:5,homing:true,speed:TWIN_ARROW_SPEED,label:'灰箭',
    delay:delay||0});
}
function drawLasers(){
  for(const pr of projs){
    if(pr.type!=='laser') continue;
    const k=Math.max(0,Math.min(1,pr.life/pr.dur));
    g.save();
    g.shadowColor=pr.color; g.shadowBlur=26;
    g.globalAlpha=0.30*k; g.strokeStyle=pr.color; g.lineWidth=pr.size*2.8;
    g.beginPath(); g.moveTo(pr.x1,pr.y1); g.lineTo(pr.x2,pr.y2); g.stroke();
    g.globalAlpha=k; g.strokeStyle='#ffffff'; g.lineWidth=pr.size*0.62;
    g.beginPath(); g.moveTo(pr.x1,pr.y1); g.lineTo(pr.x2,pr.y2); g.stroke();
    g.restore();
  }
}
// 合体前的环绕旋转：两球绕中点快速转 0.8 秒，然后才完成合体
function updateTwinSpins(dt){
  for(const sp of twinSpins){
    sp.t-=dt;
    const k=1-Math.max(0,sp.t)/sp.dur;
    const a=k*Math.PI*2*1.7;
    const rad=54;
    const L1=sp.L, R1=sp.R;
    if(L1 && L1.hp>0){
      L1.x=sp.cx+Math.cos(a)*rad; L1.y=sp.cy+Math.sin(a)*rad;
      L1.vx=0; L1.vy=0;
    }
    if(R1 && R1.hp>0){
      R1.x=sp.cx+Math.cos(a+Math.PI)*rad; R1.y=sp.cy+Math.sin(a+Math.PI)*rad;
      R1.vx=0; R1.vy=0;
    }
  }
  const done=twinSpins.filter(sp=>sp.t<=0);
  if(!done.length) return;
  twinSpins=twinSpins.filter(sp=>sp.t>0);
  for(const sp of done){
    if(sp.L) sp.L.spinT=0;
    if(sp.R) sp.R.spinT=0;
    resolveTwinEureka(sp.L,sp.R);
  }
}
const TWIN_FLASH_COLOR='#e6f2ff';   // 尤里卡合体：银色闪片
const TWIN_STARFALL='#fff0a8';       // 尤里卡合体：环绕星星
function starPath(x,y,r,n){
  n=n||5; g.beginPath();
  for(let i=0;i<n*2;i++){
    const rr=i%2?r*0.42:r;
    const a=-Math.PI/2+i*Math.PI/n;
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    if(i) g.lineTo(px,py); else g.moveTo(px,py);
  }
  g.closePath();
}
// 尤里卡合体期间：银色闪片向外飞散 + 两圈星星绕中点反向旋转
function drawTwinSpins(){
  if(!twinSpins.length) return;
  const now=performance.now();
  for(const sp of twinSpins){
    const k=Math.max(0,Math.min(1,1-Math.max(0,sp.t)/sp.dur));
    const fade=Math.max(0,Math.min(1,sp.t/sp.dur*1.9));
    g.save();
    g.translate(sp.cx,sp.cy);
    // 银色闪片：从中心往外飞，边飞边闪
    for(let i=0;i<28;i++){
      const a=(i*2.399+k*2.4)%(Math.PI*2);
      const r=16+k*(66+(i%5)*22);
      const sz=2.2+(i%3)*1.5;
      const tw=0.42+0.58*Math.abs(Math.sin(now/95+i*1.73));
      g.save();
      g.globalAlpha=fade*0.92*tw;
      g.translate(Math.cos(a)*r,Math.sin(a)*r*0.94);
      g.rotate(a+k*7+i);
      g.shadowColor=TWIN_FLASH_COLOR; g.shadowBlur=13;
      g.fillStyle='#ffffff';
      g.beginPath();
      g.moveTo(0,-sz*2.6); g.lineTo(sz*0.78,0);
      g.lineTo(0,sz*2.6); g.lineTo(-sz*0.78,0);
      g.closePath(); g.fill();
      g.restore();
    }
    // 星星环绕：内圈顺转、外圈逆转
    for(let ring=0;ring<2;ring++){
      const rad=54+ring*28;
      const dir=ring?-1:1;
      const spin=k*Math.PI*2*1.7*dir + (ring?0.6:0);
      const cnt=ring?5:4;
      for(let i=0;i<cnt;i++){
        const a=spin+i*(Math.PI*2/cnt);
        const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
        const sz=ring?7:9.5;
        const tw=0.6+0.4*Math.abs(Math.sin(now/140+i*2.1));
        g.save();
        g.globalAlpha=fade*(ring?0.68:0.95)*tw;
        g.translate(x,y);
        g.rotate(a*1.4+k*3);
        g.shadowColor=TWIN_STARFALL; g.shadowBlur=ring?12:20;
        starPath(0,0,sz,5);
        g.fillStyle=ring?TWIN_STARFALL:'#fffbe6';
        g.fill();
        g.shadowBlur=0;
        g.globalAlpha=fade*0.35*(ring?0.7:1);
        g.strokeStyle='#ffffff'; g.lineWidth=1.1;
        starPath(0,0,sz+2.4,5); g.stroke();
        g.restore();
      }
    }
    // 中心蓄光：越接近合体越亮
    const core=0.18+0.6*k;
    g.globalAlpha=fade*core;
    const grd=g.createRadialGradient(0,0,2,0,0,64+40*k);
    grd.addColorStop(0,'rgba(255,255,255,.95)');
    grd.addColorStop(0.45,'rgba(230,242,255,.42)');
    grd.addColorStop(1,'rgba(230,242,255,0)');
    g.fillStyle=grd;
    g.beginPath(); g.arc(0,0,64+40*k,0,7); g.fill();
    g.restore();
  }
}

const SONIC_NOTE='#8fd0ff';   // 星锑：蓝色音符
function fireNote(b,t,dmg,label,big,tint,fx){
  if(!b || b.hp<=0 || !t || t.hp<=0) return;
  const ang=Math.atan2(t.y-b.y,t.x-b.x);
  const col=tint||NOTE_COLOR;
  projs.push({type:'note',
    x:b.x+Math.cos(ang)*(b.r+10), y:b.y+Math.sin(ang)*(b.r+10),
    vx:Math.cos(ang)*NOTE_SPEED, vy:Math.sin(ang)*NOTE_SPEED,
    ang,dmg:dmg,size:big?18:13,color:col,owner:b,target:t,life:6,
    homing:true,speed:NOTE_SPEED,label:label,big:!!big,tint:tint||null,fx:fx||null});
  burst(b.x,b.y,fx==='echo'?ECHO_COLOR:NOTE_COLOR,big?16:10);
}

// 同调值满 100，轮到自身编号发动【术具咒语】时发动
function shujuBurst(b){
  if(!b || b.hp<=0) return false;
  if(b.skillType==='twins') return burstTwinEureka(b);
  if((b.tune||0)<TUNE_MAX) return false;
  b.tune=0;
  if(b.skillType==='coppelia'){ burstEnamel(b); return true; }
  if(b.skillType==='regulars'){ burstSonic(b); return true; }
  if(b.skillType==='everecho'){ burstEcho(b); echoRefillOver(b); return true; }
  return false;
}
// 【尤里卡时刻】：左右伶同调之和到 100，被攻击时先环绕 0.8 秒完成合体，再炸一次并均分血量重新分裂
function burstTwinEureka(b){
  const o=balls.find(x=>x!==b && x.skillType==='twins' && x.team===b.team && x.hp>0);
  if(!o) return false;
  const sum=(b.tune||0)+(o.tune||0);
  if(sum<TUNE_MAX) return false;
  const L=b.sub==='L'?b:o;
  const R=b.sub==='L'?o:b;
  if(!L||!R) return false;
  if((L.spinT||0)>0 || (R.spinT||0)>0) return false;
  L.tune=0; R.tune=0;
  L.spinT=TWIN_SPIN_DUR; R.spinT=TWIN_SPIN_DUR;
  const cx=(L.x+R.x)/2, cy=(L.y+R.y)/2;
  twinSpins.push({L:L,R:R,cx:cx,cy:cy,t:TWIN_SPIN_DUR,dur:TWIN_SPIN_DUR});
  seTwinMerge();
  addText(cx,cy-72,'合体!',TWIN_SPIN_COLOR);
  burst(cx,cy,TWIN_SPIN_COLOR,22);
  shake=Math.max(shake,4);
  return true;
}
// 环绕结束：真正合体 → 尤里卡时刻 → 均分血量重新分裂
function resolveTwinEureka(L,R){
  if(!L||!R) return;
  if(L.hp<=0 || R.hp<=0) return;
  const team=L.team;
  const e=shujuEnergy[team]||(shujuEnergy[team]={});
  // 尤里卡时刻的消耗也算【万能交感能量】
  const spent=(e['岩']||0)+(e['星']||0)+(e['万能']||0);
  e['岩']=0; e['星']=0; e['万能']=0;
  const atkSum=Math.round(L.atk+R.atk);
  let dmg=atkSum+spent;
  let count=1+Math.min(2,Math.floor(spent/3));
  if(spent>=12) dmg*=2;
  const cx=(L.x+R.x)/2, cy=(L.y+R.y)/2;
  seTwinEureka();
  addText(cx,cy-72,'尤里卡时刻 '+dmg,SHUJU_COLOR);
  burst(cx,cy,SHUJU_COLOR,34); shake=Math.max(shake,9);
  spiritTeamSkill(L);
  const foes=randomFoes(L,count);
  for(const t of foes){
    const rockBonus=ctrBonusOf({element:'岩',team:team,skillType:'twins'},t);
    const starBonus=ctrBonusOf({element:'星',team:team,skillType:'twins'},t);

  const pool=foes.filter(x=>targets.indexOf(x)<0);
  const need=deliver?3:2;
  while(targets.length<need && pool.length) targets.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  if(!targets.length) return;
  // 【复盘反馈】试错记录100% + 每层设计升版+1；【交付反馈】150% + 每层+2
  const tr=b.trial||0, ly=b.layer||0;
  spiritAction(b,true);   // 【反击】：顺带结算【可行性推演】的加伤
  const feas=b.feasBoost||0;
  b.feasBoost=0; b.feasBoostT=0;
  const d=Math.max(1,Math.round((deliver?(ly*2+tr*0.5):ly)+feas));
  sePlay(deliver?'corner1':'corner2');
  addText(b.x,b.y-b.r-46,(deliver?'交付反馈 ':'复盘反馈 ')+d,b.color);
  for(const t of targets){
    // 复盘反馈丢小方块，交付反馈丢更大的立方体
    const ang=Math.atan2(t.y-b.y,t.x-b.x);
    projs.push({type:'block',
      x:b.x+Math.cos(ang)*(b.r+12), y:b.y+Math.sin(ang)*(b.r+12),
      vx:Math.cos(ang)*BLOCK_SPEED, vy:Math.sin(ang)*BLOCK_SPEED,
      ang,dmg:d,size:deliver?16:10,color:TRIAL_COLOR,owner:b,target:t,life:1.8,
      homing:true,speed:BLOCK_SPEED,big:deliver,delay:0.5,
      label:deliver?'交付反馈':'复盘反馈'});
  }
  burst(b.x,b.y,b.color,16);
  if(deliver){
    b.layer=0;
    for(const bb of balls){ if(bb.team===b.team && bb.hp>0) bb.trial=0; }
    b.trial=0;
    addText(b.x,b.y-b.r-64,'清空升版与试错','#ffd76b');
  }
}


/* ---- 小瑞安侬 / 肥鸟尘酿鹰 ---- */
function eagleRemove(team,quiet){
  // 鹰是共享血量的临时召唤物：散场时直接从场上摘掉，
  // 否则旧的鹰留在 balls 里，HUD 每召一次就多挂一条，也不会随主人一起消失
  for(let i=balls.length-1;i>=0;i--){
    const s=balls[i];
    if(s.skillType!=='birdie' || s.team!==team) continue;
    if(!quiet && s.hp>0) addText(s.x,s.y-s.r-30,'鹰散了',RYAN_COLOR);
    s.hp=0; s.dead=true;
    balls.splice(i,1);
  }
  hudDirty=true;
}
function summonEagle(m){
  spiritTeamSkill(m);
  // 同一时间只留一只
  eagleRemove(m.team,true);
  const e=makeBall('birdie',m.x-78,m.y,m.team,{name:'肥鸟尘酿鹰',element:'all',color:'#f0a6c8',r:30,
    hp:Math.max(1,m.hp),maxhp:m.maxhp,atk:m.atk,passion:0});
  e.shareHost=m;
  balls.push(e);
  m.eagleT=EAGLE_DUR;
  // 鹰在场：己方全体基础生命 +150（造成伤害 +2 在 applyDamage 里按鹰是否在场实时判定）
  // 按每个球自己记下的加成量做，重复召唤不会叠加，结束后也只扣回当初加的那一份
  for(const b of balls){
    if(b.team!==m.team || b.skillType==='birdie') continue;
    if(b.eagleHpAdd>0) continue;
    // 【芦草结】专属：BUFF 只算在「芦草结」形态上，惠姑/种子不享受，
    // 复活时按 reedBaseMax + eagleHpAdd 还原，反复枯萎重生也不会丢
    if(b.skillType==='reed'){
      if(!b.reedBaseMax) b.reedBaseMax=Math.max(1,b.maxhp-(b.eagleHpAdd||0));
      b.eagleHpAdd=EAGLE_BUFF_HP;
      if(b.reedMode==='reed'){
        b.maxhp+=EAGLE_BUFF_HP;
        b.hp=Math.min(b.maxhp,b.hp+EAGLE_BUFF_HP);
        if(b.hp>0) addText(b.x,b.y-b.r-58,'鹰·生命上限 +'+EAGLE_BUFF_HP,RYAN_COLOR);
      }
      continue;
    }
    // 提升上限的那部分自带血量：上限和当前生命一起加，不是只抬上限
    b.maxhp+=EAGLE_BUFF_HP;
    b.hp=Math.min(b.maxhp,b.hp+EAGLE_BUFF_HP);
    b.eagleHpAdd=EAGLE_BUFF_HP;
    if(b.hp>0) addText(b.x,b.y-b.r-58,'鹰·生命上限 +'+EAGLE_BUFF_HP,RYAN_COLOR);
  }
  // 召唤那一刻：己方全体闪一次鹰爪图案
  for(const b of balls){
    if(b.team!==m.team || b.hp<=0) continue;
    b.eagleClawT=MARK_STATUS_DUR;
  }
  hudDirty=true;
  seRhianEagle();
  addText(m.x,m.y-m.r-40,'召唤肥鸟尘酿鹰',RYAN_COLOR);
  burst(m.x,m.y,RYAN_COLOR,20);
}
function eagleBuffOff(m){
  if(!m) return;
  for(const b of balls){
    if(b.team!==m.team || b.skillType==='birdie') continue;
    // 只扣自己身上真的加过的那一份；死过的球没加过就不会被白扣
    const hAdd=b.eagleHpAdd||0;
    if(hAdd<=0) continue;
    // 【芦草结】：惠姑/种子形态压根没把加成算进 maxhp，只清标记；
    // 只有满状态才真的扣回，避免把 400 血的惠姑扣成 250
    if(b.skillType==='reed'){
      if(b.reedMode==='reed'){
        b.maxhp=Math.max(1,b.maxhp-hAdd);
        if(b.hp>b.maxhp) b.hp=b.maxhp;
      }
      b.eagleHpAdd=0;
      continue;
    }
    b.maxhp=Math.max(1,b.maxhp-hAdd);
    b.eagleHpAdd=0;
    if(b.hp>b.maxhp) b.hp=b.maxhp;
  }
  hudDirty=true;
}

/* ---- 梁月 / 强梁 ---- */
function summonStrong(ly){

  // 每次重新召唤都直接回满血
  const s=makeBall('qiangliang',ly.x+70,ly.y,ly.team,{atk:ly.atk,hp:ly.maxhp,maxhp:ly.maxhp,r:36,passion:0});
  balls.push(s);
  ly.strongT=LIANG_DUR;
  ly.claw=0; ly.hitSelf=0; ly.hitStrong=0; ly.snapSelf=0; ly.snapStrong=0;

  seLiangSummon();
